name: Bug report
description: A crash, a wrong error, or output that is wrong on its own terms
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If vep-rs runs cleanly but its output differs from Ensembl VEP's, use the **Output differs from Ensembl VEP** form instead. Report security vulnerabilities privately per [SECURITY.md](https://github.com/natera-open-source/vep-rs/blob/main/SECURITY.md), not here.
  - type: input
    id: version
    attributes:
      label: vep-rs version
      description: Output of `vep --version`, or the commit you built from.
      placeholder: vep 0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Release binary
        - Container image (ghcr.io)
        - Built from source
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and CPU. The measured Linux archives need AVX2 on x86_64 and SVE on aarch64; the generic archives and the container image's multi-platform tags run on almost any 64-bit CPU. An illegal-instruction crash on an older CPU is covered under [CPU floor](https://github.com/natera-open-source/vep-rs/blob/main/docs/getting-started/installation.md#cpu-floor) on the Installation page.
      placeholder: Ubuntu 24.04, x86_64
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The full command line you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: cache
    attributes:
      label: Cache and reference
      description: Assembly and Ensembl release, whether the JSON cache came from `vep-cache-builder` or from converting an Ensembl VEP cache, and the `--fasta` file if you passed one.
      placeholder: GRCh38, release 116, built with vep-cache-builder
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead. Paste errors and log output as text, and add `--verbose` if it shows more.
    validations:
      required: true
  - type: dropdown
    id: divergences
    attributes:
      label: Intended divergences
      description: "[docs/intended-divergences.md](https://github.com/natera-open-source/vep-rs/blob/main/docs/intended-divergences.md) lists every behaviour where vep-rs deliberately differs from Ensembl VEP. This report touches an entry when it asks for a recorded behaviour to change or go, or asks vep-rs to match Ensembl VEP where the index says it deliberately does not. A new intended divergence may be proposed here too."
      options:
        - Touches none of the intended divergences
        - Touches existing intended divergences (named below, with the reasoning)
        - Proposes a new intended divergence (described below)
    validations:
      required: true
  - type: textarea
    id: divergence-entries
    attributes:
      label: Entries or proposed divergence
      description: "For existing entries, one line each: the entry in backticks as the index's first column names it (a defect letter such as `B`, or a difference's name as written there), then what should change and why the index's reasoning is wrong for this case. For a proposed divergence: the input, what Ensembl VEP and vep-rs each write, and why vep-rs's output is the one to keep."
      placeholder: "`B`: remove it, because ..."
  - type: textarea
    id: repro
    attributes:
      label: Input that reproduces it
      description: The smallest input you can share, ideally a few VCF lines. Do not post patient or other identifiable data. If the bug reproduces against the bundled corpus in `tests/golden/`, say so.
      render: text
