name: Output differs from Ensembl VEP
description: vep-rs and Ensembl VEP give different annotations for the same input
labels: ["bug", "concordance"]
body:
  - type: markdown
    attributes:
      value: |
        vep-rs matches Ensembl VEP (`ensemblorg/ensembl-vep`, release 116) exactly, except for a small set of documented divergences, most of them Ensembl VEP defects that vep-rs deliberately does not reproduce. Before filing, check three things. [docs/intended-divergences.md](https://github.com/natera-open-source/vep-rs/blob/main/docs/intended-divergences.md) describes the documented divergence classes. [docs/cli/compatibility.md](https://github.com/natera-open-source/vep-rs/blob/main/docs/cli/compatibility.md#accepted-without-effect) lists flags that are accepted but not implemented. Each `tests/golden/<release>/<assembly>/manifest.json` lists the consequence keys whose terms are documented to differ.
  - type: input
    id: version
    attributes:
      label: vep-rs version
      description: Output of `vep --version`, or the commit you built from.
    validations:
      required: true
  - type: input
    id: perl-vep
    attributes:
      label: Ensembl VEP version
      description: Release, or the Docker image tag.
      placeholder: ensemblorg/ensembl-vep:release_116.2
    validations:
      required: true
  - type: input
    id: image-digest
    attributes:
      label: Ensembl VEP image digest
      description: The `sha256:` digest of the image you ran, from `docker images --digests ensemblorg/ensembl-vep`. Leave empty if you ran Ensembl VEP outside Docker and say so under Commands.
      placeholder: "sha256:..."
  - type: textarea
    id: cache
    attributes:
      label: Cache
      description: Assembly, Ensembl release and the cache version its `info.txt` (Ensembl VEP) or `info.json` (vep-rs) states. For vep-rs, say whether the JSON cache came from `vep-cache-builder` or from converting the same Ensembl VEP cache.
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands
      description: Both command lines exactly as run, vep-rs and Ensembl VEP, with every flag and path, so a maintainer can run them unchanged against the same inputs.
      render: shell
    validations:
      required: true
  - type: textarea
    id: variants
    attributes:
      label: Variants
      description: The VCF lines where the output differs. Do not post patient or other identifiable data.
      render: text
    validations:
      required: true
  - type: textarea
    id: diff
    attributes:
      label: The difference
      description: The rows from each tool, or just the columns that differ (for example Consequence, HGVSc, or a plugin field).
    validations:
      required: true
  - type: dropdown
    id: divergences
    attributes:
      label: Intended divergences
      description: "[docs/intended-divergences.md](https://github.com/natera-open-source/vep-rs/blob/main/docs/intended-divergences.md) lists every behaviour where vep-rs deliberately differs from Ensembl VEP. This report touches an entry when it asks for a recorded behaviour to change or go, or asks vep-rs to match Ensembl VEP where the index says it deliberately does not. A new intended divergence may be proposed here too."
      options:
        - Touches none of the intended divergences
        - Touches existing intended divergences (named below, with the reasoning)
        - Proposes a new intended divergence (described below)
    validations:
      required: true
  - type: textarea
    id: divergence-entries
    attributes:
      label: Entries or proposed divergence
      description: "For existing entries, one line each: the entry in backticks as the index's first column names it (a defect letter such as `B`, or a difference's name as written there, inner backticks dropped), then what should change and why the index's reasoning is wrong for this case. For a proposed divergence: the input, what Ensembl VEP and vep-rs each write, and why vep-rs's output is the one to keep."
      placeholder: "`B`: remove it, because ..."
