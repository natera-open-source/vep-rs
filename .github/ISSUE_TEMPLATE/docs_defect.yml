name: Documentation defect
description: A page, the README or a help text says something the code, Ensembl VEP or a command's output contradicts
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        The pages live under `docs/` and render at https://natera-open-source.github.io/vep-rs/ (the site root describes the latest release, `/main/` the development preview). `docs/cli-reference.md` and the pages under `docs/cli/` are generated from the help text in `crates/vep-cli/src/args.rs`, so a defect there is a defect in the help text.
  - type: input
    id: page
    attributes:
      label: Page
      description: The file under `docs/`, or the README, and the channel you read (the release root or `/main/`).
      placeholder: docs/cache-setup.md, release root
    validations:
      required: true
  - type: textarea
    id: sentence
    attributes:
      label: The sentence
      description: The text as the page states it, quoted.
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
      description: What the sentence should say instead, if you know.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: What shows it
      description: The command you ran and its output, the Ensembl VEP source as `Module.pm:line`, the test, or the file in the repository that contradicts the page.
    validations:
      required: true
  - type: dropdown
    id: divergences
    attributes:
      label: Intended divergences
      description: "[docs/intended-divergences.md](https://github.com/natera-open-source/vep-rs/blob/main/docs/intended-divergences.md) lists every behaviour where vep-rs deliberately differs from Ensembl VEP. This report touches an entry when it asks for a recorded behaviour to change or go, or asks vep-rs to match Ensembl VEP where the index says it deliberately does not. A new intended divergence may be proposed here too."
      options:
        - Touches none of the intended divergences
        - Touches existing intended divergences (named below, with the reasoning)
        - Proposes a new intended divergence (described below)
    validations:
      required: true
  - type: textarea
    id: divergence-entries
    attributes:
      label: Entries or proposed divergence
      description: "For existing entries, one line each: the entry in backticks as the index's first column names it (a defect letter such as `B`, or a difference's name as written there), then what should change and why the index's reasoning is wrong for this case. For a proposed divergence: the input, what Ensembl VEP and vep-rs each write, and why vep-rs's output is the one to keep."
      placeholder: "`B`: remove it, because ..."
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'm willing to open a pull request for this.
