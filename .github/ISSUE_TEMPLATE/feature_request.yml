name: Feature request
description: An Ensembl VEP flag you need, a new output, or some other change; a plugin has its own form
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: What you are trying to do and what stops you. If it's an Ensembl VEP flag, name it and say how your pipeline uses it; a plugin goes on the **Plugin request** form, a speed or memory figure on **Performance report**.
    validations:
      required: true
  - type: dropdown
    id: divergences
    attributes:
      label: Intended divergences
      description: "[docs/intended-divergences.md](https://github.com/natera-open-source/vep-rs/blob/main/docs/intended-divergences.md) lists every behaviour where vep-rs deliberately differs from Ensembl VEP. This report touches an entry when it asks for a recorded behaviour to change or go, or asks vep-rs to match Ensembl VEP where the index says it deliberately does not. A new intended divergence may be proposed here too."
      options:
        - Touches none of the intended divergences
        - Touches existing intended divergences (named below, with the reasoning)
        - Proposes a new intended divergence (described below)
    validations:
      required: true
  - type: textarea
    id: divergence-entries
    attributes:
      label: Entries or proposed divergence
      description: "For existing entries, one line each: the entry in backticks as the index's first column names it (a defect letter such as `B`, or a difference's name as written there, inner backticks dropped), then what should change and why the index's reasoning is wrong for this case. For a proposed divergence: the input, what Ensembl VEP and vep-rs each write, and why vep-rs's output is the one to keep."
      placeholder: "`B`: remove it, because ..."
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: "Optional. What the change would look like: flag names, output fields, an example."
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'm willing to open a pull request for this.
