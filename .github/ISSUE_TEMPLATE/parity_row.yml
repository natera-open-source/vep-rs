name: Parity row
description: Close one open row of tests/parity/matrix.tsv (maintainers and agents)
title: "Close the `<item>` parity row"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        One issue per row of `tests/parity/matrix.tsv`. The columns are defined in `tests/parity/README.md`, and the recipe is `.claude/skills/close-parity-row/SKILL.md`.
  - type: dropdown
    id: carried
    attributes:
      label: Already carried elsewhere
      description: A release branch may carry this row before it reaches `main`. Ask here before writing code; in-flight maintainer work closes a duplicate with credit rather than merging it.
      options:
        - "No open pull request or release branch names this row, as far as I can see"
        - "Unknown: please check before I start"
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Row
      description: The row's `item`, exactly as it appears in the matrix.
      placeholder: AlphaMissense
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target
      description: The row's `target` column. To change it, open a target decision first.
      options:
        - implemented
        - documented_subset
        - accepted_noop
        - error
        - removed
    validations:
      required: true
  - type: input
    id: perl_reference
    attributes:
      label: Ensembl VEP reference
      description: The `perl_reference` column, narrowed to the sub and line range where you know it.
      placeholder: Config.pm::read_config_from_file, lines 960-975
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Behaviour to match
      description: What Ensembl VEP does for this item, each claim cited as `Module.pm:line`. For `error`, the exact refusal message vep-rs should print.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests that will prove it
      description: "Test 1 as `<path>.rs::<fn>`. For `implemented` and `documented_subset`, also the corpus and flag set for Test 2, and whether its reference outputs still need an Ensembl VEP run."
    validations:
      required: true
  - type: dropdown
    id: oracle
    attributes:
      label: Needs an Ensembl VEP run
      description: Whether closing the row needs Docker and an Ensembl VEP 116 cache, for new expected outputs or the concordance smoke.
      options:
        - "No"
        - "Yes"
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: divergences
    attributes:
      label: Intended divergences
      description: "[docs/intended-divergences.md](https://github.com/natera-open-source/vep-rs/blob/main/docs/intended-divergences.md) lists every behaviour where vep-rs deliberately differs from Ensembl VEP. A report or request touches an entry when it asks for a recorded behaviour to change or go, argues against the entry's reasoning, or asks vep-rs to match Ensembl VEP where the index says it deliberately does not. A new intended divergence may be proposed here too."
      options:
        - Touches none of the intended divergences
        - Touches existing intended divergences (named below, with the reasoning)
        - Proposes a new intended divergence (described below)
    validations:
      required: true
  - type: textarea
    id: divergence-entries
    attributes:
      label: Entries or proposed divergence
      description: "For existing entries, one line each: the entry in backticks as the index's first column names it (the text of its row's first cell, inner backticks dropped), then what should change and why the index's reasoning is wrong for this case. For a proposed divergence: the input, what Ensembl VEP and vep-rs each write, and why vep-rs's output is the one to keep."
      placeholder: "`<entry>`: remove it, because ..."
