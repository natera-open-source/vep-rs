name: Plugin request
description: An Ensembl VEP plugin vep-rs does not run, or runs without a field you need
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        [docs/plugins.md](https://github.com/natera-open-source/vep-rs/blob/main/docs/plugins.md) lists the plugins vep-rs runs and what each needs. A plugin is ported from its Ensembl VEP source, so the fields below name that source and the data it reads; [docs/developers/writing-a-plugin.md](https://github.com/natera-open-source/vep-rs/blob/main/docs/developers/writing-a-plugin.md) describes how a plugin is added.
  - type: dropdown
    id: carried
    attributes:
      label: Already carried elsewhere
      description: A release branch may carry this plugin before it reaches `main`. Ask here before writing code; in-flight maintainer work closes a duplicate with credit rather than merging it.
      options:
        - "A request only: I am not planning to port it"
        - "No open pull request or release branch names this plugin, as far as I can see"
        - "Unknown: please check before I start"
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin
      description: The plugin's name as Ensembl VEP's `--plugin` takes it.
      placeholder: UTRAnnotator
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Ensembl VEP plugin source
      description: The `.pm` file in the `Ensembl/VEP_plugins` repository, at the `release/116` branch.
      placeholder: https://github.com/Ensembl/VEP_plugins/blob/release/116/UTRAnnotator.pm
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data the plugin reads
      description: The data files it needs, where they come from, their size, and the licence they are distributed under. Data behind a sign-in or a commercial licence is never committed to the repository, so say how a test could run without it.
    validations:
      required: true
  - type: textarea
    id: fields
    attributes:
      label: Fields you need
      description: The output fields the plugin adds that your pipeline reads, and the flags you pass it. If vep-rs runs the plugin but a field is missing or differs, use the **Output differs from Ensembl VEP** form instead.
    validations:
      required: true
  - type: dropdown
    id: divergences
    attributes:
      label: Intended divergences
      description: "[docs/intended-divergences.md](https://github.com/natera-open-source/vep-rs/blob/main/docs/intended-divergences.md) lists every behaviour where vep-rs deliberately differs from Ensembl VEP. A report or request touches an entry when it asks for a recorded behaviour to change or go, argues against the entry's reasoning, or asks vep-rs to match Ensembl VEP where the index says it deliberately does not. A new intended divergence may be proposed here too."
      options:
        - Touches none of the intended divergences
        - Touches existing intended divergences (named below, with the reasoning)
        - Proposes a new intended divergence (described below)
    validations:
      required: true
  - type: textarea
    id: divergence-entries
    attributes:
      label: Entries or proposed divergence
      description: "For existing entries, one line each: the entry in backticks as the index's first column names it (the text of its row's first cell, inner backticks dropped), then what should change and why the index's reasoning is wrong for this case. For a proposed divergence: the input, what Ensembl VEP and vep-rs each write, and why vep-rs's output is the one to keep."
      placeholder: "`<entry>`: remove it, because ..."
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'm willing to open a pull request for this.
