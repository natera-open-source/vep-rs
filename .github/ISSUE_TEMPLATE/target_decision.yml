name: Target decision
description: A row of tests/parity/matrix.tsv whose target the Ensembl VEP source, the code or another row contradicts
title: "Target decision: `<item>`"
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        A row's `target` is the maintainers' call. When the Ensembl VEP source shows the target is wrong, or another row contradicts it, report it here with the evidence and leave the row as it is. Two examples: an `error` row that Ensembl VEP's own behaviour makes an `accepted_noop`; an `implemented` row that needs the Ensembl database, which belongs under `error` as the `database` row does. The columns are defined in `tests/parity/README.md`.
  - type: input
    id: item
    attributes:
      label: Row
      description: The row's `item`, exactly as it appears in the matrix.
    validations:
      required: true
  - type: dropdown
    id: current
    attributes:
      label: Current target
      options:
        - implemented
        - documented_subset
        - accepted_noop
        - error
        - removed
        - excluded
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The Ensembl VEP source that contradicts the target, cited as `Module.pm:line` at `release/116.2`, with what it does; or the contradicting row and the behaviour the two rows cannot both have; or the code path that shows it.
    validations:
      required: true
  - type: dropdown
    id: proposed
    attributes:
      label: Target you propose
      options:
        - implemented
        - documented_subset
        - accepted_noop
        - error
        - removed
        - excluded
        - "Unsure: the evidence rules out the current target only"
    validations:
      required: true
  - type: dropdown
    id: divergences
    attributes:
      label: Intended divergences
      description: "[docs/intended-divergences.md](https://github.com/natera-open-source/vep-rs/blob/main/docs/intended-divergences.md) lists every behaviour where vep-rs deliberately differs from Ensembl VEP. This report touches an entry when it asks for a recorded behaviour to change or go, or asks vep-rs to match Ensembl VEP where the index says it deliberately does not. A new intended divergence may be proposed here too."
      options:
        - Touches none of the intended divergences
        - Touches existing intended divergences (named below, with the reasoning)
        - Proposes a new intended divergence (described below)
    validations:
      required: true
  - type: textarea
    id: divergence-entries
    attributes:
      label: Entries or proposed divergence
      description: "For existing entries, one line each: the entry in backticks as the index's first column names it (a defect letter such as `B`, or a difference's name as written there), then what should change and why the index's reasoning is wrong for this case. For a proposed divergence: the input, what Ensembl VEP and vep-rs each write, and why vep-rs's output is the one to keep."
      placeholder: "`B`: remove it, because ..."
  - type: textarea
    id: rows
    attributes:
      label: Other rows affected
      description: Rows that would change state or target with this decision, and the tests that name them.
