name: Admission

# Holds every pull request to the admission policy in CONTRIBUTING.md (Pull Requests): current with
# `main`, its tests included, every commit signed off, the model that wrote it declared, the
# description in the template's shape with its intended-divergences statement, a changelog line for
# a crate change, the workflows left to the maintainers, the parity matrix resolving, and after CI
# every required check green. A miss is one comment with the fixes, edited in place on each run, and
# closes the pull request unless its author is a maintainer or a bot, the `admission-override` label
# is set, it is a draft, or it was opened before this workflow landed; a sign-off miss, and the
# divergences miss on a pull request opened before that rule landed, are reported without a close.
# The author reopens it once fixed. An issue is held to the intended-divergences choice its form
# carries with a label and one comment, never a close.
#
# `pull_request_target` runs in this repository's context with the write token, at once for a
# fork, so the job never checks out or executes anything from the pull request: the checkout is
# the base branch, the contribution is read through the REST API and as git objects, and the
# parity checker that reads the contributed tree is the base branch's own. The test result comes
# from the CI workflow's own run (the usual `pull_request` event, held for a first-time fork until
# a maintainer allows it) through `workflow_run`, judged only while that run's head is still the
# pull request's head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]
  issues:
    types: [opened, edited]
  # A maintainer's hand run of the static checks on one pull request, from the default branch.
  workflow_dispatch:
    inputs:
      pr_number:
        description: The pull request number to check
        required: true
        type: number

# A label is an Issues write, the comment and the close are Pull requests writes.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  admission:
    name: Admission
    # A `model: <name>` label is one this job sets or removes, so the events it raises run nothing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       !((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
         startsWith(github.event.label.name, 'model: ')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One run per pull request at a time, shared with the after-CI job below. A running job is never
    # cancelled, since a cancelled after-CI judgement would not be repeated, and a run for a head
    # that has moved exits on its own once it reads the pull request again. GitHub keeps one waiting
    # job per group and replaces it when another arrives, so a judgement waiting behind a running
    # job can be lost to a later event on the same pull request.
    concurrency:
      group: admission-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false
    steps:
      # No `ref:` input: the checkout is the base branch; the full history is needed to test
      # whether the pull request's head contains the base tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The dispatch input reaches the script through the environment, never the command line.
      - run: |
          if [ -n "$PR_NUMBER" ]; then
            python3 scripts/ci/admission.py --pull-request "$PR_NUMBER"
          else
            python3 scripts/ci/admission.py --event "$GITHUB_EVENT_PATH"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}

  # The pull request a CI run belongs to is not in the event for a fork, so a first job resolves it;
  # its number keys the judging job's concurrency group, the same group the `admission` job uses,
  # so the two jobs never write one pull request's comment at the same time.
  resolve-pull-request:
    name: Resolve the pull request
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.resolve.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - id: resolve
        run: |
          number=$(python3 scripts/ci/admission.py --workflow-run "$GITHUB_EVENT_PATH" --resolve-pull-request)
          echo "number=$number" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  admission-after-ci:
    name: Admission after CI
    needs: resolve-pull-request
    if: needs.resolve-pull-request.outputs.number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: admission-${{ needs.resolve-pull-request.outputs.number }}
      cancel-in-progress: false
    # The jobs of the CI run are read through the Actions API, which needs `actions: read`.
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 scripts/ci/admission.py --workflow-run "$GITHUB_EVENT_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # An opened or edited issue: the intended-divergences choice its form carries, checked against the
  # index on the default branch; a miss gets the `needs-divergence-check` label and one comment
  # edited in place, and an edit that fixes the body clears both. Nothing here closes an issue.
  issue-admission:
    name: Issue admission
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: admission-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 scripts/ci/admission.py --issue "$GITHUB_EVENT_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
