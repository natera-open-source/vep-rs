name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which of the jobs below a pull request can affect, from the paths its merge commit
  # changes against the base: `rust` for Clippy, Format, Module Docs, MSRV and Advisory
  # Reachability, `test` for Test, `harness` for Harness Tests; Comparator Tests reads
  # docs, README.md, CHANGELOG.md, CITATION.cff, .github/ and bioconda/, so it always runs.
  # Only the paths listed in the `case` below can leave an output `false`: any other path,
  # a push to main, an empty diff or a checkout that is not a merge sets all three `true`.
  #
  # A gated job still starts and reports its required check as a success with its steps
  # skipped. A matrix job skipped by a job-level `if:` is never expanded, so no check named
  # Test, Clippy, Format or Module Docs would report and the ruleset would wait on them.
  # The gated jobs run their steps when this job fails, since an output reads `false` only
  # when this job wrote it.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      test: ${{ steps.classify.outputs.test }}
      harness: ${{ steps.classify.outputs.harness }}
    steps:
      # The pull_request checkout is the merge commit; depth 2 brings its base parent.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          rust=true test=true harness=true
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify 'HEAD^2' > /dev/null; then
            git diff -z --name-only --no-renames 'HEAD^1' HEAD > "$RUNNER_TEMP/changed"
            code=false docs=false legal=false n=0
            while IFS= read -r -d '' path; do
              n=$((n + 1))
              echo "changed: $path"
              # The Rust tests assert sentences of README.md as they do the pages under docs/,
              # so it keeps Test; the `case` below still reads it as no code path.
              [ "$path" != README.md ] || docs=true
              case "$path" in
                .github/workflows/*) code=true ;;
                # The Rust tests assert the CLI reference and the sentences of many pages.
                docs/*) docs=true ;;
                # scripts/docker/stage_release.sh copies both into the image context.
                LICENSE | NOTICE) legal=true ;;
                README.md | CHANGELOG.md | CONTRIBUTING.md | AGENTS.md | CLAUDE.md \
                  | CODE_OF_CONDUCT.md | SECURITY.md | CITATION.cff | .zenodo.json | book.toml \
                  | theme/* | manuscript/* | bioconda/* | docker/* | .claude/* | .github/*) ;;
                # Every other path is code. tools/ is never split by tool: the tools compile
                # each other's source by `#[path]` and `include_str!` and read each other's
                # test fixtures, so a change under one tool is built and tested by others.
                *) code=true ;;
              esac
            done < "$RUNNER_TEMP/changed"
            if [ "$n" -gt 0 ] && [ "$code" = false ]; then
              rust=false
              [ "$docs" = true ] || test=false
              [ "$legal" = true ] || harness=false
            fi
          fi
          printf 'rust=%s\ntest=%s\nharness=%s\n' "$rust" "$test" "$harness" | tee -a "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.name }}
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every directory under tools/ is its own Cargo root, so a `--workspace` command
        # never reaches it; each key after `command` is the same check over one of those
        # packages, run by the step that names the key. `gate` names the `changes` output
        # that decides whether the entry's steps run.
        include:
          - name: Test
            gate: test
            command: cargo test --workspace --locked
            comparator: cargo test --locked --manifest-path tools/vep-fields-compare/Cargo.toml
            outputs_comparator: cargo test --locked --manifest-path tools/vep-outputs-compare/Cargo.toml
            formats_comparator: cargo test --locked --manifest-path tools/vep-formats-compare/Cargo.toml
            plugin_pairs: cargo test --locked --manifest-path tools/vep-plugin-pairs/Cargo.toml
            cache_diff: cargo test --locked --manifest-path tools/vep-cache-diff/Cargo.toml
            cache_output_gates: cargo test --locked --manifest-path tools/vep-cache-output-gates/Cargo.toml
            cache_parity_audit: cargo test --locked --manifest-path tools/vep-cache-parity-audit/Cargo.toml
            discordant_classes: cargo test --locked --manifest-path tools/vep-discordant-classes/Cargo.toml
            divergence_reevaluate: cargo test --locked --manifest-path tools/vep-divergence-reevaluate/Cargo.toml
            fastvep_normalize: cargo test --locked --manifest-path tools/vep-fastvep-normalize/Cargo.toml
            fastvep_plugin_tuples: cargo test --locked --manifest-path tools/vep-fastvep-plugin-tuples/Cargo.toml
            file_census: cargo test --locked --manifest-path tools/vep-file-census/Cargo.toml
            # The tests of this package that classify with SpliceAI score files ask a build of
            # tools/vep-formats-compare, which the `formats_comparator` step leaves under that
            # tool's target/debug before this one runs; they fail where none stands.
            golden_corpus: cargo test --locked --manifest-path tools/vep-golden-corpus/Cargo.toml
            gtf_tags_compare: cargo test --locked --manifest-path tools/vep-gtf-tags-compare/Cargo.toml
            intermediates_compare: cargo test --locked --manifest-path tools/vep-intermediates-compare/Cargo.toml
            # The corpus round trips of this package read the `vep` binary the workspace's
            # cargo test leaves under target/debug and pass without running where none
            # stands; under the variable they fail instead, so they run here.
            parquet_to_tab: VEP_ROUND_TRIPS_MUST_RUN=1 cargo test --locked --manifest-path tools/vep-parquet-to-tab/Cargo.toml
            prepare_benchmark_vcfs: cargo test --locked --manifest-path tools/vep-prepare-benchmark-vcfs/Cargo.toml
            stats_compare: cargo test --locked --manifest-path tools/vep-stats-compare/Cargo.toml
            storable_digest: cargo test --locked --manifest-path tools/vep-storable-digest/Cargo.toml
            storable_digest_join: cargo test --locked --manifest-path tools/vep-storable-digest-join/Cargo.toml
            storable_dump: cargo test --locked --manifest-path tools/vep-storable-dump/Cargo.toml
            storable_to_json: cargo test --locked --manifest-path tools/vep-storable-to-json/Cargo.toml
            storable_transcript_classes: cargo test --locked --manifest-path tools/vep-storable-transcript-classes/Cargo.toml
            sv_comparator: cargo test --locked --manifest-path tools/vep-sv-compare/Cargo.toml
            genome_table: cargo test --locked --manifest-path tools/vep-genome-table/Cargo.toml
            seeded_variants: cargo test --locked --manifest-path tools/vep-seeded-variants/Cargo.toml
            genome_features: cargo test --locked --manifest-path tools/vep-genome-features/Cargo.toml
            loftee_synthetic_conservation: cargo test --locked --manifest-path tools/vep-loftee-synthetic-conservation/Cargo.toml
          - name: Clippy
            gate: rust
            # `vep-cli/bench` puts the `bench_plugins` binary, which builds only
            # under that feature, under the lint.
            command: cargo clippy --workspace --features vep-cli/bench -- -D warnings
            comparator: cargo clippy --all-targets --locked --manifest-path tools/vep-fields-compare/Cargo.toml -- -D warnings
            outputs_comparator: cargo clippy --all-targets --locked --manifest-path tools/vep-outputs-compare/Cargo.toml -- -D warnings
            formats_comparator: cargo clippy --all-targets --locked --manifest-path tools/vep-formats-compare/Cargo.toml -- -D warnings
            plugin_pairs: cargo clippy --all-targets --locked --manifest-path tools/vep-plugin-pairs/Cargo.toml -- -D warnings
            cache_diff: cargo clippy --all-targets --locked --manifest-path tools/vep-cache-diff/Cargo.toml -- -D warnings
            cache_output_gates: cargo clippy --all-targets --locked --manifest-path tools/vep-cache-output-gates/Cargo.toml -- -D warnings
            cache_parity_audit: cargo clippy --all-targets --locked --manifest-path tools/vep-cache-parity-audit/Cargo.toml -- -D warnings
            discordant_classes: cargo clippy --all-targets --locked --manifest-path tools/vep-discordant-classes/Cargo.toml -- -D warnings
            divergence_reevaluate: cargo clippy --all-targets --locked --manifest-path tools/vep-divergence-reevaluate/Cargo.toml -- -D warnings
            fastvep_normalize: cargo clippy --all-targets --locked --manifest-path tools/vep-fastvep-normalize/Cargo.toml -- -D warnings
            fastvep_plugin_tuples: cargo clippy --all-targets --locked --manifest-path tools/vep-fastvep-plugin-tuples/Cargo.toml -- -D warnings
            file_census: cargo clippy --all-targets --locked --manifest-path tools/vep-file-census/Cargo.toml -- -D warnings
            golden_corpus: cargo clippy --all-targets --locked --manifest-path tools/vep-golden-corpus/Cargo.toml -- -D warnings
            gtf_tags_compare: cargo clippy --all-targets --locked --manifest-path tools/vep-gtf-tags-compare/Cargo.toml -- -D warnings
            intermediates_compare: cargo clippy --all-targets --locked --manifest-path tools/vep-intermediates-compare/Cargo.toml -- -D warnings
            parquet_to_tab: cargo clippy --all-targets --locked --manifest-path tools/vep-parquet-to-tab/Cargo.toml -- -D warnings
            prepare_benchmark_vcfs: cargo clippy --all-targets --locked --manifest-path tools/vep-prepare-benchmark-vcfs/Cargo.toml -- -D warnings
            stats_compare: cargo clippy --all-targets --locked --manifest-path tools/vep-stats-compare/Cargo.toml -- -D warnings
            storable_digest: cargo clippy --all-targets --locked --manifest-path tools/vep-storable-digest/Cargo.toml -- -D warnings
            storable_digest_join: cargo clippy --all-targets --locked --manifest-path tools/vep-storable-digest-join/Cargo.toml -- -D warnings
            storable_dump: cargo clippy --all-targets --locked --manifest-path tools/vep-storable-dump/Cargo.toml -- -D warnings
            storable_to_json: cargo clippy --all-targets --locked --manifest-path tools/vep-storable-to-json/Cargo.toml -- -D warnings
            storable_transcript_classes: cargo clippy --all-targets --locked --manifest-path tools/vep-storable-transcript-classes/Cargo.toml -- -D warnings
            sv_comparator: cargo clippy --all-targets --locked --manifest-path tools/vep-sv-compare/Cargo.toml -- -D warnings
            genome_table: cargo clippy --all-targets --locked --manifest-path tools/vep-genome-table/Cargo.toml -- -D warnings
            seeded_variants: cargo clippy --all-targets --locked --manifest-path tools/vep-seeded-variants/Cargo.toml -- -D warnings
            genome_features: cargo clippy --all-targets --locked --manifest-path tools/vep-genome-features/Cargo.toml -- -D warnings
            loftee_synthetic_conservation: cargo clippy --all-targets --locked --manifest-path tools/vep-loftee-synthetic-conservation/Cargo.toml -- -D warnings
          - name: Format
            gate: rust
            command: cargo fmt --all -- --check
            comparator: cargo fmt --all --manifest-path tools/vep-fields-compare/Cargo.toml -- --check
            outputs_comparator: cargo fmt --all --manifest-path tools/vep-outputs-compare/Cargo.toml -- --check
            formats_comparator: cargo fmt --all --manifest-path tools/vep-formats-compare/Cargo.toml -- --check
            plugin_pairs: cargo fmt --all --manifest-path tools/vep-plugin-pairs/Cargo.toml -- --check
            cache_diff: cargo fmt --all --manifest-path tools/vep-cache-diff/Cargo.toml -- --check
            cache_output_gates: cargo fmt --all --manifest-path tools/vep-cache-output-gates/Cargo.toml -- --check
            cache_parity_audit: cargo fmt --all --manifest-path tools/vep-cache-parity-audit/Cargo.toml -- --check
            discordant_classes: cargo fmt --all --manifest-path tools/vep-discordant-classes/Cargo.toml -- --check
            divergence_reevaluate: cargo fmt --all --manifest-path tools/vep-divergence-reevaluate/Cargo.toml -- --check
            fastvep_normalize: cargo fmt --all --manifest-path tools/vep-fastvep-normalize/Cargo.toml -- --check
            fastvep_plugin_tuples: cargo fmt --all --manifest-path tools/vep-fastvep-plugin-tuples/Cargo.toml -- --check
            file_census: cargo fmt --all --manifest-path tools/vep-file-census/Cargo.toml -- --check
            golden_corpus: cargo fmt --all --manifest-path tools/vep-golden-corpus/Cargo.toml -- --check
            gtf_tags_compare: cargo fmt --all --manifest-path tools/vep-gtf-tags-compare/Cargo.toml -- --check
            intermediates_compare: cargo fmt --all --manifest-path tools/vep-intermediates-compare/Cargo.toml -- --check
            parquet_to_tab: cargo fmt --all --manifest-path tools/vep-parquet-to-tab/Cargo.toml -- --check
            prepare_benchmark_vcfs: cargo fmt --all --manifest-path tools/vep-prepare-benchmark-vcfs/Cargo.toml -- --check
            stats_compare: cargo fmt --all --manifest-path tools/vep-stats-compare/Cargo.toml -- --check
            storable_digest: cargo fmt --all --manifest-path tools/vep-storable-digest/Cargo.toml -- --check
            storable_digest_join: cargo fmt --all --manifest-path tools/vep-storable-digest-join/Cargo.toml -- --check
            storable_dump: cargo fmt --all --manifest-path tools/vep-storable-dump/Cargo.toml -- --check
            storable_to_json: cargo fmt --all --manifest-path tools/vep-storable-to-json/Cargo.toml -- --check
            storable_transcript_classes: cargo fmt --all --manifest-path tools/vep-storable-transcript-classes/Cargo.toml -- --check
            sv_comparator: cargo fmt --all --manifest-path tools/vep-sv-compare/Cargo.toml -- --check
            genome_table: cargo fmt --all --manifest-path tools/vep-genome-table/Cargo.toml -- --check
            seeded_variants: cargo fmt --all --manifest-path tools/vep-seeded-variants/Cargo.toml -- --check
            genome_features: cargo fmt --all --manifest-path tools/vep-genome-features/Cargo.toml -- --check
            loftee_synthetic_conservation: cargo fmt --all --manifest-path tools/vep-loftee-synthetic-conservation/Cargo.toml -- --check
          # Catches a license header run into a module's `//!` doc line with no
          # blank line between them. Test/Clippy/Format are all blind to it: the
          # joined line is a valid comment, so everything compiles and passes while
          # the first rustdoc line is silently lost.
          #
          # scripts/check_api_docs.sh builds the API documentation with rustdoc's warnings
          # denied. A doc comment rustdoc cannot render as written (a link to an item the
          # page cannot reach, a bare URL, an angle-bracketed word read as an HTML tag) is
          # a warning, which `cargo doc`, the tests and clippy all pass.
          - name: Module Docs
            gate: rust
            command: scripts/check_module_docs.sh && scripts/check_api_docs.sh workspace
            comparator: scripts/check_module_docs.sh tools && scripts/check_api_docs.sh tools

    steps:
      - if: needs.changes.outputs[matrix.gate] == 'false'
        run: echo "No path this check reads changed; its steps are skipped."
      - if: needs.changes.outputs[matrix.gate] != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs[matrix.gate] != 'false'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - if: needs.changes.outputs[matrix.gate] != 'false'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.command }}
      - if: needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.comparator }}
      - if: matrix.outputs_comparator && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.outputs_comparator }}
      - if: matrix.formats_comparator && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.formats_comparator }}
      - if: matrix.plugin_pairs && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.plugin_pairs }}
      - if: matrix.cache_diff && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.cache_diff }}
      - if: matrix.cache_output_gates && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.cache_output_gates }}
      - if: matrix.cache_parity_audit && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.cache_parity_audit }}
      - if: matrix.discordant_classes && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.discordant_classes }}
      - if: matrix.divergence_reevaluate && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.divergence_reevaluate }}
      - if: matrix.fastvep_normalize && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.fastvep_normalize }}
      - if: matrix.fastvep_plugin_tuples && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.fastvep_plugin_tuples }}
      - if: matrix.file_census && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.file_census }}
      - if: matrix.golden_corpus && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.golden_corpus }}
      - if: matrix.gtf_tags_compare && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.gtf_tags_compare }}
      - if: matrix.intermediates_compare && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.intermediates_compare }}
      - if: matrix.parquet_to_tab && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.parquet_to_tab }}
      - if: matrix.prepare_benchmark_vcfs && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.prepare_benchmark_vcfs }}
      - if: matrix.stats_compare && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.stats_compare }}
      - if: matrix.storable_digest && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.storable_digest }}
      - if: matrix.storable_digest_join && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.storable_digest_join }}
      - if: matrix.storable_dump && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.storable_dump }}
      - if: matrix.storable_to_json && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.storable_to_json }}
      - if: matrix.storable_transcript_classes && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.storable_transcript_classes }}
      - if: matrix.sv_comparator && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.sv_comparator }}
      - if: matrix.genome_table && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.genome_table }}
      - if: matrix.seeded_variants && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.seeded_variants }}
      - if: matrix.genome_features && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.genome_features }}
      - if: matrix.loftee_synthetic_conservation && needs.changes.outputs[matrix.gate] != 'false'
        run: ${{ matrix.loftee_synthetic_conservation }}
      # pytest for the step below, by the install line of the Comparator Tests job.
      - if: matrix.name == 'Test' && needs.changes.outputs[matrix.gate] != 'false'
        run: python3 -m pip install --quiet pytest pyyaml
      # The plugin concordance driver scores through tools/vep-plugin-pairs, and its tests that
      # score skip themselves without the tool's binary. The Test job's cargo test leaves
      # tools/vep-plugin-pairs/target/debug/vep-plugin-pairs and a vep binary: the three tests
      # must run, not skip, and then one committed corpus is annotated and scored through the
      # tool against the corpus's committed Ensembl VEP output, with no container, and the rows
      # printed are held to the committed ones.
      - if: matrix.name == 'Test' && needs.changes.outputs[matrix.gate] != 'false'
        run: |
          set -eo pipefail
          python3 -m pytest -q scripts/concordance/test_reproduce_plugin_concordance.py -k built_tool | tee "$RUNNER_TEMP/built_tool.txt"
          grep -q '^3 passed' "$RUNNER_TEMP/built_tool.txt"
          python3 scripts/concordance/reproduce_plugin_concordance.py \
            --run GRCh38-plugin-transcript-annotator --set base \
            --vep "$PWD/target/debug/vep" \
            --pairing-tool "$PWD/tools/vep-plugin-pairs/target/debug/vep-plugin-pairs" \
            --work-dir "$RUNNER_TEMP/plugin-concordance" | tee "$RUNNER_TEMP/plugin_rows.jsonl"
          cmp scripts/concordance/testdata/reproduce_plugin_concordance/GRCh38-plugin-transcript-annotator.base.jsonl "$RUNNER_TEMP/plugin_rows.jsonl"
      # The `bench_plugins` binary builds only under the feature `bench`, which the workspace's
      # cargo test does not pass, so the tests inside it run in a step of their own.
      - if: matrix.name == 'Test' && needs.changes.outputs[matrix.gate] != 'false'
        run: cargo test --locked -p vep-cli --features bench --bin bench_plugins
      # The documented public interface of the workspace's crates is held to the record under
      # tests/public-interface: every documented item of each library with its signature, each
      # package's features and library target, and the crates outside the workspace a signature
      # may name. The step reads rustdoc's JSON output on the pinned toolchain and shares the
      # dependency builds of this cell's documentation build, so it runs after it, with no
      # network. A deliberate change writes the record again and commits its diff:
      # python3 scripts/check_public_interface.py --update
      - if: matrix.name == 'Module Docs' && needs.changes.outputs[matrix.gate] != 'false'
        run: python3 scripts/check_public_interface.py --offline

  # The Python scripts ship with their own test files; a file that fails to
  # import reports zero failures, so the collected count is asserted per file.
  comparator-tests:
    name: Comparator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --quiet pytest pyyaml
      # The pinned toolchain's cargo: scripts/release/crate_publish_order.py reads the workspace
      # through `cargo metadata`, in the test run below and in the step after it, which also
      # packages the crates.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      # The custom-source fixture test skips itself without bgzip, tabix and bigtools;
      # this job installs them so the skip cannot hide a regression.
      - run: |
          set -eo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tabix
          curl -fsSL -o /tmp/bigtools.zip https://github.com/jackh726/bigtools/releases/download/v0.5.8/bigtools-linux-gnu-noremote.zip
          echo "9dff216a9d9089f6b05871016d96396cf1fc5562c87c3019a6f5db00dfab9664  /tmp/bigtools.zip" | sha256sum --check --strict -
          unzip -q -j /tmp/bigtools.zip release/bigtools -d /tmp/bigtools
          sudo install -m 0755 /tmp/bigtools/bigtools /usr/local/bin/bigtools
          bgzip --version | head -1 && tabix --version | head -1 && bigtools --version
      # One list feeds the per-file floor check and the run, so a file cannot be
      # floored without being run or run without a floor. Each floor is the count
      # `python3 -m pytest --collect-only -q <file> | grep -cE '^scripts/.*::'`
      # reports; the anchored pattern counts node ids alone, never a summary or
      # warning line that happens to carry `::`.
      - run: |
          set -e
          tests=(
            "scripts/concordance/test_reference_release.py 19"
            "scripts/concordance/test_plugin_gate_runs.py 16"
            "scripts/concordance/test_reproduce_plugin_concordance.py 49"
            "scripts/concordance/test_species_harness.py 7"
            "scripts/golden/test_fixture_scripts.py 21"
            "scripts/golden/test_prune_json_cache.py 4"
            "scripts/fixtures/test_cut_plugin_regions.py 20"
            "scripts/fixtures/test_plugin_score_fixtures.py 30"
            "scripts/fixtures/test_make_plugin_fixture.py 10"
            "scripts/fixtures/test_loftee_conservation_database.py 6"
            "scripts/release/test_render_release_notes.py 223"
            "scripts/release/test_check_glibc_floor.py 8"
            "scripts/release/test_crate_publish_order.py 20"
            "scripts/parity/test_check_parity_matrix.py 184"
            "scripts/parity/test_plugin_gate_rows.py 42"
            "scripts/docs/test_site_tools.py 227"
            "scripts/docs/test_render_release_figure.py 222"
            "scripts/docs/test_render_plugin_wall_time.py 30"
            "scripts/docs/test_supported_genomes.py 52"
            "scripts/fixtures/test_maxentscan_fixture_matrices.py 27"
            "scripts/data/test_write_loftee_stand_ins.py 14"
            "scripts/divergences/test_check_divergence_order.py 34"
            "scripts/ci/test_admission.py 546"
            "scripts/docs/test_contributor_guide.py 20"
            "scripts/bioconda/test_recipe.py 24"
            "scripts/test_check_public_interface.py 34"
          )
          fail=0
          files=()
          for entry in "${tests[@]}"; do
            read -r file floor <<<"$entry"
            n=$(python3 -m pytest --collect-only -q "$file" | grep -cE '^scripts/.*::' || true)
            echo "collected $n from $file (floor $floor)"
            if [ "$n" -lt "$floor" ]; then
              echo "ERROR: [comparator-tests] $file collected $n tests, expected >= $floor." >&2
              fail=1
            fi
            files+=("$file")
          done
          [ "$fail" -eq 0 ]
          python3 -m pytest -q "${files[@]}"
      # The list CRATES of crates-io.yml must name the workspace's crates, each after the
      # siblings it depends on, and every sibling pin must read the workspace version. Then
      # every crate is packaged from its manifest. `--no-verify` compiles nothing: the build
      # of the packaged crates is the publishing workflow's.
      - run: |
          python3 scripts/release/crate_publish_order.py
          cargo package --workspace --locked --no-verify
      # The parity matrix (tests/parity/matrix.tsv) must name every flag args.rs declares,
      # and every landed row's tests must resolve in this tree.
      - run: python3 scripts/parity/check_parity_matrix.py
      # Every layout path run_concordance.sh passes is a file setup_plugin_data.sh stages
      # (both read scripts/data/plugin_data_layout.sh), and CADD, SpliceAI, AVI, dbNSFP and
      # dbscSNV are passed the user's own file; the test file below proves it.
      - run: |
          bash -n scripts/concordance/run_concordance.sh
          floor=191
          out=$(bash scripts/data/test_plugin_data_layout.sh 2>&1) || { printf '%s\n' "$out"; exit 1; }
          n=$(printf '%s\n' "$out" | grep -c '^  ok ') || n=0
          echo "plugin data layout tests reported $n ok lines (floor $floor)"
          [ "$n" -ge "$floor" ]

  # The measurement harness and the reference-output generator each ship with a
  # Bash and python3 test file (stub engines, a stub bcftools, a stub docker) whose
  # checks inject a fault and prove the matching fail-closed gate fires. A test file
  # exits 1 on any failure and prints one `ok` line per passing check; the count
  # is asserted so a test file that silently ran nothing cannot pass.
  harness-tests:
    name: Harness Tests
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.harness == 'false'
        run: echo "No path this check reads changed; its steps are skipped."
      - if: needs.changes.outputs.harness != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # test_feature_oracle.sh compares through the release build of the format comparator,
      # tools/vep-formats-compare, which the runner starts and never builds.
      # test_check_api_docs.sh documents scratch crates with the same toolchain.
      - if: needs.changes.outputs.harness != 'false'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - if: needs.changes.outputs.harness != 'false'
        run: cargo build --release --locked --manifest-path tools/vep-formats-compare/Cargo.toml
      # The test files below run their scripts on the tree's release builds of the tools the
      # scripts call: test_run_clone_measurement.sh on the tuple and field comparators, the
      # fastVEP normaliser and the file census, test_tree_tuple_comparator.sh on the tuple
      # comparator and the file census, test_generate_reference_output.sh and
      # test_capture_baseline.sh on the file census, test_cache_comparison_callers.sh on
      # tools/vep-cache-diff and test_cache_output_gates.sh on tools/vep-cache-output-gates.
      # A check that needs a build skips without it and the floors below count it, so the
      # builds must be here.
      - if: needs.changes.outputs.harness != 'false'
        run: cargo build --release --locked --manifest-path tools/vep-outputs-compare/Cargo.toml
      - if: needs.changes.outputs.harness != 'false'
        run: cargo build --release --locked --manifest-path tools/vep-fields-compare/Cargo.toml
      - if: needs.changes.outputs.harness != 'false'
        run: cargo build --release --locked --manifest-path tools/vep-fastvep-normalize/Cargo.toml
      - if: needs.changes.outputs.harness != 'false'
        run: cargo build --release --locked --manifest-path tools/vep-file-census/Cargo.toml
      - if: needs.changes.outputs.harness != 'false'
        run: cargo build --release --locked --manifest-path tools/vep-cache-diff/Cargo.toml
      - if: needs.changes.outputs.harness != 'false'
        run: cargo build --release --locked --manifest-path tools/vep-cache-output-gates/Cargo.toml
      - if: needs.changes.outputs.harness != 'false'
        run: |
          set -e
          check() {
            out=$(bash "$1" 2>&1) || { printf '%s\n' "$out"; exit 1; }
            n=$(printf '%s\n' "$out" | grep -c '^  ok ') || n=0
            echo "$1 reported $n ok lines (floor $2)"
            [ "$n" -ge "$2" ]
          }
          check scripts/concordance/test_run_clone_measurement.sh 308
          check scripts/concordance/test_run_concordance.sh 32
          check scripts/concordance/test_tree_tuple_comparator.sh 50
          check scripts/concordance/test_plugin_comparator_switch.sh 15
          check scripts/concordance/test_generate_reference_output.sh 343
          check scripts/concordance/test_feature_oracle.sh 639
          check scripts/concordance/test_harness_genomes.sh 32
          check scripts/genomes/test_check_genome.sh 254
          check scripts/genomes/test_genome_checks.sh 128
          check scripts/validation/test_cache_comparison_callers.sh 16
          check scripts/validation/test_cache_output_gates.sh 20
          check scripts/validation/test_capture_baseline.sh 14
          check scripts/docker/test_image_source.sh 26
          check scripts/docker/test_image_tags.sh 8
          check scripts/docker/test_release_recipe.sh 11
          check scripts/docker/test_require_images.sh 16
          check scripts/docker/test_stage_release.sh 17
          check scripts/docker/test_stage_tree.sh 38
          check scripts/docker/test_smoke_test.sh 28
          check scripts/docker/test_workflow_jobs.sh 14
          check scripts/test_check_api_docs.sh 20

  # A `cargo audit` advisory is a failure only when the advisory's crate is
  # reachable from the `vep` binary; scripts/check_advisory_reachability.sh makes
  # that distinction and carries the dated allowlist for the rest. cargo-audit is
  # installed from its pinned prebuilt release rather than compiled with
  # `cargo install`, which would dominate the cost of a check that itself
  # compiles nothing.
  advisory-reachability:
    name: Advisory Reachability
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.rust == 'false'
        run: echo "No path this check reads changed; its steps are skipped."
      - if: needs.changes.outputs.rust != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.rust != 'false'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - if: needs.changes.outputs.rust != 'false'
        run: |
          set -euo pipefail
          CARGO_AUDIT_VERSION=0.22.2
          ASSET="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
          curl -fsSL "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${ASSET}.tgz" | tar xz -C /tmp
          install -m 0755 "/tmp/${ASSET}/cargo-audit" "${CARGO_HOME:-$HOME/.cargo}/bin/cargo-audit"
          cargo audit --version
      - if: needs.changes.outputs.rust != 'false'
        run: scripts/check_advisory_reachability.sh
      # Each tool root has its own lockfile, outside the script's audit of the root one.
      # The whole lockfile is audited, with no reachability distinction: an advisory of
      # any class on any crate in it, including a backend the build leaves out, fails
      # here and is cleared by a bump. The one advisory a row passes over with `--ignore`
      # is on the dated allowlist the script reads for the workspace, which links the
      # same crate for the same reason; scripts/docs/test_contributor_guide.py holds the
      # row to an entry there that has not expired.
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-fields-compare/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-outputs-compare/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --ignore RUSTSEC-2026-0543 --file tools/vep-formats-compare/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-plugin-pairs/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-cache-diff/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-cache-output-gates/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-cache-parity-audit/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-discordant-classes/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-divergence-reevaluate/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-fastvep-normalize/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-fastvep-plugin-tuples/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-file-census/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-golden-corpus/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-gtf-tags-compare/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-intermediates-compare/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --ignore RUSTSEC-2026-0543 --file tools/vep-parquet-to-tab/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-prepare-benchmark-vcfs/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-stats-compare/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-storable-digest/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-storable-digest-join/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
