        run: cargo audit --deny warnings --file tools/vep-genome-features/Cargo.lock
      - if: needs.changes.outputs.rust != 'false'
        run: cargo audit --deny warnings --file tools/vep-loftee-synthetic-conservation/Cargo.lock

  # Builds on the DECLARED minimum supported Rust version rather than the
  # pinned toolchain. Every job above runs the pinned 1.97.1, the toolchain the
  # released binaries are built with, so without this one nothing ever
  # compiles against `rust-version`, and the manifest's floor is a claim no
  # build has exercised. The floor is dependency-driven (see the comment on
  # `rust-version` in Cargo.toml), so a dependency bump can raise it without any
  # source change; this job is what turns that into a failing check instead of
  # a broken promise to whoever reads the manifest.
  #
  # The toolchain version is the step's `toolchain:` input, so the first step
  # asserts that the input still equals the manifest's declaration: bumping one
  # without the other fails here rather than leaving this job quietly testing
  # the old floor.
  msrv:
    name: MSRV
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.rust == 'false'
        run: echo "No path this check reads changed; its steps are skipped."
      - if: needs.changes.outputs.rust != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.rust != 'false'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.89
      - name: Toolchain matches the declared rust-version
        if: needs.changes.outputs.rust != 'false'
        run: |
          actual=$(rustc --version | awk '{print $2}')
          for manifest in Cargo.toml tools/*/Cargo.toml; do
            declared=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' "$manifest" | head -1)
            echo "$manifest: declared rust-version=$declared, toolchain=$actual"
            case "$actual" in
              "$declared" | "$declared".*) ;;
              *) echo "ERROR: [msrv] toolchain $actual is not the declared rust-version $declared in $manifest; update both the toolchain input and the manifest together" >&2; exit 1 ;;
            esac
          done
      - if: needs.changes.outputs.rust != 'false'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --workspace --locked --features vep-cli/bench
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-fields-compare/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-outputs-compare/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-formats-compare/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-plugin-pairs/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-cache-diff/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-cache-output-gates/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-cache-parity-audit/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-discordant-classes/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-divergence-reevaluate/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-fastvep-normalize/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-fastvep-plugin-tuples/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-file-census/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-golden-corpus/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-gtf-tags-compare/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-intermediates-compare/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-parquet-to-tab/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-prepare-benchmark-vcfs/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-stats-compare/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-storable-digest/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-storable-digest-join/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-storable-dump/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-storable-to-json/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-storable-transcript-classes/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-sv-compare/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-genome-table/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-seeded-variants/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-genome-features/Cargo.toml
      - if: needs.changes.outputs.rust != 'false'
        run: cargo build --locked --manifest-path tools/vep-loftee-synthetic-conservation/Cargo.toml

  build-release:
    name: Build Release
    needs: [check, msrv]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked --bin vep
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
