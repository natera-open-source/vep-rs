name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: vep-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: vep-linux-aarch64
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: vep-macos-aarch64

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      # The aarch64 Linux build runs inside cross's container, whose OpenSSL
      # setup for the target lives in Cross.toml at the repository root:
      # vep-cache-builder links OpenSSL on Linux, and the image ships none.
      # Pinned to a release tag so the same cross (and the same target image)
      # builds every tag of this repository.
      - name: Install cross-compilation tools
        if: matrix.cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --tag v0.2.5

      - name: Set target-cpu for architecture
        run: |
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu) echo "RUSTFLAGS=-C target-cpu=neoverse-v1" >> "$GITHUB_ENV" ;;
            x86_64-unknown-linux-gnu)  echo "RUSTFLAGS=-C target-cpu=x86-64-v3" >> "$GITHUB_ENV" ;;
          esac

      # `--locked` refuses to resolve dependencies afresh: a release built from a
      # source commit alone is not reproducible, because a fresh resolution can
      # select later patch versions than the ones Cargo.lock records. The
      # published build pin is the commit, the lockfile and the binary digest
      # together, and only a `--locked` build honours all three.
      #
      # Three binaries ship: `vep` (the annotator), `vep-cache-builder` (builds
      # the transcript cache the README tells users to build) and
      # `vep-cache-converter` (validates caches and converts plugin data).
      - name: Build (native)
        if: "!matrix.cross"
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          --bin vep --bin vep-cache-builder --bin vep-cache-converter

      - name: Build (cross)
        if: matrix.cross
        run: >-
          cross build --release --locked --target ${{ matrix.target }}
          --bin vep --bin vep-cache-builder --bin vep-cache-converter

      - name: Package binaries
        run: |
          mkdir -p dist
          for bin in vep vep-cache-builder vep-cache-converter; do
            cp "target/${{ matrix.target }}/release/$bin" "dist/$bin"
          done
          cd dist && tar czf "../${{ matrix.artifact }}.tar.gz" vep vep-cache-builder vep-cache-converter

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # Both digests are published over the tarballs. sha256 is what a
      # downloader verifies with `sha256sum -c SHA256SUMS`. MD5 is published
      # because the accompanying paper reports the binaries it measured by their
      # md5; these release assets are separate builds, so their digests are not
      # expected to reproduce the paper's. Computed here, after every platform's
      # tarball has been collected, so each file covers the whole release in one
      # place rather than one line per job.
      - name: Write checksums
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          md5sum -- *.tar.gz > MD5SUMS
          cat SHA256SUMS MD5SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            SHA256SUMS
            MD5SUMS
