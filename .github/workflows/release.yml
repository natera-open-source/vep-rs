name: Release

# A `v*` tag builds, packages, checksums, attests and creates a DRAFT release;
# a maintainer publishes it after reading the page. `workflow_dispatch` is the
# dry run: the same build, packaging, checksums and rendered body on the
# current branch, uploaded as a workflow artifact, with no attestation and no
# release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.97.1

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      # The version names every archive and the directory it unpacks to: the
      # tag's on a tag push, the workspace's on a dry run.
      - name: Resolve the release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The aarch64 Linux build runs inside cross's container, whose OpenSSL
      # setup for the target lives in Cross.toml at the repository root:
      # vep-cache-builder links OpenSSL on Linux, and the image ships none.
      # Pinned to a release tag so the same cross (and the same target image)
      # builds every tag of this repository.
      - name: Install cross-compilation tools
        if: matrix.cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --tag v0.2.5

      # Each Linux build targets a CPU floor named on the release page:
      # x86-64-v3 (AVX2, BMI2, FMA) and Armv8.4-A with SVE (Neoverse V1). A
      # binary run below its floor aborts with an illegal instruction.
      - name: Set target-cpu for architecture
        run: |
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu) echo "RUSTFLAGS=-C target-cpu=neoverse-v1" >> "$GITHUB_ENV" ;;
            x86_64-unknown-linux-gnu)  echo "RUSTFLAGS=-C target-cpu=x86-64-v3" >> "$GITHUB_ENV" ;;
          esac

      # `--locked` refuses to resolve dependencies afresh: a release built from a
      # source commit alone is not reproducible, because a fresh resolution can
      # select later patch versions than the ones Cargo.lock records. The
      # published build pin is the commit, the lockfile and the binary digest
      # together, and only a `--locked` build honours all three.
      #
      # Three binaries ship: `vep` (the annotator), `vep-cache-builder` (builds
      # the transcript cache the README tells users to build) and
      # `vep-cache-converter` (validates caches and converts plugin data).
      - name: Build (native)
        if: "!matrix.cross"
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          --bin vep --bin vep-cache-builder --bin vep-cache-converter

      - name: Build (cross)
        if: matrix.cross
        run: >-
          cross build --release --locked --target ${{ matrix.target }}
          --bin vep --bin vep-cache-builder --bin vep-cache-converter

      # The archive unpacks to its own directory, `vep-X.Y.Z-<triple>/`, so two
      # versions extracted side by side do not overwrite each other.
      - name: Package binaries
        run: |
          name="vep-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          for bin in vep vep-cache-builder vep-cache-converter; do
            cp "target/${{ matrix.target }}/release/$bin" "dist/$name/$bin"
          done
          tar -C dist -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vep-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: vep-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz

  release:
    name: Checksums, attestations and draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The full history and every tag: `git archive` cuts the source tarball at
      # the released commit, and the previous tag names the compare link.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Resolve the release version and the previous tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -1)"
          fi
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -vx "v$version" | head -1)"
          # A tag renders the version's dated CHANGELOG section; a dry run on a branch whose
          # CHANGELOG has no such section renders `[Unreleased]` dated today.
          if grep -qE "^## \[$version\]" CHANGELOG.md; then
            section="$version"; date_arg=""
          else
            section="Unreleased"; date_arg="--date=$(date -u +%Y-%m-%d)"
          fi
          {
            echo "version=$version"
            echo "previous=${previous:-v0.0.0}"
            echo "section=$section"
            echo "date_arg=$date_arg"
          } >> "$GITHUB_OUTPUT"

      # The source tarball is `git archive` at the released commit, the file a
      # Zenodo deposit receives and a Bioconda recipe points at; GitHub's own
      # source archives are not byte-stable, so they cannot be verified.
      - name: Cut the source tarball
        run: |
          v="${{ steps.meta.outputs.version }}"
          git archive --format=tar.gz --prefix="vep-rs-$v/" -o "vep-rs-$v.tar.gz" "$GITHUB_SHA"
          sha256sum "vep-rs-$v.tar.gz" > "vep-rs-$v.tar.gz.sha256"

      # One checksum file over every archive, in the format `sha256sum -c` and
      # `shasum -a 256 -c` read; the paper reports the binaries it measured by
      # md5, and those are different builds, so no md5 is published here.
      - name: Write checksums
        run: |
          sha256sum -- vep-*.tar.gz vep-rs-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Attest every file in SHA256SUMS
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Render the release body
        run: >-
          python3 scripts/release/render_release_notes.py
          --repo .
          --version "${{ steps.meta.outputs.version }}"
          --previous "${{ steps.meta.outputs.previous }}"
          --commit "$GITHUB_SHA"
          --toolchain "$RUST_TOOLCHAIN"
          --sha256sums SHA256SUMS
          --changelog-section "${{ steps.meta.outputs.section }}"
          ${{ steps.meta.outputs.date_arg }}
          --out release-body.md

      - name: Upload the dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run
          path: |
            vep-*.tar.gz
            vep-rs-*.tar.gz
            vep-rs-*.tar.gz.sha256
            SHA256SUMS
            release-body.md

      # A draft: visible to write-holders only until a maintainer publishes it.
      - name: Create the draft release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          name: vep-rs ${{ steps.meta.outputs.version }}
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            vep-*.tar.gz
            vep-rs-*.tar.gz
            vep-rs-*.tar.gz.sha256
            SHA256SUMS
