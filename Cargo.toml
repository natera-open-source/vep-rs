[workspace]
members = [
    "crates/vep-core",
    "crates/vep-cache-converter",
    "crates/vep-builtins",
    "crates/vep-effects",
    "crates/vep-io",
    "crates/vep-plugin",
    "crates/vep-fasta",
    "crates/vep-cli",
    "crates/vep-cache-builder",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/natera-open-source/vep-rs"
homepage = "https://natera-open-source.github.io/vep-rs/"
keywords = ["vep", "ensembl", "variant-annotation", "genomics", "bioinformatics"]
categories = ["science::bioinformatics"]
# Dependency-driven, not source-driven. The implementation crates' own code needs
# only 1.80 (`std::sync::LazyLock` in vep-core/src/codon.rs), but the locked
# dependency graph floors higher: the `noodles` crates (`noodles-bgzf` 0.51 is
# the first release whose BGZF readers validate a block's ISIZE and run their
# inflate pool and buffer ring at the requested worker count) declare
# rust-version 1.89.0; the next tier down is 1.88: `darling` (via mysql ->
# mysql_common -> mysql-common-derive, a vep-cache-builder dependency), the
# `arrow` and `parquet` crates, `libloading` and `sha2`. The `msrv` CI job
# builds on exactly this version. Lowering it requires dropping or pinning back
# the dependency that sets the floor.
rust-version = "1.89"

[workspace.dependencies]
# Workspace crates. Each carries an exact version beside its path because crates.io
# needs a version on every dependency of a published crate; the `=` pin makes a
# workspace version bump that misses these lines fail to resolve, so the published
# crates always depend on their own release's siblings.
vep-core = { path = "crates/vep-core", version = "=1.0.0" }
vep-effects = { path = "crates/vep-effects", version = "=1.0.0" }
vep-io = { path = "crates/vep-io", version = "=1.0.0", default-features = false }
vep-plugin = { path = "crates/vep-plugin", version = "=1.0.0" }
vep-builtins = { path = "crates/vep-builtins", version = "=1.0.0" }
vep-fasta = { path = "crates/vep-fasta", version = "=1.0.0" }
vep-cli = { path = "crates/vep-cli", version = "=1.0.0" }
vep-cache-builder = { path = "crates/vep-cache-builder", version = "=1.0.0", default-features = false }

# Serialization / cache
memmap2 = "0.9"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
flate2 = "1"
csv = "1.3"

# Parallelism
rayon = "1.10"
crossbeam-channel = "0.5"

# Parquet output: the writer and its Arrow columns. No default features: the
# other codecs, the async reader and the object store are not used.
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
arrow-array = "60"
arrow-schema = "60"
arrow-select = "60"

# Genomics
noodles = { version = "0.116", features = ["vcf", "bgzf", "core", "fasta", "tabix", "csi"] }
noodles-bgzf = { version = "0.51", features = ["libdeflate"] }
# bigWig reader for the optional LoFTEE plugin's GERP-weighted END_TRUNC filter.
# Only exercised when `--plugin LoFTEE,gerp_bigwig=...` is passed; the default
# vep-rs run never touches it. MIT-licensed. Only the
# `read` feature is enabled: drops the `cli` (clap) and `remote` (attohttpc
# network stack) + `write` features for a minimal local-file-read dependency.
bigtools = { version = "0.5", default-features = false, features = ["read"] }
# SQLite reader for the optional LoFTEE plugin's `conservation_file` database.
# `bundled` compiles SQLite's own C source into the crate, so no system library
# is linked; no default feature is enabled, which leaves out the statement cache.
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }

# CLI
clap = { version = "4", features = ["derive", "env", "string"] }

# Plugin system
libloading = "0.9"
# The password database, for a `~user` plugins directory.
libc = "0.2"

# Encoding
base64 = "0.22"

# Hashing
sha2 = "0.11"

# Text
regex = "1"

# Allocator: the `vep` binary's default global allocator (vep-cli feature
# `mimalloc`, on by default). Opt out with
# `cargo build -p vep-cli --no-default-features --bin vep`; the package must
# be named because another workspace member depends on vep-cli with its
# default features.
mimalloc = "0.1"

# Data structures
rustc-hash = "2"
bstr = "1"
indexmap = { version = "2", features = ["serde"] }
# Inline small vectors: vep-core's `ConsequenceList` keeps a per-transcript
# consequence-term list within its inline capacity on the stack, with no heap
# allocation or drop per (variant x transcript) consequence. `serde` is required
# because TranscriptConsequence derives Serialize/Deserialize; `union` saves a
# word for the Copy `Consequence` payload.
smallvec = { version = "1", features = ["serde", "union"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = "line-tables-only"
strip = "none"
