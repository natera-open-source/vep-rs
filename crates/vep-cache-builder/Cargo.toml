[package]
name = "vep-cache-builder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories = ["science::bioinformatics", "command-line-utilities"]
description = "Builds the VEP JSON transcript cache from Ensembl GFF3, protein FASTA and variation VCF release files"

[[bin]]
name = "vep-cache-builder"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
flate2 = { workspace = true }
base64 = { workspace = true }
reqwest = { version = "0.12", features = ["blocking"] }
noodles = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rayon = { workspace = true }
anyhow = { workspace = true }
vep-fasta = { workspace = true }
vep-core = { workspace = true }
mysql = { version = "28", default-features = false, features = ["default-rust"] }
md5 = "0.8"

[dev-dependencies]
tempfile = { workspace = true }
vep-cli = { workspace = true }
