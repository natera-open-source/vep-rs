[package]
name = "vep-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["vep", "ensembl", "variant-annotation", "vcf", "genomics"]
categories = ["science::bioinformatics", "science::bioinformatics::genomics", "command-line-utilities"]
description = "The vep command: a fast Rust reimplementation of the Ensembl Variant Effect Predictor (VEP) for VCF variant annotation, with VEP's flags and output formats"
default-run = "vep"

[lib]
name = "vep_cli"
path = "src/lib.rs"

[[bin]]
name = "vep"
path = "src/main.rs"

[[bin]]
name = "bench_plugins"
path = "src/bin/bench_plugins.rs"
required-features = ["bench"]

[dependencies]
vep-core = { workspace = true }
vep-effects = { workspace = true }
vep-io = { workspace = true }
vep-plugin = { workspace = true }
vep-builtins = { workspace = true }
vep-fasta = { workspace = true }
noodles = { workspace = true }
noodles-bgzf = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
csv = { workspace = true }
flate2 = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
bstr = { workspace = true }
smallvec = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
libc = { workspace = true }
mimalloc = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
criterion = { workspace = true }
parquet = { workspace = true }

[[bench]]
name = "cache_load_bench"
harness = false

[features]
default = ["mimalloc", "parquet"]
# Use mimalloc as the `vep` binary's global allocator.
mimalloc = ["dep:mimalloc"]
# The Parquet output format.
parquet = ["vep-io/parquet"]
# The `bench_plugins` binary, a development tool: off by default so that
# `cargo install vep-cli` installs `vep` alone.
bench = []
