[package]
name = "vep-io"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Input parsers (Ensembl, HGVS, SPDI, region, identifier) and output formatters (VEP, VCF, JSON, tab, Parquet) of vep-rs, a Rust reimplementation of Ensembl VEP"

[dependencies]
vep-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
thiserror = { workspace = true }
parquet = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
arrow-select = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

[features]
default = ["parquet"]
# The Parquet output format and its reader.
parquet = [
    "dep:parquet",
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:arrow-select",
    "dep:rayon",
]

[dev-dependencies]
criterion = { workspace = true }
smallvec = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "json_format_bench"
harness = false
