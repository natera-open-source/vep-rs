# The runs a release scores its supported plugins on, as data: one `[[run]]` a run, each naming
# the rows of scripts/parity/plugin_gate_rows.py it scores and the words both engines and the
# scorer take. scripts/concordance/reproduce_plugin_concordance.py reads this file and runs them.
#
# A whole run annotates a genome-wide dataset and is named by `family`, the group the plugin
# record lists its rows under. A corpus run annotates one committed corpus under
# tests/golden/116/ and is named by `corpus` and `set`: `base` is the manifest's own run, any
# other name a `flag_sets` entry of the manifest.
#
# Keys of a run:
#   rows               the derived rows it scores: plugin (the row's label), assembly, scored_on,
#                      dataset_or_corpus
#   reference          Ensembl VEP's default-format output the run is scored against
#   vep_rs             the words after `vep` for vep-rs; vep_rs_env its environment words
#   ensembl_vep        the words after `vep` for Ensembl VEP, as the reference's provenance
#                      records them; ensembl_vep_image the image that ran them
#   ensembl_vep_tools  programs the plugin calls that the image lacks
#   score              the words of `vep-plugin-pairs score` (tools/vep-plugin-pairs) that
#                      belong to the run: its plugins and every file a class reads
#   data_indexes       the index files that stand beside the plugin data files the run names
#
# A word in braces is a named input, filled by the caller; [inputs] says what each one is. No
# other word names a place outside the tree. A path under {plugin_data} is
# <scope>/<the path scripts/data/plugin_data_layout.sh gives the file>, the scope grch37, grch38
# or assembly_agnostic.

[inputs]
input = "the VCF a whole run annotates"
output = "the file vep-rs writes"
reference = "Ensembl VEP's default-format output of the same input under the run's ensembl_vep words"
fork = "the number of processes vep-rs forks"
vep_rs_cache = "the vep-rs JSON cache of the run's assembly"
fasta = "the reference FASTA of the run's assembly, with its .fai beside it"
plugin_data = "the plugin data directory"
loftee = "LoFTEE's checkout, its maxEntScan directory holding the stand-in files of scripts/data/write_loftee_stand_ins.py"
utrannotator_sweep = "the directory of Ensembl VEP's outputs under fixed Perl hash seeds that the UTRAnnotator classes read"
corpus = "the corpus directory"
generated = "the directory the corpus manifest's `generated` command writes"
home = "an empty directory that stands as the home directory of a corpus run"
ensembl_vep_cache = "the directory holding Ensembl VEP's cache, homo_sapiens/116_<assembly> beneath it"
ensembl_vep_output = "the file Ensembl VEP writes"
ensembl_vep_dir = "a writable directory: Ensembl VEP's GWAS module writes its sorted copy of the catalog there"
plugin_modules = "the directory of Ensembl VEP's plugin modules, a VEP_plugins checkout at release/116"

