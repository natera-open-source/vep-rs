entry = "bare_m_chromosome"
page = "docs/divergences/bare-m-chromosome.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "unobserved"
input_class_basis = "well-formed under the VCF 4.2 specification, section 1.4.1 \"Fixed fields\", CHROM (a String, no whitespace permitted); not seen in the measured datasets"
notes = "Both caches' chr_synonyms.txt link chrM to MT, so Ensembl VEP admits M as chrM and never renames it to MT; the compared rows are the record's MT-ATP6 row and its intergenic row."

[input]
format = "vcf"
text = """
M	8993	m8993	T	G	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-input-hgvs/json_cache"
chromosomes = ["MT"]

[run]
flags = []

[compare]
kind = "rows"
where = { record = "m8993", feature = ["-", "ENST00000361899"] }

[expected]
ensembl_vep = ["M:8993 | G | - | intergenic_variant"]
vep_rs = ["M:8993 | G | ENST00000361899 | missense_variant"]

[implementation]
code = [
    "crates/vep-cli/src/pipeline.rs::renames_m_to_mt",
    "crates/vep-core/src/synonyms.rs::ChromosomeSynonyms::source_chr_name",
]
tests = [
    "crates/vep-cli/src/pipeline.rs::tests::bare_m_is_renamed_mt_only_when_no_synonym_reaches_the_cache",
    "crates/vep-cli/tests/documented_subsets.rs::chromosome_synonyms_two_hop_exclusion_is_documented",
    "crates/vep-core/src/synonyms.rs::tests::chr_prefix_rule_runs_when_no_synonym_matches",
]
