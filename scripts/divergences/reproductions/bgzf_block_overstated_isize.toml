entry = "bgzf_block_overstated_isize"
page = "docs/divergences/malformed-bgzf-block.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "malformed"
input_class_basis = "a BGZF file is \"a series of concatenated BGZF blocks\" and a block's ISIZE is the \"length of uncompressed data\", \"limited to the range [0,65536]\" (SAM specification, section 4.1 \"The BGZF compression format\"): a block's trailer declares more bytes than its data inflates to, or the file ends inside a block"
notes = "The corpus's BGZF file holds one data block and the end-of-file block; the data block's ISIZE is rewritten to 131072, above the 65536 bytes a block can inflate to. gzip inflates the block's records and then reports the length error, once per parser object that opens the file, and Ensembl VEP writes a row for every record of the block; vep-rs refuses the block and writes none."
prepare = [
  'src="$CORPUS/variants.vcf.bgz"; n=$(wc -c < "$src"); { head -c $((n - 32)) "$src"; printf "\x00\x00\x02\x00"; tail -c 28 "$src"; } > "$STAGE/overstated.vcf.bgz"',
]

[input]
format = "vcf"
path = "{stage}/overstated.vcf.bgz"

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-input-compressed/json_cache"
chromosomes = ["21", "22"]

[run]
flags = ["--max_sv_size", "-1"]

[compare]
kind = "stderr"
pattern = "malformed BGZF block|length error"

[expected]
ensembl_vep = [
  "gzip: <path> invalid compressed data--length error",
  "gzip: <path> invalid compressed data--length error",
]
vep_rs = ["ERROR: [input] malformed BGZF block at offset 0 in <path>"]
