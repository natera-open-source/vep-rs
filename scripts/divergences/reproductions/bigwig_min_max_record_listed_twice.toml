entry = "bigwig_min_max_record_listed_twice"
page = "docs/divergences/bigwig-min-max-record-listed-twice.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "unobserved"
input_class_basis = "well-formed under the type and summary_stats options of --custom, overlap and a percentage-separated list among min, mean, max, count and sum (Ensembl VEP documentation, \"Custom annotations\", Options); not seen in the measured datasets"
notes = "custom/scores.bw of the GRCh38-custom corpus holds one-base intervals at the 1-based positions 21:5028997 and 21:5028999 with the values 0.001 and 0.002. The record spans both, three bases, so the source's min and max path reads it by the per-record walk, which Ensembl VEP runs twice."

[input]
format = "vcf"
text = """
21	5028997	mnv	TCA	AGT	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-custom/json_cache"

[run]
flags = ["--custom", "file={corpus}/custom/scores.bw,short_name=cons,format=bigwig,type=overlap,summary_stats=min%max"]
format = "default"

[compare]
kind = "field"
field = "cons"
where = { record = "mnv" }

[expected]
ensembl_vep = ["0.00100000004749745,0.0020000000949949,0.00100000004749745,0.0020000000949949"]
vep_rs = ["0.00100000004749745,0.0020000000949949"]

[implementation]
code = [
    "crates/vep-builtins/src/custom/bigwig.rs::BigWigSource::prefetch",
    "crates/vep-builtins/src/custom/bigwig.rs::BigWigSource::takes_span_rule",
]
tests = [
    "crates/vep-builtins/src/custom/bigwig.rs::tests::small_spans_are_annotated_once_on_the_min_max_path",
    "crates/vep-cli/tests/documented_subsets.rs::conservation_exclusions_are_documented",
]
