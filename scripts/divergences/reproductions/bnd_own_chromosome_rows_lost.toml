entry = "bnd_own_chromosome_rows_lost"
page = "docs/divergences/defect-p.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "unobserved"
input_class_basis = "well-formed under the VCF 4.2 specification, section 5.4 \"Specifying complex rearrangements with breakends\" (bracket breakend records with SVTYPE=BND whose mates lie on another chromosome; no clause fixes the spelling of a mate chromosome name); not seen in the measured datasets"
notes = "The entry's first mechanism, the own-end rows lost to load order. The first record asks for the chromosome 21 region holding the transcripts within reach of the second record's mate before the second record's own region is asked for, so a chromosome 21 transcript names the second record's slice and its chromosome 1 transcripts fail the slice test; vep-rs annotates each breakend on its own chromosome. The second mechanism, the mate rows lost to a mate written Chr21, is not reproduced here."

[input]
format = "vcf"
text = """
1	14374333	first_bnd	N	]21:33034355]N	.	.	SVTYPE=BND
1	16900000	own_end_lost	N	N]21:33033339]	.	.	SVTYPE=BND
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh37"
json_cache = "tests/golden/116/GRCh37/json_cache"

[run]
flags = []

[compare]
kind = "rows"
where = { record = "own_end_lost", allele = "N.", feature = "ENST00000430580" }
columns = ["Location", "Allele", "Feature", "Consequence"]

[expected]
ensembl_vep = []
vep_rs = ["1:16900001 | N. | ENST00000430580 | feature_truncation,intron_variant"]
