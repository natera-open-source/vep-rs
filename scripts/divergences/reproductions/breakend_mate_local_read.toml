entry = "breakend_mate_local_read"
page = "docs/divergences/defect-e.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "seen in gnomad_sv_v4.1_chr21.vcf.gz, the gnomAD-SV file of the GRCh38 structural-variant set: 4,158 pairs of class 11"
notes = "The mate-allele rows are selected by the mate's coordinate, 21:30425600, and Ensembl VEP evaluates them at the record's own coordinate, 21:11200001, so the transcript the mate lies in gets bare feature_truncation and the one it lies near intergenic_variant; vep-rs evaluates the mate where it is."

[input]
format = "vcf"
text = """
21	11200000	bnd_intergenic_with_genic_mate	N	N[21:30425600[	.	.	SVTYPE=BND
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-input-compressed/json_cache"

[run]
flags = []

[compare]
kind = "rows"
where = { record = "bnd_intergenic_with_genic_mate", allele = "N[21:30425600[" }
columns = ["Location", "Allele", "Feature", "Consequence", "DISTANCE"]

[expected]
ensembl_vep = [
  "21:11200001 | N[21:30425600[ | ENST00000334068 | intergenic_variant | -",
  "21:11200001 | N[21:30425600[ | ENST00000390690 | feature_truncation | -",
]
vep_rs = [
  "21:11200001 | N[21:30425600[ | ENST00000334068 | upstream_gene_variant | 4620",
  "21:11200001 | N[21:30425600[ | ENST00000390690 | feature_truncation,coding_sequence_variant | -",
]

[implementation]
code = [
    "crates/vep-effects/src/sv/breakend.rs::calculate_paired_mate",
    "crates/vep-effects/src/sv/breakend.rs::mate_breakpoint",
]
tests = [
    "crates/vep-effects/src/concordance_tests.rs::concordance_mate_side_row_inside_intron_is_truncation_and_intron_variant",
    "crates/vep-effects/src/concordance_tests.rs::concordance_mate_side_row_upstream_within_5kb_is_upstream_gene_variant",
    "crates/vep-effects/src/sv/breakend.rs::tests::test_paired_mate_row_does_not_read_the_local_coordinate",
]
rules = [
    "tools/vep-formats-compare/src/rules/structural.rs::filter_breakend_mate_local_read_pairs",
    "tools/vep-golden-corpus/src/classify/keys.rs::classify_mate_side_pair",
    "tools/vep-sv-compare/src/masks/mate_read.rs::filter_breakend_mate_local_read_pairs",
]
