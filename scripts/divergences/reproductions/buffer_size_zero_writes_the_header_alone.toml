entry = "buffer_size_zero_writes_the_header_alone"
page = "docs/divergences/buffer-size-zero.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "unobserved"
input_class_basis = "well-formed under the --buffer_size option, an integer with no stated lower bound (Bio::EnsEMBL::VEP::Config, `buffer_size=i`; Ensembl VEP documentation, \"Running Ensembl VEP\", --buffer_size); not seen in the measured datasets"
notes = "Ensembl VEP fills its buffer while it holds fewer records than `--buffer_size` (InputBuffer.pm:191, 212), so at 0 the first fill is empty, the run reads that as the end of the input (Runner.pm:423-424, 476-477) and exits 0 with the header alone. vep-rs closes a batch once it holds a record and writes the record's five rows, the rows both engines write at `--buffer_size 1` and at the default."

[input]
format = "vcf"
text = """
21	45573402	utr_and_intron	C	T	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-pick-summary/json_cache"

[run]
flags = []
buffer_size = 0

[compare]
kind = "rows"
where = { record = "utr_and_intron" }

[expected]
ensembl_vep = []
vep_rs = [
  "21:45573402 | T | ENST00000651099 | upstream_gene_variant",
  "21:45573402 | T | ENST00000763267 | upstream_gene_variant",
  "21:45573402 | T | ENST00000763268 | intron_variant,non_coding_transcript_variant",
  "21:45573402 | T | ENST00000763269 | upstream_gene_variant",
  "21:45573402 | T | ENST00000859469 | 5_prime_UTR_variant",
]
