entry = "cache_without_transcript_shards"
page = "docs/divergences/damaged-cache-shard.md#a-cache-holding-no-transcript-shard"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "malformed"
input_class_basis = "a cache directory is one \"containing transcript data and potentially also regulatory and variation data\" (Bio::EnsEMBL::VEP::CacheDir module documentation, DESCRIPTION) and a cache holds \"all transcript models\" for a species (Ensembl VEP documentation, \"Annotation sources\", opening list): no chromosome directory of the cache holds a transcript file"
notes = "Each cache holds its metadata file and an empty chromosome 21 directory and nothing else."
# An Ensembl VEP cache of info.txt and an empty 21/; a vep-rs cache of info.json and an empty transcripts/21/.
prepare = [
  "mkdir -p \"$STAGE/perl-cache/homo_sapiens/116_GRCh38/21\" \"$STAGE/json-cache/transcripts/21\"",
  "printf 'species\\thomo_sapiens\\nassembly\\tGRCh38\\n' > \"$STAGE/perl-cache/homo_sapiens/116_GRCh38/info.txt\"",
  "printf '{\"species\": \"homo_sapiens\", \"assembly\": \"GRCh38\", \"cache_version\": 116}\\n' > \"$STAGE/json-cache/info.json\"",
]

[input]
format = "vcf"
text = """
21	43774760	4725737	C	T	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "{stage}/json-cache"
perl_cache = "{stage}/perl-cache"
corpus = "tests/golden/116/GRCh38-pick-summary"

[run]
flags = []

[compare]
kind = "stderr"
pattern = "no transcript shards"

[expected]
ensembl_vep = []
vep_rs = ["ERROR: [cache] no transcript shards under <path> (serialiser_type storable)"]

[implementation]
code = ["crates/vep-cli/src/json_cache.rs::enumerate_transcript_shards"]
tests = [
    "crates/vep-cli/src/json_cache.rs::tests::cache_with_shards_only_in_a_dot_directory_is_refused",
    "crates/vep-cli/src/json_cache.rs::tests::sereal_cache_without_shards_is_refused",
    "crates/vep-cli/tests/documented_subsets.rs::cache_without_a_transcript_shard_refusal_is_documented",
]
