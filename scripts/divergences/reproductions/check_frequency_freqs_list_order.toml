entry = "check_frequency_freqs_list_order"
page = "docs/divergences/check-frequency-freqs-order.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 405.6 per million · 5 flag sets, 80 corpora"
notes = "The record's two alternate alleles are those of the known rs1555870136 (T/A/G, AF G:1). Ensembl VEP keeps the frequencies it judged in a hash keyed by allele (BaseCacheVariation.pm:405-441) and writes FREQS from that hash's keys (OutputFactory.pm:1152-1153): G before A under the fixed seed of this run, and either order under Perl's own seed. vep-rs writes the alleles in the record's order."

[input]
format = "vcf"
text = """
21	7759128	two_alts	T	A,G	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-colocated/json_cache"

[run]
flags = ["--check_frequency", "--freq_pop", "AF", "--freq_freq", "0.01", "--freq_gt_lt", "gt", "--freq_filter", "exclude"]
format = "default"

[compare]
kind = "field"
field = "FREQS"
where = { record = "two_alts" }

[expected]
ensembl_vep = ["AF:G:1,AF:A:NA"]
vep_rs = ["AF:A:NA,AF:G:1"]

[implementation]
code = ["crates/vep-cli/src/frequency_filter.rs::FrequencyFilter::filter_record"]
tests = [
    "crates/vep-cli/src/frequency_filter.rs::tests::a_repeated_alt_is_listed_once_in_freqs",
    "crates/vep-cli/src/frequency_filter.rs::tests::partial_pass_rewrites_allele_string",
]
