entry = "check_frequency_reset_reach_under_minimal"
page = "docs/output/known-variants.md#filtering-by-frequency"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "observed"
input_class_basis = "2 · 121.0 per million · 2 flag sets, 24 corpora"
notes = "Four lines under --buffer_size 4: the split record on line 1 and the dropped common record (rs8131855, AF 0.0986) on line 4. Ensembl VEP under --fork 1 annotates the buffer in chunks of int(4 / 2) records, so the drop in the second chunk leaves the first chunk's rejoin standing and the split allele's row takes the record's span; vep-rs's batch of four lines holds the drop, so the split record is reset and the row takes the allele's own span."

[input]
format = "vcf"
text = """
21	34716319	split	AGATT	AGATC,A	.	.	.
21	34792161	rs2516812694	C	A	.	.	.
21	37493056	rs1555985565	G	T	.	.	.
21	38441162	drop	A	G	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-everything/json_cache"

[run]
flags = ["--minimal", "--check_frequency", "--freq_pop", "AF", "--freq_freq", "0.01", "--freq_gt_lt", "gt", "--freq_filter", "exclude"]
format = "default"
buffer_size = 4

[compare]
kind = "rows"
where = { record = "split", allele = "C", feature = "ENST00000349499" }

[expected]
ensembl_vep = ["21:34716320-34716323 | C | ENST00000349499 | splice_region_variant,synonymous_variant"]
vep_rs = ["21:34716323 | C | ENST00000349499 | splice_region_variant,synonymous_variant"]
