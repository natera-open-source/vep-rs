entry = "check_svs_mate_chromosome"
page = "docs/divergences/check-svs-mate-chromosome.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "unobserved"
input_class_basis = "well-formed under the VCF 4.2 specification, section 5.4 \"Specifying complex rearrangements with breakends\" (a bracket breakend record whose mate names another chromosome) and the Ensembl VEP documentation, \"Running Ensembl VEP\", --check_svs; not seen in the measured datasets"
notes = "Ensembl VEP's --check_svs reads the structural variants from its database, so it runs in database mode; vep-rs reads them from the corpus's file. nsv6146554 spans 5029000 to 5047000 on chromosome 21: it lies below the breakend's own breakpoint at 5047002 and holds the mate's number, 5035000, so it names the breakend on Ensembl VEP through the chromosome-blind mate match alone."

[input]
format = "vcf"
text = """
21	5047000	snv_5047000	T	A	.	.	.
21	5047001	bnd_mate_chr22	T	T[22:5035000[	.	.	SVTYPE=BND
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-checksvs/json_cache"

[run]
perl_mode = "database"
flags = []
ensembl_vep_flags = ["--check_svs"]
vep_rs_flags = ["--check_svs", "{corpus}/structural_variants.vcf.gz"]

[compare]
kind = "field"
field = "SV"
where = { record = "bnd_mate_chr22", allele = "T[22:5035000[" }

[expected]
ensembl_vep = ["nsv2770691,nsv3109934,nsv3163927,nsv3167562,nsv533679,nsv6146554"]
vep_rs = ["nsv2770691,nsv3109934,nsv3163927,nsv3167562,nsv533679"]
