entry = "chromosome_name_resolution"
page = "docs/cache-setup.md#chromosome-names"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "observed"
input_class_basis = "2 · 487 of 487 MT records · 24 flag sets, 11 corpora"
notes = "chrNC_000021.9 reaches the cache's 21 only through a synonym of its chr-stripped spelling: Ensembl VEP's validation widens the valid names with their synonyms and accepts the stripped name, then resolves the unwidened name one hop to nothing and writes the record as intergenic under its own name; vep-rs resolves the name once and skips the record as not found. A bare M is the entry bare_m_chromosome."

[input]
format = "vcf"
text = """
chrNC_000021.9	42372764	chr_prefixed_synonym	A	G	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-synonyms/json_cache"
chromosomes = ["21"]

[run]
flags = []

[compare]
kind = "rows"
where = { record = "chr_prefixed_synonym" }
columns = ["Location", "Allele", "Feature", "Consequence"]

[expected]
ensembl_vep = ["chrNC_000021.9:42372764 | G | - | intergenic_variant"]
vep_rs = []
