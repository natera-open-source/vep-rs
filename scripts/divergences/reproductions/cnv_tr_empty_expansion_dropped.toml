entry = "cnv_tr_empty_expansion_dropped"
page = "docs/divergences/defect-l.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "unobserved"
input_class_basis = "well-formed under the VCF 4.4 specification, section 5.7 \"Representing tandem repeats\" (a <CNV:TR> allele whose repeat count equals the reference count); not seen in the measured datasets; classed by its most reachable shape, that unchanged count: a RUC that is no number breaks its Float type (section 3)"
notes = "The run at 30425588-30425596 is three copies of AGC. With the FASTA Ensembl VEP expands RN=. to no alternate allele and RUC=3 to the reference run itself, and either record passes the parser with no allele to annotate: no row, no warning. vep-rs runs without a FASTA and writes the symbolic tandem_repeat rows over the run, the row of same_ruc without a direction term, since its record states exactly the run's length (cnv_tr_symbolic_loss_named_a_gain); with a FASTA it follows the expansion and writes what Ensembl VEP writes."

[input]
format = "vcf"
text = """
21	30425587	gain_rn_dot	N	<CNV:TR>	.	.	SVTYPE=CNV;END=30425596;SVLEN=9;RN=.;RUS=AGC;RUC=4
21	30425587	same_ruc	N	<CNV:TR>	.	.	SVTYPE=CNV;END=30425596;SVLEN=9;RUS=AGC;RUC=3
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-release116/json_cache"

[run]
flags = []
ensembl_vep_flags = ["--fasta", "{repo}/tests/golden/116/GRCh38-merged/reference.fa.gz"]

[compare]
kind = "rows"
where = { record = ["gain_rn_dot", "same_ruc"], feature = "ENST00000390690" }
columns = ["Uploaded_variation", "Location", "Allele", "Feature", "Consequence"]

[expected]
ensembl_vep = []
vep_rs = [
  "gain_rn_dot | 21:30425588-30425596 | tandem_repeat | ENST00000390690 | feature_elongation,coding_sequence_variant",
  "same_ruc | 21:30425588-30425596 | tandem_repeat | ENST00000390690 | coding_sequence_variant",
]

[implementation]
code = [
    "crates/vep-cli/src/vcf_parser.rs::tandem_repeat_record",
    "crates/vep-core/src/sv_record.rs::tandem_repeat_allele_string",
]
tests = [
    "crates/vep-cli/src/vcf_parser.rs::tests::cnv_tr_expanded_with_fasta",
    "crates/vep-cli/src/vcf_parser.rs::tests::cnv_tr_stays_sv_without_fasta",
    "crates/vep-cli/tests/integration_test.rs::every_allele_of_a_tandem_repeat_without_a_fasta_is_the_symbolic_gain",
]
rules = [
    "tools/vep-sv-compare/src/masks/cnv_tr.rs::cnv_tr_expansion_is_empty",
    "tools/vep-sv-compare/src/masks/cnv_tr.rs::filter_cnv_tr_empty_expansion",
]
