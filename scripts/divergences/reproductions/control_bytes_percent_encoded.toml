entry = "control_bytes_percent_encoded"
page = "docs/divergences/control-bytes-in-output.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "unobserved"
input_class_basis = "well-formed under the VCF 4.2 specification, section 1.4.1 \"Fixed fields\", ID (no whitespace or semicolons permitted); not seen in the measured datasets; classed by its most reachable shape, an escape byte in an identifier: a form feed there is whitespace, which that clause excludes, and the VCF 4.3 specification, section 1.2, disallows both bytes"
notes = "The record's ID carries a form feed (0x0C) between `ctrl` and `byte`. Ensembl VEP writes the byte as read in the Uploaded_variation column; vep-rs writes it as %0C."

[input]
format = "vcf"
text = """
21	30881493	ctrl\fbyte	G	A	.	PASS	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-writers/json_cache"

[compare]
kind = "field"
field = "Uploaded_variation"
where = { location = "21:30881493", feature = "ENST00000332378" }

[expected]
ensembl_vep = ["ctrl\fbyte"]
vep_rs = ["ctrl%0Cbyte"]

