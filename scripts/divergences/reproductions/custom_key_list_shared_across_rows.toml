entry = "custom_key_list_shared_across_rows"
page = "docs/divergences/custom-key-list-shared-across-rows.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "unobserved"
input_class_basis = "well-formed under the short_name and fields options of --custom, which hold a source's key to no rule against a column or a flag field (AnnotationSourceAdaptor.pm lines 335 to 383 at release 116.3), and under the flags --af_gnomadg, --check_existing, --var_synonyms, --mane_select and --nearest; not seen in the measured datasets"
notes = "The sites file of the custom corpus as an overlap source named gnomADg that asks for AF and CLASS, so its AF stands under the key gnomADg_AF on every row of a record it overlaps, under --af_gnomadg, over the cache of the everything corpus. The first and the third record are lines 9 and 10 of the custom corpus's input; the second is the first with its alternate alleles in the other order. The known variant of the first site holds a gnomAD genomes frequency for the allele C alone, that of the second site one for each allele. Ensembl VEP lists every allele's frequency on every row of a record; vep-rs lists on each row the frequency of the row's own allele. The further runs give the same source a key of another name. Named Existing_variation under --check_existing, over the same three records: Ensembl VEP lists each co-located identifier once for each row of its record on every row; vep-rs lists it once. Over line 42 of the custom corpus's input, one allele with sixteen rows: named MANE under --mane_select, Ensembl VEP writes MANE_Select on all sixteen rows and vep-rs on the row of the one transcript of that set; named VAR_SYNONYMS under --check_existing --var_synonyms, Ensembl VEP repeats the synonyms once more on each later row and vep-rs lists them once; read as an exact source named NEAREST under --nearest symbol, Ensembl VEP lists the allele's record sixteen times on every row and vep-rs once."
prepare = [
  "mkdir -p \"$STAGE/perl-cache/homo_sapiens/116_GRCh38\" && cp -al \"$PERL_CACHE/21\" \"$PERL_CACHE/info.txt\" \"$STAGE/perl-cache/homo_sapiens/116_GRCh38/\"",
]

[input]
format = "vcf"
text = """
21	5380280	rs1444031311	A	C,G	.	.	.
21	5380280	alleles_reversed	A	G,C	.	.	.
21	8987421	rs766964238	G	C,T	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-everything/json_cache"
perl_cache = "{stage}/perl-cache"
writable = true

[run]
flags = [
  "--af_gnomadg",
  "--custom", "file={repo}/tests/golden/116/GRCh38-custom/custom/sites.vcf.gz,short_name=gnomADg,format=vcf,type=overlap,fields=AF%CLASS",
]
format = "default"

[compare]
kind = "rows"
where = { location = ["21:5380280", "21:8987421"] }
columns = ["Uploaded_variation", "Allele", "Feature", "gnomADg_AF"]

