entry = "custom_non_integer_num_records"
page = "docs/divergences/defect-n.md#26-a---custom-record-limit-that-is-not-a-whole-number"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "malformed"
input_class_basis = "the accepted values of the num_records option of --custom are 50 (default), all, 0 or any positive integer (Ensembl VEP documentation, \"Custom annotations\", Options, num_records): the source is given a value with a fraction or a minus sign"
notes = "The limit 1.5, the first shape of the class: the insertion overlaps two records of sites.vcf.gz, Ensembl VEP lists both and no `...` marker, vep-rs lists one and the marker, as both engines do under num_records=1. Every transcript row of the record prints the same list; the compare reads the first transcript's."

[input]
format = "vcf"
text = """
21	10542414	ins_padded	A	AT	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-custom/json_cache"
fasta = "tests/golden/116/GRCh38-custom/reference.fa.gz"

[run]
flags = ["--custom", "file={corpus}/custom/sites.vcf.gz,short_name=sites,format=vcf,type=overlap,coords=1,num_records=1.5,fields=AF%CLASS"]
format = "default"

[compare]
kind = "field"
field = "sites"
where = { record = "ins_padded", feature = "ENST00000427445" }

[expected]
ensembl_vep = ["21:10542415-10542414,21:10542415-10542415"]
vep_rs = ["21:10542415-10542414,..."]

[implementation]
code = ["crates/vep-builtins/src/custom/grammar.rs::record_count"]
tests = [
    "crates/vep-builtins/src/custom/grammar.rs::tests::a_fractional_or_negative_num_records_is_read_as_a_count_with_one_warning",
    "crates/vep-builtins/src/custom/source.rs::tests::a_num_records_warning_is_written_once_the_source_opens",
    "crates/vep-builtins/src/custom/source.rs::tests::num_records_cap_appends_an_ellipsis_and_zero_lists_only_it",
]
