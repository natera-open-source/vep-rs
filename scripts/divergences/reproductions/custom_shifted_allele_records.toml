entry = "custom_shifted_allele_records"
page = "docs/custom-annotation.md#3-an-exact-custom-record-on-a-row-whose-allele---shift_3prime-1-rotated"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "observed"
input_class_basis = "2 · 76,935 per million · 0 flag sets, 89 corpora"
notes = "The first shape of the class: the two coding rows print the rotated allele CAT and lose the record on Ensembl VEP, while the upstream row, allele TCA, keeps it on both engines."
# An exact VCF source holding one record, the input's own allele, with CLNSIG=Pathogenic.
prepare = [
  "printf '##fileformat=VCFv4.2\\n##INFO=<ID=CLNSIG,Number=.,Type=String,Description=\"Clinical significance\">\\n##contig=<ID=21>\\n#CHROM\\tPOS\\tID\\tREF\\tALT\\tQUAL\\tFILTER\\tINFO\\n21\\t13620283\\trec_tca\\tG\\tGTCA\\t.\\tPASS\\tCLNSIG=Pathogenic\\n' | bgzip > \"$STAGE/clinvar.vcf.gz\"",
  "tabix -p vcf \"$STAGE/clinvar.vcf.gz\"",
]

[input]
format = "vcf"
text = """
21	13620283	cds_tri_ins_fwd_1	G	GTCA	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-identifiers/json_cache"
fasta = "tests/golden/116/GRCh38-identifiers/reference.fa.gz"

[run]
flags = ["--shift_3prime", "1", "--custom", "file={stage}/clinvar.vcf.gz,short_name=ClinVar,format=vcf,type=exact,fields=CLNSIG"]
format = "default"

[compare]
kind = "rows"
where = { record = "cds_tri_ins_fwd_1" }
columns = ["Allele", "Feature", "ClinVar", "ClinVar_CLNSIG"]

[expected]
ensembl_vep = [
  "CAT | ENST00000299443 | - | -",
  "TCA | ENST00000384745 | rec_tca | Pathogenic",
  "CAT | ENST00000620442 | - | -",
]
vep_rs = [
  "CAT | ENST00000299443 | rec_tca | Pathogenic",
  "TCA | ENST00000384745 | rec_tca | Pathogenic",
  "CAT | ENST00000620442 | rec_tca | Pathogenic",
]
