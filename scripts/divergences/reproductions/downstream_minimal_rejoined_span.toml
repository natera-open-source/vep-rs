entry = "downstream_minimal_rejoined_span"
page = "docs/divergences/downstream-minimal-rejoined-span.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "observed"
input_class_basis = "2 · 121.0 per million · 0 flag sets, 24 corpora"
notes = "The first alternate allele trims to a one-base insertion between coding bases 1427 and 1428 of ENST00000336648, the second to the deletion of coding base 1428. In the default format Ensembl VEP's plugin reads the rejoined record's CDS coordinates (Downstream.pm:108) and writes the insertion's base over coding base 1428, an in-frame change of length 0; vep-rs reads the insertion's own coordinates and writes the frameshift's -151, the value both engines write for the second record, the same insertion alone."

[input]
format = "vcf"
text = """
21	36896882	ins_beside_del	TG	TGA,T	.	.	.
21	36896883	ins_alone	G	GA	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-computed/json_cache"
fasta = "tests/golden/116/GRCh38-plugin-computed/reference.fa.gz"

[run]
flags = ["--minimal", "--plugin", "Downstream"]
format = "default"

[compare]
kind = "field"
field = "ProteinLengthChange"
with_key = true
where = { record = ["ins_beside_del", "ins_alone"], feature = "ENST00000336648", allele = "A" }

[expected]
ensembl_vep = ["ENST00000336648=-151", "ENST00000336648=0"]
vep_rs = ["ENST00000336648=-151", "ENST00000336648=-151"]
