entry = "downstream_start_past_own_codon"
page = "docs/divergences/downstream-start-past-own-codon.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 59,397 per million · 6 flag sets, 137 corpora"
notes = "The ClinVar record of the page's first example deletes coding base 1812 of ENST00000398960, the third base of codon 604. Ensembl VEP's plugin starts its downstream translation at offset 1812 - (1812 % 3) = 1812, the first base of codon 605 (Downstream.pm:113), and writes 50 residues; vep-rs starts at codon 604 and writes 51, the lysine of the changed codon and then the same 50. The mask stands for those 50 residues, equal on both sides. Both engines write p.Asn604LysfsTer52 and ProteinLengthChange=-109, which count the residue Ensembl VEP's DownstreamProtein leaves out."

[input]
format = "vcf"
text = """
21	37512050	2081367	AC	A	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-computed/json_cache"
fasta = "tests/golden/116/GRCh38-plugin-computed/reference.fa.gz"

[run]
flags = ["--hgvs", "--plugin", "Downstream"]
format = "default"

[compare]
kind = "rows"
where = { record = "2081367", feature = "ENST00000398960" }
columns = ["Feature", "Consequence", "CDS_position", "HGVSp", "ProteinLengthChange", "DownstreamProtein"]
mask = ["[A-Z]{50}$"]

[expected]
ensembl_vep = ["ENST00000398960 | frameshift_variant | 1812 | ENSP00000381932.2:p.Asn604LysfsTer52 | -109 | <masked>"]
vep_rs = ["ENST00000398960 | frameshift_variant | 1812 | ENSP00000381932.2:p.Asn604LysfsTer52 | -109 | K<masked>"]

[implementation]
code = ["crates/vep-builtins/src/plugins/downstream.rs::translate_change"]
tests = [
    "crates/vep-builtins/src/plugins/downstream.rs::tests::a_deletion_at_a_codons_last_base_starts_at_that_codon",
    "crates/vep-builtins/src/plugins/downstream.rs::tests::clinvar_deletions_of_a_codons_last_base_start_at_the_codon_they_change",
]
rules = [
    "tools/vep-formats-compare/src/rules/downstream.rs::downstream_start_rule_class",
    "tools/vep-plugin-pairs/src/rules/downstream/classes.rs::downstream_start_rule_class",
]
