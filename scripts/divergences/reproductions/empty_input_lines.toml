entry = "empty_input_lines"
page = "docs/divergences/empty-vcf-lines.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "unobserved"
input_class_basis = "well-formed under the default input format, whose parser provides for empty lines (Bio::EnsEMBL::VEP::Parser, skip_empty_lines); not seen in the measured datasets; classed by its most reachable shape, an empty line in that format: one in a VCF breaks \"8 fixed fields per record\" (VCF 4.2 specification, section 1.4.1)"
notes = "The first mechanism of the entry, in a VCF: two empty lines in a row between two records. Ensembl VEP's first buffer fill ends at the first empty line, the next fill begins on the second and holds nothing, and the run ends with the first record's row alone and no message; vep-rs skips both lines with the warning `Skipped 2 empty lines from line 2` and annotates the second record."

[input]
format = "vcf"
text = """
21	30881493	before_empty	G	A	.	PASS	.


21	30883080	after_empty	C	A	.	PASS	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-writers/json_cache"

[compare]
kind = "rows"
where = { record = "after_empty" }

[expected]
ensembl_vep = []
vep_rs = ["21:30883080 | A | ENST00000332378 | upstream_gene_variant"]

[implementation]
code = [
    "crates/vep-cli/src/pipeline.rs::empty_lines_report",
    "crates/vep-cli/src/pipeline.rs::read_vcf_lines",
]
tests = [
    "crates/vep-cli/src/pipeline.rs::tests::the_vcf_reader_holds_each_empty_run_in_its_batch_at_its_place",
    "crates/vep-cli/tests/input_ensembl.rs::empty_lines_are_skipped_with_a_warning",
    "crates/vep-cli/tests/input_io.rs::blank_lines_are_skipped_and_warned",
]
