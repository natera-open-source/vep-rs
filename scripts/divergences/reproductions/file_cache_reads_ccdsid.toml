21	havana	CDS	42388403	42388526	.	-	2	ID=CDS:ENSP00000381434;Parent=transcript:ENST00000398397;protein_id=ENSP00000381434;version=3
21	havana	exon	42388929	42389045	.	-	.	Parent=transcript:ENST00000398397;Name=ENSE00003625818;constitutive=0;ensembl_end_phase=1;ensembl_phase=1;exon_id=ENSE00003625818;rank=4;version=1
