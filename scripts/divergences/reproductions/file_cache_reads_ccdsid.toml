[input]
format = "vcf"
text = """
21	42395417	1995820	T	C	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "{stage}/json_cache"
corpus = "tests/golden/116/GRCh38-gtf-builder"
gxf = "{stage}/tmprss3_ccds.gff3.gz"
gxf_kind = "gff"
fasta = "tests/golden/116/GRCh38-gtf-builder/reference.fa.gz"

[run]
flags = ["--ccds"]

[compare]
kind = "field"
field = "CCDS"
where = { record = "1995820", feature = "ENST00000398397" }

[expected]
ensembl_vep = ["-"]
vep_rs = ["CCDS42939.1"]

[implementation]
code = ["crates/vep-cache-builder/src/gff3.rs::transcript_record"]
tests = [
    "crates/vep-cache-builder/src/gff3.rs::tests::ccdsid_becomes_ccds",
    "crates/vep-cache-builder/src/gtf.rs::tests::ccds_id_becomes_ccds",
    "crates/vep-cache-builder/tests/custom_transcript_source.rs::a_gtf_ccds_id_is_the_cache_ccds",
    "crates/vep-cli/tests/documented_subsets.rs::file_cache_ccdsid_divergence_is_documented",
