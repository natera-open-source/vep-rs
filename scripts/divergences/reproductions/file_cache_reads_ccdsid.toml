input_class = "observed"
input_class_basis = "2 · 235 of 116,165 cache transcripts · 1 flag set, 2 corpora"
notes = "The GRCh38 release-116 GFF3 lines of TMPRSS3 and ENST00000398397, whose transcript line carries ccdsid=CCDS42939.1. Ensembl VEP's --gff source reads no ccdsid (BaseGXF.pm:632-703, _add_identifiers), so the transcript has no _ccds and OutputFactory.pm:1543-1546 prints no CCDS; vep-rs reads the attribute into the cache and prints it. Removing the ccdsid attribute makes the engines agree. The transcript's GTF lines part the engines the same way through --gtf: the transcript line carries ccds_id \"CCDS42939\" (GTFSerializer.pm:459-464, the xref's primary identifier without the version), and vep-rs prints CCDS42939 as the GTF carries it."
