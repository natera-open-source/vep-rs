entry = "fork_warning_pid_prefix"
page = "docs/divergences/fork-warning-pid-prefix.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 17 of 511 flag sets · 511 flag sets, 7 corpora"
notes = "Every Ensembl VEP run here passes --fork 1, so the child that annotates the record raises the transcript-assembly mismatch into its captured standard error and the parent relays it behind the child's process id (Runner.pm:565); the id varies by host and is masked. vep-rs writes the condition alone at every worker count."

[input]
format = "vcf"
text = """
21	45505371	rs922296917	CGGCCCTCCGGGCCCCCCTG	C	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
source = "refseq"
json_cache = "tests/golden/116/GRCh38-refseq/cache_root/homo_sapiens_refseq/116_GRCh38"
fasta = "tests/golden/116/GRCh38-refseq/reference.fa.gz"

[run]
flags = ["--refseq"]

[compare]
kind = "warnings"
pattern = "Transcript-assembly mismatch"
mask = ["^WARNING: \\d+ : "]

[expected]
ensembl_vep = ["<masked>WARNING: Transcript-assembly mismatch in rs922296917"]
vep_rs = ["WARNING: Transcript-assembly mismatch in rs922296917"]

[implementation]
code = [
    "crates/vep-cli/src/warnings.rs::Sink::write_to",
    "crates/vep-cli/src/warnings.rs::finished_text",
]
tests = [
    "crates/vep-cli/src/warnings.rs::tests::warning_prefix_follows_warning_msg",
    "crates/vep-cli/tests/assembly_mismatch_warning.rs::a_printed_marked_row_warns_once",
]
rules = ["tools/vep-formats-compare/src/warnings.rs::without_forked_child_prefix"]
