    "crates/vep-effects/src/frameshift_inside_a_held_stop_tests.rs::a_base_lost_inside_a_stop_the_peptide_holds_shifts_the_frame",
    "crates/vep-effects/src/frameshift_inside_a_held_stop_tests.rs::a_stop_the_new_frame_keeps_still_shifts_the_residues_after_it",
