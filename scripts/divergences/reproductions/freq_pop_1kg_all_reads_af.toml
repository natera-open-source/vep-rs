input_class = "observed"
input_class_basis = "2 · 418 of 35,796 table rows · 5 flag sets, 14 corpora"
notes = "The first mechanism of the entry: rs8131855's 1000 Genomes AF is 0.0986, above the 0.01 --filter_common sets, but under 1KG_ALL Ensembl VEP reads no frequency from a release-116 cache and keeps the record; vep-rs reads the AF column and drops the allele."

[input]
format = "vcf"
text = """
21	38441162	common_snv	A	G	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-freqfilter/json_cache"

[run]
flags = ["--check_existing", "--filter_common"]
format = "default"

[compare]
kind = "rows"
where = { record = "common_snv", feature = "ENST00000288319" }
columns = ["Location", "Allele", "Feature", "Consequence", "Existing_variation"]

[expected]
ensembl_vep = ["21:38441162 | G | ENST00000288319 | intron_variant | rs8131855"]
vep_rs = []

[implementation]
code = ["crates/vep-cli/src/frequency_filter.rs::FrequencyFilter::from_config"]
