entry = "frequency_filter_allele_key_order"
page = "docs/divergences/frequency-filter-zero.md#2-the-input-alleles-own-key-before-the-matched-alleles"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "unobserved"
input_class_basis = "well-formed under the VCF rule for a simple insertion, written with its padding base (VCF 4.2 specification, section 1.4.1 \"Fixed fields\", REF), and the documented values of --check_frequency and the --freq_* options (Ensembl VEP documentation, \"Running Ensembl VEP\"); not seen in the measured datasets"
notes = "The insertion is minimised to -/A and matches the known rs572248367 A/AA (gnomADe AA:4.959e-05); A is also that variant's reference allele, whose filled-in frequency near 1 Ensembl VEP reads first, so exclude drops the record in Ensembl VEP and keeps it in vep-rs."

[input]
format = "vcf"
text = """
21	33543210	ins_anchor	A	AA	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-recoder/json_cache"

[run]
flags = ["--check_frequency", "--freq_pop", "gnomADe", "--freq_freq", "0.01", "--freq_gt_lt", "gt", "--freq_filter", "exclude"]
format = "default"

[compare]
kind = "field"
field = "FREQS"
where = { record = "ins_anchor", feature = "ENST00000356577" }

[expected]
ensembl_vep = []
vep_rs = ["GNOMADE:A:4.959e-05"]
