  "printf '21\\t.\\tpromoter_window\\t42395390\\t42395410\\t.\\t+\\t.\\tID=PROM%%2c1%%3E;gene_id=ENSG%%3B1\\n' | bgzip > \"$STAGE/promoters.gff.gz\" && tabix -p gff \"$STAGE/promoters.gff.gz\"",
  "\"$VEP_CACHE_BUILDER\" --species homo_sapiens --assembly GRCh38 --release 116 --gff3 \"$STAGE/tmprss3_escaped_name.gff3\" --genome-fasta \"$CORPUS/reference.fa.gz\" --output-dir \"$STAGE/json_cache\"",
]

[input]
format = "vcf"
text = """
21	42395401	tmprss3_codon6	G	A	.	.	.
21	44107424	pwp2_codon3	T	C	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "{stage}/json_cache"
corpus = "tests/golden/116/GRCh38-gtf-builder"
gxf = "{stage}/tmprss3_escaped_name.gff3.gz"
gxf_kind = "gff"
fasta = "tests/golden/116/GRCh38-gtf-builder/reference.fa.gz"

[run]
flags = [
  "--symbol",
  "--custom", "file={stage}/promoters.gff.gz,format=gff,gff_type=gencode_promoter",
]
format = "tab"

[compare]
kind = "rows"
where = { record = ["tmprss3_codon6", "pwp2_codon3"] }
columns = ["Location", "Allele", "Gene", "SYMBOL", "GENCODE_PROMOTER_feature_id", "GENCODE_PROMOTER_associated_gene", "Consequence"]

[expected]
ensembl_vep = [
  "21:42395401 | A | ENSG00000160183 | A%2CB | PROM%2c1%3E | ENSG%3B1 | missense_variant",
  "21:44107424 | C | ENSG00000241945 | PWP2 | - | - | missense_variant",
]
vep_rs = [
  "21:42395401 | A | ENSG00000160183 | A,B | PROM,1> | ENSG;1 | missense_variant",
  "21:44107424 | C | ENSG00000241945 | PWP2 | - | - | missense_variant",
]
