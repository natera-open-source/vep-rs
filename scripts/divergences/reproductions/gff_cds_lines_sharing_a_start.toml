input_class = "unobserved"
input_class_basis = "well-formed under the GFF3 specification, \"The Canonical Gene\" (its example gives one mRNA two CDS features, cds00003 and cds00004, whose lines share a start); not seen in the measured datasets"
notes = "The GRCh38 release-116 GFF3 lines of PWP2 and ENST00000456705 with the transcript's first and last CDS lines each written twice at one start, the later line of each pair naming the protein ENSP00000411750 version 2 and the later of the last pair ending six bases before the earlier, beside the TMPRSS3 transcript ENST00001113783 as written, the control. Ensembl VEP keeps one CDS record per start, the later line of the file (BaseGXF.pm:511), so the translation takes the later first line's identifier and version (:723-734) and ends where the later last line ends (:749-756): `ENSP00000411750.2` on every row and `3_prime_UTR_variant` for the record inside the earlier last line alone. vep-rs reads every CDS line: the coding span is their union, the identifier and version come from the earlier line of the two sharing the lowest start on the forward strand (the later on the reverse), and the record is `missense_variant`; the control transcript's rows agree."
