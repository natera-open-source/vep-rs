[input]
format = "vcf"
text = """
21	42395401	tmprss3_codon6	G	A	.	.	.
21	44107424	pwp2_codon3	T	C	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "{stage}/json_cache"
corpus = "tests/golden/116/GRCh38-gtf-builder"
gxf = "{stage}/tmprss3_cds_no_protein_id.gff3.gz"
gxf_kind = "gff"
fasta = "tests/golden/116/GRCh38-gtf-builder/reference.fa.gz"

[run]
flags = ["--hgvs", "--protein", "--protein_version", "--symbol"]

[compare]
kind = "rows"
where = { record = ["tmprss3_codon6", "pwp2_codon3"] }
columns = ["Location", "Allele", "Feature", "Consequence", "ENSP", "HGVSp"]

[expected]
ensembl_vep = [
  "21:42395401 | A | ENST00001113783 | missense_variant | - | .1:p.Pro6Leu",
  "21:44107424 | C | ENST00000456705 | missense_variant | ENSP00000411749.1 | ENSP00000411749.1:p.Phe3Ser",
]
vep_rs = [
  "21:42395401 | A | ENST00001113783 | missense_variant | - | -",
  "21:44107424 | C | ENST00000456705 | missense_variant | ENSP00000411749.1 | ENSP00000411749.1:p.Phe3Ser",
]

[implementation]
code = [
    "crates/vep-cache-builder/src/builder.rs::build_transcript",
    "crates/vep-effects/src/hgvs.rs::hgvsp_at",
]
tests = ["crates/vep-cli/tests/consequence_documented_rows.rs::a_coding_transcript_without_a_protein_identifier_gets_no_hgvsp"]
