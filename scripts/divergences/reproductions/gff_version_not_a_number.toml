entry = "gff_version_not_a_number"
page = "docs/divergences/gff-version-not-a-number.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "unobserved"
input_class_basis = "well-formed under the GFF3 specification, \"Description of the Format\", column 9 (version is a lower-case attribute, which applications use freely; no clause fixes its form), and the GTF 2.2 specification, [attributes] (gene_id and transcript_id alone are mandatory; other attributes \"will be ignored\"); not seen in the measured datasets"
notes = "The GRCh38 release-116 GFF3 lines of TMPRSS3 and ENST00001113783 with `version=v2` on the gene line, the transcript line and the transcript's first CDS line in transcript order, beside the PWP2 transcript ENST00000456705 as written, the control. Ensembl VEP takes each attribute's text as the version (BaseGXF.pm:639 gene, BaseGXF.pm:481 transcript, BaseGXF.pm:727 translation) and prints it after the identifier: `ENSG00000160183.v2` in Gene under --gene_version (OutputFactory.pm:1478); `ENST00001113783.v2` in Feature under --transcript_version (OutputFactory.pm:1474) and in the HGVSc reference name (TranscriptVariationAllele.pm:1499); `ENSP00000783588.v2` in ENSP under --protein_version (OutputFactory.pm:1569) and in the HGVSp reference name (TranscriptVariationAllele.pm:1759). vep-rs holds a version as a number and refuses to build a cache from the file at its first `version=v2`, the gene line, with `ERROR: [cache-builder] Failed to parse GFF3: <file> line 2: version \"v2\" is not a whole number` (the prepare step asserts that line and that no cache directory exists), so its run has no cache to read, exits 1 and writes no rows. The same lines with `version=4294967296`, one above the cache's 32-bit limit, are the fourth file the prepare steps write: Ensembl VEP prints the digits in every version-bearing field, and the cache build ends at its gene line with `line 2: version 4294967296 is above 4294967295, the largest version the cache holds`, which the last prepare step asserts; the version 4294967295 itself builds and both engines print it."
prepare = [
  '''cat > "$STAGE/tmprss3_version_v2.gff3" <<'GFF'
##gff-version 3
21	ensembl_havana	gene	42371840	42396122	.	-	.	ID=gene:ENSG00000160183;Name=TMPRSS3;biotype=protein_coding;description=transmembrane serine protease 3 [Source:HGNC Symbol%3BAcc:HGNC:11877];gene_id=ENSG00000160183;logic_name=ensembl_havana_gene_homo_sapiens;version=v2
21	havana_tagene	mRNA	42393803	42396122	.	-	.	ID=transcript:ENST00001113783;Parent=gene:ENSG00000160183;Name=TMPRSS3-224;biotype=protein_coding;tag=gencode_basic;transcript_id=ENST00001113783;version=v2
21	havana_tagene	exon	42393803	42395084	.	-	.	Parent=transcript:ENST00001113783;Name=ENSE00004748399;constitutive=0;ensembl_end_phase=-1;ensembl_phase=1;exon_id=ENSE00004748399;rank=3;version=1
21	havana_tagene	CDS	42394915	42395084	.	-	2	ID=CDS:ENSP00000783588;Parent=transcript:ENST00001113783;protein_id=ENSP00000783588;version=1
21	havana_tagene	CDS	42395324	42395417	.	-	0	ID=CDS:ENSP00000783588;Parent=transcript:ENST00001113783;protein_id=ENSP00000783588;version=v2
21	havana_tagene	exon	42395324	42395468	.	-	.	Parent=transcript:ENST00001113783;Name=ENSE00003591562;constitutive=0;ensembl_end_phase=1;ensembl_phase=-1;exon_id=ENSE00003591562;rank=2;version=1
21	havana_tagene	exon	42395942	42396122	.	-	.	Parent=transcript:ENST00001113783;Name=ENSE00004778870;constitutive=0;ensembl_end_phase=-1;ensembl_phase=-1;exon_id=ENSE00004778870;rank=1;version=1
21	ensembl_havana	gene	44107306	44131181	.	+	.	ID=gene:ENSG00000241945;Name=PWP2;biotype=protein_coding;description=PWP2 small subunit processome component [Source:HGNC Symbol%3BAcc:HGNC:9711];gene_id=ENSG00000241945;logic_name=ensembl_havana_gene_homo_sapiens;version=10
21	havana	mRNA	44107373	44115744	.	+	.	ID=transcript:ENST00000456705;Parent=gene:ENSG00000241945;Name=PWP2-202;biotype=protein_coding;transcript_id=ENST00000456705;transcript_support_level=3;version=1
21	havana	exon	44107373	44107434	.	+	.	Parent=transcript:ENST00000456705;Name=ENSE00001605720;constitutive=0;ensembl_end_phase=0;ensembl_phase=-1;exon_id=ENSE00001605720;rank=1;version=1
21	havana	CDS	44107417	44107434	.	+	0	ID=CDS:ENSP00000411749;Parent=transcript:ENST00000456705;protein_id=ENSP00000411749;version=1
21	havana	exon	44108984	44109096	.	+	.	Parent=transcript:ENST00000456705;Name=ENSE00001177844;constitutive=0;ensembl_end_phase=2;ensembl_phase=0;exon_id=ENSE00001177844;rank=2;version=2
21	havana	CDS	44108984	44109096	.	+	0	ID=CDS:ENSP00000411749;Parent=transcript:ENST00000456705;protein_id=ENSP00000411749;version=1
21	havana	exon	44113753	44113847	.	+	.	Parent=transcript:ENST00000456705;Name=ENSE00001050676;constitutive=0;ensembl_end_phase=1;ensembl_phase=2;exon_id=ENSE00001050676;rank=3;version=1
21	havana	CDS	44113753	44113847	.	+	1	ID=CDS:ENSP00000411749;Parent=transcript:ENST00000456705;protein_id=ENSP00000411749;version=1
21	havana	exon	44114625	44114768	.	+	.	Parent=transcript:ENST00000456705;Name=ENSE00003646685;constitutive=0;ensembl_end_phase=1;ensembl_phase=1;exon_id=ENSE00003646685;rank=4;version=1
21	havana	CDS	44114625	44114768	.	+	2	ID=CDS:ENSP00000411749;Parent=transcript:ENST00000456705;protein_id=ENSP00000411749;version=1
21	havana	exon	44115264	44115399	.	+	.	Parent=transcript:ENST00000456705;Name=ENSE00003465236;constitutive=0;ensembl_end_phase=2;ensembl_phase=1;exon_id=ENSE00003465236;rank=5;version=1
21	havana	CDS	44115264	44115399	.	+	2	ID=CDS:ENSP00000411749;Parent=transcript:ENST00000456705;protein_id=ENSP00000411749;version=1
21	havana	exon	44115691	44115744	.	+	.	Parent=transcript:ENST00000456705;Name=ENSE00001738496;constitutive=0;ensembl_end_phase=2;ensembl_phase=2;exon_id=ENSE00001738496;rank=6;version=1
21	havana	CDS	44115691	44115744	.	+	1	ID=CDS:ENSP00000411749;Parent=transcript:ENST00000456705;protein_id=ENSP00000411749;version=1
GFF''',
  "bgzip -c \"$STAGE/tmprss3_version_v2.gff3\" > \"$STAGE/tmprss3_version_v2.gff3.gz\" && tabix -p gff \"$STAGE/tmprss3_version_v2.gff3.gz\"",
  '''if "$VEP_CACHE_BUILDER" --species homo_sapiens --assembly GRCh38 --release 116 --gff3 "$STAGE/tmprss3_version_v2.gff3" --genome-fasta "$CORPUS/reference.fa.gz" --output-dir "$STAGE/json_cache" 2> "$STAGE/build.err"; then echo "the cache builder accepted the file" >&2; exit 1; fi; grep -F 'tmprss3_version_v2.gff3 line 2: version "v2" is not a whole number' "$STAGE/build.err" || { cat "$STAGE/build.err" >&2; exit 1; }; test ! -e "$STAGE/json_cache"''',
  "sed 's/;version=v2$/;version=4294967296/' \"$STAGE/tmprss3_version_v2.gff3\" > \"$STAGE/tmprss3_version_above_limit.gff3\" && [ \"$(grep -c 'version=4294967296$' \"$STAGE/tmprss3_version_above_limit.gff3\")\" = 3 ]",
  '''if "$VEP_CACHE_BUILDER" --species homo_sapiens --assembly GRCh38 --release 116 --gff3 "$STAGE/tmprss3_version_above_limit.gff3" --genome-fasta "$CORPUS/reference.fa.gz" --output-dir "$STAGE/json_cache_above_limit" 2> "$STAGE/above_limit.err"; then echo "the cache builder accepted a version above 4294967295" >&2; exit 1; fi; grep -F 'tmprss3_version_above_limit.gff3 line 2: version 4294967296 is above 4294967295, the largest version the cache holds' "$STAGE/above_limit.err" || { cat "$STAGE/above_limit.err" >&2; exit 1; }; test ! -e "$STAGE/json_cache_above_limit"''',
]

[input]
format = "vcf"
text = """
21	42395401	tmprss3_codon6	G	A	.	.	.
21	44107424	pwp2_codon3	T	C	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "{stage}/json_cache"
corpus = "tests/golden/116/GRCh38-gtf-builder"
gxf = "{stage}/tmprss3_version_v2.gff3.gz"
gxf_kind = "gff"
fasta = "tests/golden/116/GRCh38-gtf-builder/reference.fa.gz"

[run]
flags = ["--hgvs", "--protein", "--protein_version", "--symbol", "--transcript_version", "--gene_version"]

[compare]
kind = "rows"
where = { record = ["tmprss3_codon6", "pwp2_codon3"] }
columns = ["Location", "Allele", "Gene", "Feature", "Consequence", "ENSP", "HGVSc", "HGVSp"]

[expected]
ensembl_vep = [
  "21:42395401 | A | ENSG00000160183.v2 | ENST00001113783.v2 | missense_variant | ENSP00000783588.v2 | ENST00001113783.v2:c.17C>T | ENSP00000783588.v2:p.Pro6Leu",
  "21:44107424 | C | ENSG00000241945.10 | ENST00000456705.1 | missense_variant | ENSP00000411749.1 | ENST00000456705.1:c.8T>C | ENSP00000411749.1:p.Phe3Ser",
]
vep_rs = []
vep_rs_exit = 1

[implementation]
code = [
    "crates/vep-cache-builder/src/gff3.rs::parse_version",
    "crates/vep-cache-builder/src/gff3.rs::version_number",
]
tests = [
    "crates/vep-cache-builder/src/gff3.rs::tests::a_version_above_the_cache_limit_fails_the_parse",
    "crates/vep-cache-builder/src/gff3.rs::tests::a_version_that_is_not_a_whole_number_fails_the_parse",
    "crates/vep-cache-builder/src/gtf.rs::tests::a_version_that_is_not_a_whole_number_fails_the_parse",
    "crates/vep-cache-builder/tests/custom_transcript_source.rs::a_version_that_is_not_a_whole_number_is_refused_and_writes_nothing",
]
