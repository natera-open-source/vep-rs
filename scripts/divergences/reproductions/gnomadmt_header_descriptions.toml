entry = "gnomadmt_header_descriptions"
page = "docs/plugins/annotation-store-divergences.md#6-gnomadmt-the-info-descriptions-of-the-files-fields"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "observed"
input_class_basis = "2 · 5 of 62 table rows · 5 flag sets, 1 corpus"

[input]
format = "vcf"
text = """
MT	3	.	T	C	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-gnomadmt/json_cache"

[run]
flags = ["--plugin", "gnomADMt,file={corpus}/data/gnomad.v3.1.chrM.slice.vcf.bgz,fields=all"]

# The five field descriptions that hold a comparison sign; the data rows agree.
[compare]
kind = "header"
pattern = "^## gnomAD_(AC_het|AC_hom|AF_het|AF_hom|common_low_heteroplasmy) :"

[expected]
ensembl_vep = [
  "## gnomAD_AC_het : Allele count restricted to variants with a heteroplasmy level",
  "## gnomAD_AC_hom : Allele count restricted to variants with a heteroplasmy level",
  "## gnomAD_AF_het : Allele frequency restricted to variants with a heteroplasmy level",
  "## gnomAD_AF_hom : Allele frequency restricted to variants with a heteroplasmy level",
  "## gnomAD_common_low_heteroplasmy : Present if variant is found at an overall frequency of .001 across all samples with a heteroplasmy level  0 and  0.50 (includes variants 0.01 heteroplasmy which are subsequently filtered)",
]
vep_rs = [
  "## gnomAD_AC_het : Allele count restricted to variants with a heteroplasmy level >= 0.10 and < 0.95",
  "## gnomAD_AC_hom : Allele count restricted to variants with a heteroplasmy level >= 0.95",
  "## gnomAD_AF_het : Allele frequency restricted to variants with a heteroplasmy level >= 0.10 and < 0.95",
  "## gnomAD_AF_hom : Allele frequency restricted to variants with a heteroplasmy level >= 0.95",
  "## gnomAD_common_low_heteroplasmy : Present if variant is found at an overall frequency of .001 across all samples with a heteroplasmy level > 0 and < 0.50 (includes variants <0.01 heteroplasmy which are subsequently filtered)",
]
