entry = "gnomadmt_info_value_second_equals"
page = "docs/plugins/annotation-store.md#11-gnomadmt-an-info-value-that-holds--is-cut-at-that-sign"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 47 of 373 table rows · 5 flag sets, 1 corpus"

[input]
format = "vcf"
text = """
MT	3441	nd1_3441_A_G	A	G	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-gnomadmt/json_cache"

[run]
flags = ["--plugin", "gnomADMt,file={corpus}/data/gnomad.v3.1.chrM.slice.vcf.bgz,fields=vep"]

# The file's `vep` value holds `=` inside `p.Leu45=`; Ensembl VEP's value stops before that sign.
[compare]
kind = "field"
field = "gnomAD_vep"
where = { record = "nd1_3441_A_G", feature = "ENST00000361390" }

[expected]
ensembl_vep = ["G|synonymous_variant|LOW|MT-ND1|ENSG00000198888|Transcript|ENST00000361390|protein_coding|1/1||ENST00000361390.2:c.135A>G|ENSP00000354687.2:p.Leu45"]
vep_rs = ["G|synonymous_variant|LOW|MT-ND1|ENSG00000198888|Transcript|ENST00000361390|protein_coding|1/1||ENST00000361390.2:c.135A>G|ENSP00000354687.2:p.Leu45=|135|135|45|L|ctA/ctG|1||1|SNV||HGNC|HGNC:7455|YES||P1||ENSP00000354687||||1|||ENSP_mappings:5xtc&ENSP_mappings:5xtd&HAMAP:MF_01350&PANTHER:PTHR11432&PANTHER:PTHR11432&PROSITE_patterns:PS00667&Pfam:PF00146|||||||||"]

[implementation]
code = ["crates/vep-builtins/src/plugins/gnomadmt.rs::split_info_pair"]
tests = [
    "crates/vep-cli/tests/plugin_documented_rows.rs::a_gnomadmt_info_value_holding_an_equals_sign_is_written_whole",
]
