[input]
format = "vcf"
text = """
21	42395401	tmprss3_codon6	G	A	.	.	.
21	44107424	pwp2_codon3	T	C	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "{stage}/json_cache"
corpus = "tests/golden/116/GRCh38-gtf-builder"
gxf = "{stage}/tmprss3_repeated_gene_name.gtf.gz"
gxf_kind = "gtf"
fasta = "tests/golden/116/GRCh38-gtf-builder/reference.fa.gz"

[run]
flags = ["--symbol"]

[compare]
kind = "rows"
where = { record = ["tmprss3_codon6", "pwp2_codon3"] }
columns = ["Location", "Allele", "Gene", "Feature", "Consequence", "SYMBOL"]

[expected]
ensembl_vep = [
  "21:42395401 | A | ENSG00000160183 | ENST00001113783 | missense_variant | TMPRSS3,OTHER",
  "21:44107424 | C | ENSG00000241945 | ENST00000456705 | missense_variant | PWP2",
]
vep_rs = []
vep_rs_exit = 1
