entry = "gvcf_variant_site_dropped"
page = "docs/divergences/defect-h.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "unobserved"
input_class_basis = "well-formed under the VCF 4.5 specification, section 5.5 \"Representing unspecified alleles and REF-only blocks (gVCF)\" (a sequence allele beside <NON_REF>, which the section treats as an alias of the unspecified allele); not seen in the measured datasets"
notes = "The <NON_REF> token sends the line to Ensembl VEP's structural path, where the type G/<NON_REF> has no Sequence Ontology term and the whole site is skipped with its real allele; vep-rs drops the token and annotates the G allele."

[input]
format = "vcf"
text = """
21	30425650	gvcf_a_g	A	G,<NON_REF>	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-release116/json_cache"

[run]
flags = []

[compare]
kind = "rows"
where = { record = "gvcf_a_g" }
columns = ["Location", "Allele", "Feature", "Consequence"]

[expected]
ensembl_vep = []
vep_rs = [
  "21:30425650 | G | ENST00000334068 | upstream_gene_variant",
  "21:30425650 | G | ENST00000390690 | missense_variant",
]
