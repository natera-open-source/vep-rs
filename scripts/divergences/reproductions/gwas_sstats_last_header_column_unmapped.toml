entry = "gwas_sstats_last_header_column_unmapped"
page = "docs/plugins/flat-file.md#4-gwas-the-last-column-of-a-summary-statistics-header-is-never-read"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "unobserved"
input_class_basis = "well-formed under the GWAS plugin's header, which says the plugin can process the harmonised version of the summary statistics file and fixes no order for its columns; not seen in the measured datasets"
# A nine-column harmonised file ending in `p_value`, with the committed file's row for rs4817614, under the committed file's name.
# Ensembl VEP's plugin writes its filtered and sorted copies beside the file and its processed copy under --dir, so both lie in the stage.
prepare = [
  'mkdir -p "$STAGE/vepdir"',
  'printf "hm_variant_id\thm_rsid\thm_chrom\thm_pos\thm_other_allele\thm_effect_allele\thm_beta\thm_odds_ratio\tp_value\n21_34036428_A_G\trs4817614\t21\t34036428\tA\tG\tNA\tNA\t0.1965\n" > "$STAGE/17463246-GCST000028-EFO_0001360.h.tsv"',
]

[input]
format = "vcf"
text = """
21	34036428	rs4817614	A	G	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-gwas/json_cache"

[run]
flags = ["--dir", "{stage}/vepdir", "--plugin", "GWAS,type=sstate,file={stage}/17463246-GCST000028-EFO_0001360.h.tsv"]

[compare]
kind = "rows"
where = { record = "rs4817614", feature = "ENST00000813277" }
columns = ["Location", "Allele", "Feature", "GWAS_p_value", "GWAS_risk_allele", "GWAS_study"]

[expected]
ensembl_vep = ["21:34036428 | G | ENST00000813277 |  | G | GCST000028"]
vep_rs = ["21:34036428 | G | ENST00000813277 | 0.1965 | G | GCST000028"]
