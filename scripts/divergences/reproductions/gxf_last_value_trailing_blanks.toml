[input]
format = "vcf"
text = """
21	42395401	tmprss3_codon6	G	A	.	.	.
21	44107424	pwp2_codon3	T	C	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "{stage}/json_cache"
corpus = "tests/golden/116/GRCh38-gtf-builder"
gxf = "{stage}/tmprss3_last_value_blanks.gtf.gz"
gxf_kind = "gtf"
fasta = "tests/golden/116/GRCh38-gtf-builder/reference.fa.gz"

[run]
flags = ["--symbol"]

[compare]
kind = "vcf"
field = "SYMBOL"
where = { record = ["tmprss3_codon6", "pwp2_codon3"] }

[expected]
ensembl_vep = ["TMPRSS3%20%20%20", "PWP2"]
vep_rs = ["TMPRSS3", "PWP2"]

[implementation]
code = ["crates/vep-cache-builder/src/line.rs::record_columns"]
tests = [
    "crates/vep-cache-builder/src/gtf.rs::tests::gtf_attributes_are_read_as_the_gtf_parser_reads_them",
    "crates/vep-cache-builder/src/line.rs::tests::a_reader_takes_the_columns_of_a_line_the_index_build_gives_four",
    "crates/vep-cli/tests/documented_subsets.rs::gtf_repeated_attribute_key_divergence_is_documented",
]
