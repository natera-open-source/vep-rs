  '''test -n "$IMAGE" || { echo 'this reproduction runs Ensembl VEP of the image over three files whose CDS line leaves its exon, so it needs --image' >&2; exit 1; }
  printf '##fileformat=VCFv4.2\n#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\n21\t42395401\ttmprss3_codon6\tG\tA\t.\t.\t.\n21\t44107424\tpwp2_codon3\tT\tC\t.\t.\t.\n' > records.vcf
  awk -F'\t' -v OFS='\t' 'NR==12 {$4="44107360"} {print}' released.gff3 > cds_starts_before_its_exon.gff3
  awk -F'\t' -v OFS='\t' 'NR==6 {$5="42395500"} {print}' released.gff3 > cds_ends_past_its_exon.gff3
  awk -F'\t' -v OFS='\t' 'NR==6 {$4="42395500"; $5="42395900"} {print}' released.gff3 > cds_in_no_exon.gff3
  shapes='cds_starts_before_its_exon cds_ends_past_its_exon cds_in_no_exon'
  for f in $shapes; do grep -v '^#' "$f.gff3" | LC_ALL=C sort -k1,1 -k4,4n -k5,5n | bgzip > "$f.gff3.gz"; done
  docker run --rm --user "$(id -u):$(id -g)" -v "$STAGE:/stage" -w /stage "$IMAGE" sh -c 'for f in cds_starts_before_its_exon cds_ends_past_its_exon cds_in_no_exon; do tabix -p gff "$f.gff3.gz" 2> "$f.gff3.gz.tabix.err"; echo $? > "$f.gff3.gz.tabix.exit"; done'
  for f in $shapes; do
    [ "$(cat "$f.gff3.gz.tabix.exit")" = 0 ] && test ! -s "$f.gff3.gz.tabix.err" || { echo "$f.gff3.gz: the index build of the image did not exit 0 in silence" >&2; exit 1; }
  done
  ensembl() { docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$STAGE:/stage" -v "$CORPUS:/corpus:ro" -w /stage "$IMAGE" vep -i records.vcf -o "$1_ensembl.txt" --gff "$1.gff3.gz" --fasta /corpus/reference.fa.gz --species homo_sapiens --assembly GRCh38 --format vcf --force_overwrite --no_stats --quiet --fork 1 --symbol --hgvs > "$1_ensembl.out" 2> "$1_ensembl.err" || { cat "$1_ensembl.err" >&2; exit 1; }; }
  row() { awk -F'\t' -v id="$2" -v term="$3" -v hgvs="$4" '$1==id && $7==term && index($14, hgvs) {found=1} END {exit !found}' "$1_ensembl.txt" || { echo "$1_ensembl.txt lacks the $3 row of $2 with $4" >&2; exit 1; }; }
  for f in $shapes; do ensembl "$f"; done
  row cds_starts_before_its_exon pwp2_codon3 5_prime_UTR_variant 'HGVSc=ENST00000456705.1:c.-11T>C'
  row cds_starts_before_its_exon tmprss3_codon6 missense_variant 'HGVSc=ENST00001113783.1:c.17C>T'
  row cds_ends_past_its_exon tmprss3_codon6 missense_variant 'HGVSc=ENST00001113783.1:c.100C>T'
  row cds_ends_past_its_exon pwp2_codon3 missense_variant 'HGVSc=ENST00000456705.1:c.8T>C'
  row cds_in_no_exon tmprss3_codon6 5_prime_UTR_variant 'HGVSc=ENST00001113783.1:c.-78C>T'
  row cds_in_no_exon pwp2_codon3 missense_variant 'HGVSc=ENST00000456705.1:c.8T>C'
  refused() {
    if "$VEP_CACHE_BUILDER" --species homo_sapiens --assembly GRCh38 --release 116 --gff3 "$1.gff3" --genome-fasta "$CORPUS/reference.fa.gz" --output-dir "$STAGE/cache_$1" 2> "$1.build.err"; then echo "the cache builder accepted $1.gff3" >&2; exit 1; fi
    grep -F "$1.gff3 $2" "$1.build.err" > /dev/null || { cat "$1.build.err" >&2; exit 1; }
