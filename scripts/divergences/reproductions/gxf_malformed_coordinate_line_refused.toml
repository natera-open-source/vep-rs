  '''test -n "$IMAGE" || { echo 'this reproduction runs Ensembl VEP of the image over three more files, so it needs --image' >&2; exit 1; }
  printf '##fileformat=VCFv4.2\n#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\n21\t42395401\ttmprss3_codon6\tG\tA\t.\t.\t.\n21\t44107424\tpwp2_codon3\tT\tC\t.\t.\t.\n' > records.vcf
  ensembl() { docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$STAGE:/stage" -v "$CORPUS:/corpus:ro" -w /stage "$IMAGE" vep -i "$1" -o "$2" --fasta /corpus/reference.fa.gz --species homo_sapiens --assembly GRCh38 --format vcf --force_overwrite --no_stats --quiet --fork 1 "${@:3}" > "$2.out" 2> "$2.err" || { cat "$2.err" >&2; exit 1; }; }
  row() { awk -F'\t' -v id="$2" -v term="$3" -v hgvs="$4" '$1==id && $7==term && index($14, hgvs) {found=1} END {exit !found}' "$1" || { echo "$1 lacks the $3 row of $2 with $4" >&2; exit 1; }; }
  ensembl records.vcf octal_ensembl.txt --gff cds_end_zero_padded.gff3.gz --symbol --hgvs
  row octal_ensembl.txt tmprss3_codon6 5_prime_UTR_variant 'HGVSc=ENST00001113783.1:c.-78C>T'
  row octal_ensembl.txt pwp2_codon3 missense_variant 'HGVSc=ENST00000456705.1:c.8T>C'
  "$VEP_CACHE_BUILDER" --species homo_sapiens --assembly GRCh38 --release 116 --gff3 cds_end_zero_padded.gff3 --genome-fasta "$CORPUS/reference.fa.gz" --output-dir "$STAGE/cache_cds_end_zero_padded" 2> cds_end_zero_padded.build.err || { cat cds_end_zero_padded.build.err >&2; exit 1; }
  "$VEP" -i records.vcf -o octal_vep_rs.txt --offline --json_cache "$STAGE/cache_cds_end_zero_padded" --species homo_sapiens --assembly GRCh38 --format vcf --force_overwrite --no_stats --quiet --fasta "$CORPUS/reference.fa.gz" --symbol --hgvs 2> octal_vep_rs.err || { cat octal_vep_rs.err >&2; exit 1; }
  row octal_vep_rs.txt tmprss3_codon6 missense_variant 'HGVSc=ENST00001113783.1:c.17C>T'
  row octal_vep_rs.txt pwp2_codon3 missense_variant 'HGVSc=ENST00000456705.1:c.8T>C'
  ensembl reg_probe.vcf reg_skipped_ensembl.txt --gff released.gff3.gz --regulatory_gff file=reg_exon_end_not_a_number.gff3.gz
  [ "$(awk -F'\t' '$6=="RegulatoryFeature" {print $1}' reg_skipped_ensembl.txt | tr '\n' ' ')" = 'in_first ' ] || { echo 'Ensembl VEP kept a regulatory row past the exon line' >&2; exit 1; }
