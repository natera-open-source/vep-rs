entry = "gxf_malformed_coordinate_line_refused"
page = "docs/divergences/gxf-malformed-coordinate-line-refused.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "unobserved"
input_class_basis = "well-formed under the GFF3 and GTF 2.2 specifications in the shapes their text does not exclude: a zero-padded coordinate, each text saying integer and no more (GFF3, columns 4 and 5, \"positive 1-based integer coordinates\"; GTF 2.2, <start> <end>, \"Integer start and end coordinates\"); a blank before the digits of a GFF3 start or end, GFF3 saying \"unescaped spaces are allowed within fields\"; a GTF start of 0 or below, GTF 2.2 numbering a sequence from 1 but calling values outside the reference sequence \"technically acceptable, but they are discouraged\"; a CDS line that sets the translation's start or end in no exon, an exon nested in another and a GFF3 exon rank set against position, neither text holding a CDS or exon line to the span or the order of another exon line and GFF3 saying it \"does not enforce a rule in which features must be wholly contained within the location of their parents\"; a blank line (GFF3, \"Blank lines should be ignored by parsers\"; GTF 2.2 names none); a GFF3 sequence section, a last line that begins with > with no sequence behind it among them (GFF3, \"##FASTA\" and \"a GFF line that begins with the character > creates an implied ##FASTA directive\", a file Ensembl VEP's documentation \"does not support\"); a byte-order mark before a file's first line, of which the texts say nothing; in a GTF a seqname that begins with > and a line led by spaces, GTF 2.2 naming no character a seqname may not hold and speaking of white space only between fields; not seen in the measured datasets; classed by those shapes: a start or end that is not a plain whole number (text, 0x, an exponent or a fraction in it) breaks the integer clauses, a GFF3 start or end of 0 or below \"positive 1-based integer coordinates\", an end below its start \"Start is always less than or equal to end\" (GFF3) and \"<start> must be less than or equal to <end>\" (GTF 2.2), and a line short of its columns, a line led by a tab, a GFF3 line led by spaces, a GFF3 seqid that begins with > and annotation after a sequence section the nine columns, the seqid rule and \"no other content beyond valid FASTA sequence is allowed\" (GFF3) and, with a blank before the digits of a GTF start or end, the field list and \"a single TAB and no white space\" (GTF 2.2)"
notes = "The GRCh38 release-116 GFF3 lines of TMPRSS3 and ENST00001113783 with the start of the transcript's first CDS line in transcript order rewritten `abc`, beside the PWP2 transcript ENST00000456705 as released, the control. Ensembl VEP's --gff source reads the records tabix returns (BaseGXF.pm:211, 222-237), and the tabix the release ships (htslib 1.9) indexes the file past the line it cannot parse, printing `Failed to parse TBX_GENERIC` and exiting 0, since the line is the file's first once sorted: the source never meets the CDS line and _add_translation (BaseGXF.pm:719) starts the translation at the next one, so tmprss3_codon6 is a 5_prime_UTR_variant, c.-78C>T. vep-rs reads the file itself and refuses the build at the line, `line 6: GFF3 start \"abc\" is not a number`, so its run has no cache, exits 1 and writes no rows. The prepare steps index every file with the tabix of the image the run names (`$IMAGE`), the route of record, and hold each index build to its outcome: exit 0 with the message, exit 0 in silence, and, for a start no number leads on the later sequence of a two-sequence file, exit 1 with `Unsorted positions` and no index, where the same line as the first of a two-sequence file exits 0 and leaves an index of 67,668,768 sequences. They assert the builder's refusals of the kept-line shapes and of a start or end no number leads and an end below zero on a five_prime_UTR line, on one sequence and on either of two, and of a start no number leads on a line of eight columns, its builds past a zero start, an end below its start and an empty start before a numeric end on that line (matched), its refusal of a --custom GFF source whose index tabix 1.9 built past a start it could not parse, and the promoter window whose start a minus sign leads, which vep-rs lists as `21:-5-42395410`. The regulatory step asserts the --regulatory_gff reader's refusal of the four shapes on a four-record file (the record named, or the oversized index), the bake's refusals of the same files and of an `exon` line whose end no number leads, and the run-time reader's refusal of that line. A further step moves a CDS line off its exon three ways, each putting the translation's start in no exon: the PWP2 transcript's first CDS line starting 13 bases before its exon, the TMPRSS3 transcript's first CDS line in transcript order ending 32 bases past its exon, and that line placed in the intron, in no exon. It holds each index build to exit 0 in silence and asserts Ensembl VEP's rows: the source attaches a CDS record to the exon holding its start (BaseGXF.pm:544) and takes the translation's ends from the first and last attached records (BaseGXF.pm:740-756), so pwp2_codon3 is a 5_prime_UTR_variant, c.-11T>C, on the first file, tmprss3_codon6 is c.100C>T on the second, where the released lines give c.17C>T, and a 5_prime_UTR_variant, c.-78C>T, on the third. It asserts the builder's refusal of each file at the line, naming the transcript, the CDS line's span and the base at which the translation starts, in no exon. The last step runs Ensembl VEP of the image three times more: over the released lines with the first CDS line's end zero-padded, which the index reader takes as octal and no query returns, so tmprss3_codon6 is a 5_prime_UTR_variant where vep-rs, reading decimal, writes missense_variant, c.17C>T; over the regulatory file with the `exon` line, where it keeps the regulatory row of in_first alone; and over the promoter file whose first window starts at `-5`, which it lists as `21:-5-42395410` too."
prepare = [
  '''cat > "$STAGE/released.gff3" <<'GFF'
##gff-version 3
21	ensembl_havana	gene	42371840	42396122	.	-	.	ID=gene:ENSG00000160183;Name=TMPRSS3;biotype=protein_coding;description=transmembrane serine protease 3 [Source:HGNC Symbol%3BAcc:HGNC:11877];gene_id=ENSG00000160183;logic_name=ensembl_havana_gene_homo_sapiens;version=19
21	havana_tagene	mRNA	42393803	42396122	.	-	.	ID=transcript:ENST00001113783;Parent=gene:ENSG00000160183;Name=TMPRSS3-224;biotype=protein_coding;tag=gencode_basic;transcript_id=ENST00001113783;version=1
21	havana_tagene	exon	42393803	42395084	.	-	.	Parent=transcript:ENST00001113783;Name=ENSE00004748399;constitutive=0;ensembl_end_phase=-1;ensembl_phase=1;exon_id=ENSE00004748399;rank=3;version=1
21	havana_tagene	CDS	42394915	42395084	.	-	2	ID=CDS:ENSP00000783588;Parent=transcript:ENST00001113783;protein_id=ENSP00000783588;version=1
21	havana_tagene	CDS	42395324	42395417	.	-	0	ID=CDS:ENSP00000783588;Parent=transcript:ENST00001113783;protein_id=ENSP00000783588;version=1
21	havana_tagene	exon	42395324	42395468	.	-	.	Parent=transcript:ENST00001113783;Name=ENSE00003591562;constitutive=0;ensembl_end_phase=1;ensembl_phase=-1;exon_id=ENSE00003591562;rank=2;version=1
21	havana_tagene	exon	42395942	42396122	.	-	.	Parent=transcript:ENST00001113783;Name=ENSE00004778870;constitutive=0;ensembl_end_phase=-1;ensembl_phase=-1;exon_id=ENSE00004778870;rank=1;version=1
21	ensembl_havana	gene	44107306	44131181	.	+	.	ID=gene:ENSG00000241945;Name=PWP2;biotype=protein_coding;description=PWP2 small subunit processome component [Source:HGNC Symbol%3BAcc:HGNC:9711];gene_id=ENSG00000241945;logic_name=ensembl_havana_gene_homo_sapiens;version=10
21	havana	mRNA	44107373	44115744	.	+	.	ID=transcript:ENST00000456705;Parent=gene:ENSG00000241945;Name=PWP2-202;biotype=protein_coding;transcript_id=ENST00000456705;transcript_support_level=3;version=1
21	havana	exon	44107373	44107434	.	+	.	Parent=transcript:ENST00000456705;Name=ENSE00001605720;constitutive=0;ensembl_end_phase=0;ensembl_phase=-1;exon_id=ENSE00001605720;rank=1;version=1
21	havana	CDS	44107417	44107434	.	+	0	ID=CDS:ENSP00000411749;Parent=transcript:ENST00000456705;protein_id=ENSP00000411749;version=1
21	havana	exon	44108984	44109096	.	+	.	Parent=transcript:ENST00000456705;Name=ENSE00001177844;constitutive=0;ensembl_end_phase=2;ensembl_phase=0;exon_id=ENSE00001177844;rank=2;version=2
21	havana	CDS	44108984	44109096	.	+	0	ID=CDS:ENSP00000411749;Parent=transcript:ENST00000456705;protein_id=ENSP00000411749;version=1
21	havana	exon	44113753	44113847	.	+	.	Parent=transcript:ENST00000456705;Name=ENSE00001050676;constitutive=0;ensembl_end_phase=1;ensembl_phase=2;exon_id=ENSE00001050676;rank=3;version=1
21	havana	CDS	44113753	44113847	.	+	1	ID=CDS:ENSP00000411749;Parent=transcript:ENST00000456705;protein_id=ENSP00000411749;version=1
21	havana	exon	44114625	44114768	.	+	.	Parent=transcript:ENST00000456705;Name=ENSE00003646685;constitutive=0;ensembl_end_phase=1;ensembl_phase=1;exon_id=ENSE00003646685;rank=4;version=1
21	havana	CDS	44114625	44114768	.	+	2	ID=CDS:ENSP00000411749;Parent=transcript:ENST00000456705;protein_id=ENSP00000411749;version=1
21	havana	exon	44115264	44115399	.	+	.	Parent=transcript:ENST00000456705;Name=ENSE00003465236;constitutive=0;ensembl_end_phase=2;ensembl_phase=1;exon_id=ENSE00003465236;rank=5;version=1
21	havana	CDS	44115264	44115399	.	+	2	ID=CDS:ENSP00000411749;Parent=transcript:ENST00000456705;protein_id=ENSP00000411749;version=1
21	havana	exon	44115691	44115744	.	+	.	Parent=transcript:ENST00000456705;Name=ENSE00001738496;constitutive=0;ensembl_end_phase=2;ensembl_phase=2;exon_id=ENSE00001738496;rank=6;version=1
21	havana	CDS	44115691	44115744	.	+	1	ID=CDS:ENSP00000411749;Parent=transcript:ENST00000456705;protein_id=ENSP00000411749;version=1
GFF''',
  '''utr() { awk -F'\t' -v OFS='\t' -v start="$1" -v end="$2" '{print} NR==7 {print "21","havana_tagene","five_prime_UTR",start,end,".","-",".","Parent=transcript:ENST00001113783"}' released.gff3; }
  other() { awk -F'\t' -v OFS='\t' -v seq="$1" 'NR>=9 {$1=seq; gsub(/ENSG00000241945/,"ENSG10000241945"); gsub(/ENST00000456705/,"ENST10000456705"); gsub(/ENSP00000411749/,"ENSP10000411749"); print}' released.gff3; }
  awk -F'\t' -v OFS='\t' 'NR==6 {$4="abc"} {print}' released.gff3 > cds_start_not_a_number.gff3
  awk -F'\t' -v OFS='\t' 'NR==6 {$4="42395417"; $5="42395324"} {print}' released.gff3 > cds_end_below_start.gff3
  awk -F'\t' -v OFS='\t' 'NR==6 {$4="0"} {print}' released.gff3 > cds_start_zero.gff3
  awk -F'\t' -v OFS='\t' 'NR==6 {$5="0042395417"} {print}' released.gff3 > cds_end_zero_padded.gff3
  awk -F'\t' -v OFS='\t' 'NR==8 {$5="xyz"} {print}' released.gff3 > exon_end_not_a_number.gff3
  utr 42395942 xyz > utr_end_not_a_number.gff3
  utr abc 42396122 > utr_start_not_a_number.gff3
  utr 42395942 -9 > utr_end_below_zero.gff3
  utr 0 42396122 > utr_start_zero.gff3
  utr 42396122 42395942 > utr_end_below_start.gff3
  utr '' 100 > utr_start_empty.gff3
  awk -F'\t' -v OFS='\t' '{print} NR==7 {print "21","havana_tagene","five_prime_UTR","abc","42396122",".","-","."}' released.gff3 > short_start_not_a_number.gff3
  { head -n 1 released.gff3; tail -n +2 utr_start_not_a_number.gff3; other 22; } > utr_start_first_of_two.gff3
  { head -n 1 released.gff3; other 20; tail -n +2 utr_start_not_a_number.gff3; } > utr_start_later_of_two.gff3
  { head -n 1 released.gff3; other 20; tail -n +2 cds_start_not_a_number.gff3; } > cds_start_later_of_two.gff3
  printf '21\t.\tpromoter_window\t42395390\t42395410\t.\t+\t.\tID=PW1;gene_id=ENSG00000160183\n21\t.\tpromoter_window\tabc\t44107430\t.\t+\t.\tID=PWBAD\n21\t.\tpromoter_window\t44107420\t44107430\t.\t+\t.\tID=PW2\n' > promoters.gff
  printf '21\t.\tpromoter_window\t-5\t42395410\t.\t+\t.\tID=PW1;gene_id=ENSG00000160183\n21\t.\tpromoter_window\t44107420\t44107430\t.\t+\t.\tID=PW2\n' > promoters_minus.gff
  printf '21\tEnsembl\tenhancer\t5011320\t5011550\t.\t.\t.\tID=ENSR21_85ZF5;color=#faca00\n21\tEnsembl\tenhancer\t5013566\t5014200\t.\t.\t.\tID=ENSR21_BZTD;color=#faca00\n21\tEnsembl\tCTCF_binding_site\t5014322\t5014343\t.\t-\t.\tID=ENSR21_536SRH;color=#40e0d0\n21\tEnsembl\tenhancer\t5015556\t5015987\t.\t.\t.\tID=ENSR21_93ZQB;color=#faca00\n' > reg_released.gff3
  sed 's/\t5013566\t5014200\t/\t5013566\txyz\t/' reg_released.gff3 > reg_end_not_a_number.gff3
  sed 's/\t5013566\t5014200\t/\tabc\t5014200\t/' reg_released.gff3 > reg_start_not_a_number.gff3
  sed 's/\t5013566\t5014200\t/\t0\t5014200\t/' reg_released.gff3 > reg_start_zero.gff3
  sed 's/\t5013566\t5014200\t/\t5014200\t5013566\t/' reg_released.gff3 > reg_end_below_start.gff3
  awk -F'\t' -v OFS='\t' '{print} NR==1 {print "21","Ensembl","exon","5012000","xyz",".",".",".","ID=SKIPPED"}' reg_released.gff3 > reg_exon_end_not_a_number.gff3
  first_base() { printf '21\tEnsembl\tenhancer\t1\t100\t.\t.\t.\tID=ENSR21_FIRST_BASE;color=#faca00\n'; }
  { first_base; sed '1s/^/\t/' reg_released.gff3; } > reg_tab_led.gff3
  { first_base; sed '1s/\tEnsembl\t/\tEnsembl\x00\t/' reg_released.gff3; } > reg_source_nul_ended.gff3
  { first_base; sed '1s/^21\tEnsembl\t/21\x00\x00\x00\t5011400\t/' reg_released.gff3; } > reg_name_nul_ended.gff3
  sed 's/\t5013566\t5014200\t/\t5013566\x00\t5014200\t/' reg_released.gff3 > reg_start_nul_ended.gff3
  [ "$(head -c 1 reg_tab_led.gff3 | od -A n -t x1 | tr -d ' ')" = 32 ] && [ "$(sed -n 2p reg_tab_led.gff3 | head -c 1 | od -A n -t x1 | tr -d ' ')" = 09 ] || exit 1
  for f in reg_source_nul_ended reg_start_nul_ended; do [ "$(tr -cd '\000' < "$f.gff3" | wc -c)" = 1 ] || exit 1; done
  [ "$(tr -cd '\000' < reg_name_nul_ended.gff3 | wc -c)" = 3 ] || exit 1
  for f in reg_end_not_a_number reg_start_not_a_number reg_start_zero reg_end_below_start; do grep -q 'ENSR21_BZTD' "$f.gff3" && [ "$(grep -c '' "$f.gff3")" = 4 ] && ! cmp -s reg_released.gff3 "$f.gff3" || exit 1; done
  [ "$(grep -c '' utr_start_first_of_two.gff3)" = 37 ] && [ "$(grep -c '' utr_start_later_of_two.gff3)" = 37 ] && [ "$(grep -c '' cds_start_later_of_two.gff3)" = 36 ]''',
  '''for f in released cds_start_not_a_number cds_end_below_start cds_start_zero cds_end_zero_padded exon_end_not_a_number utr_end_not_a_number utr_start_not_a_number utr_end_below_zero utr_start_zero utr_end_below_start utr_start_empty short_start_not_a_number utr_start_first_of_two utr_start_later_of_two cds_start_later_of_two reg_end_not_a_number reg_start_not_a_number reg_start_zero reg_end_below_start reg_exon_end_not_a_number; do grep -v '^#' "$f.gff3" | LC_ALL=C sort -k1,1 -k4,4n -k5,5n | bgzip > "$f.gff3.gz"; done
  for f in promoters promoters_minus; do grep -v '^#' "$f.gff" | LC_ALL=C sort -k1,1 -k4,4n -k5,5n | bgzip > "$f.gff.gz"; done
  for f in reg_tab_led reg_source_nul_ended reg_start_nul_ended reg_name_nul_ended; do bgzip -c "$f.gff3" > "$f.gff3.gz"; done''',
  '''test -n "$IMAGE" || { echo 'this reproduction indexes its files with the tabix of the Ensembl VEP image, so it needs --image' >&2; exit 1; }
  docker run --rm --user "$(id -u):$(id -g)" -v "$STAGE:/stage" -w /stage "$IMAGE" sh -c 'for f in *.gff3.gz promoters.gff.gz promoters_minus.gff.gz; do tabix -p gff "$f" 2> "$f.tabix.err"; echo $? > "$f.tabix.exit"; done'
  wrong() { echo "$1: the index build of the image did not $2" >&2; cat "$1.tabix.err" >&2; exit 1; }
  for f in cds_start_not_a_number exon_end_not_a_number utr_end_not_a_number utr_end_below_zero utr_start_not_a_number short_start_not_a_number utr_start_first_of_two reg_end_not_a_number reg_start_not_a_number reg_exon_end_not_a_number reg_tab_led reg_source_nul_ended; do
    [ "$(cat "$f.gff3.gz.tabix.exit")" = 0 ] && grep -q 'Failed to parse TBX_GENERIC' "$f.gff3.gz.tabix.err" || wrong "$f.gff3.gz" 'exit 0 with its parse message'
  done
  [ "$(cat promoters.gff.gz.tabix.exit)" = 0 ] && grep -q 'Failed to parse TBX_GENERIC' promoters.gff.gz.tabix.err || wrong promoters.gff.gz 'exit 0 with its parse message'
  [ "$(cat promoters_minus.gff.gz.tabix.exit)" = 0 ] && test ! -s promoters_minus.gff.gz.tabix.err || wrong promoters_minus.gff.gz 'exit 0 in silence'
  for f in released cds_end_below_start cds_start_zero cds_end_zero_padded utr_start_zero utr_end_below_start utr_start_empty reg_start_zero reg_end_below_start reg_start_nul_ended reg_name_nul_ended; do
    [ "$(cat "$f.gff3.gz.tabix.exit")" = 0 ] && test ! -s "$f.gff3.gz.tabix.err" || wrong "$f.gff3.gz" 'exit 0 in silence'
  done
  for f in utr_start_later_of_two cds_start_later_of_two; do
    [ "$(cat "$f.gff3.gz.tabix.exit")" = 1 ] && grep -qF 'Unsorted positions on sequence #1: 44115691 followed by 1' "$f.gff3.gz.tabix.err" && test ! -e "$f.gff3.gz.tbi" || wrong "$f.gff3.gz" 'fail on sort order and write no index'
  done
  sequences() { (set +o pipefail; gzip -dc "$1" | head -c 8 | tail -c 4 | od -A n -t d4 | tr -d ' '); }
  for f in cds_start_not_a_number short_start_not_a_number utr_start_first_of_two; do
    [ "$(sequences "$f.gff3.gz.tbi")" = 67668768 ] || wrong "$f.gff3.gz" 'write an index of 67,668,768 sequences'
  done''',
  '''refuse() {
    if "$VEP_CACHE_BUILDER" --species homo_sapiens --assembly GRCh38 --release 116 --gff3 "$1" --genome-fasta "$CORPUS/reference.fa.gz" --output-dir "$3" 2> "$1.build.err"; then echo "the cache builder accepted $1" >&2; exit 1; fi
    grep -F "$2" "$1.build.err" > /dev/null || { cat "$1.build.err" >&2; exit 1; }
    test ! -e "$3"
  }
  refuse cds_start_not_a_number.gff3 'cds_start_not_a_number.gff3 line 6: GFF3 start "abc" is not a number' "$STAGE/json_cache"
  refuse cds_end_below_start.gff3 'cds_end_below_start.gff3 line 6: GFF3 coordinates 42395417-42395324 are not 1-based and ordered' "$STAGE/cache_cds_end_below_start"
  refuse cds_start_zero.gff3 'cds_start_zero.gff3 line 6: GFF3 coordinates 0-42395417 are not 1-based and ordered' "$STAGE/cache_cds_start_zero"
  refuse exon_end_not_a_number.gff3 'exon_end_not_a_number.gff3 line 8: GFF3 end "xyz" is not a number' "$STAGE/cache_exon_end_not_a_number"
  refuse cds_start_later_of_two.gff3 'cds_start_later_of_two.gff3 line 20: GFF3 start "abc" is not a number' "$STAGE/cache_cds_start_later_of_two"
  refuse utr_end_not_a_number.gff3 'utr_end_not_a_number.gff3 line 8: GFF3 end "xyz" is not a number' "$STAGE/cache_utr_end_not_a_number"
  refuse utr_end_below_zero.gff3 'utr_end_below_zero.gff3 line 8: GFF3 end "-9" is not a number' "$STAGE/cache_utr_end_below_zero"
  refuse utr_start_not_a_number.gff3 'utr_start_not_a_number.gff3 line 8: GFF3 start "abc" is not a number' "$STAGE/cache_utr_start_not_a_number"
  refuse short_start_not_a_number.gff3 'short_start_not_a_number.gff3 line 8: GFF3 start "abc" is not a number' "$STAGE/cache_short_start_not_a_number"
  refuse utr_start_first_of_two.gff3 'utr_start_first_of_two.gff3 line 8: GFF3 start "abc" is not a number' "$STAGE/cache_utr_start_first_of_two"
  refuse utr_start_later_of_two.gff3 'utr_start_later_of_two.gff3 line 22: GFF3 start "abc" is not a number' "$STAGE/cache_utr_start_later_of_two"
  for f in utr_start_zero utr_end_below_start utr_start_empty; do
    "$VEP_CACHE_BUILDER" --species homo_sapiens --assembly GRCh38 --release 116 --gff3 "$f.gff3" --genome-fasta "$CORPUS/reference.fa.gz" --output-dir "$STAGE/cache_$f" 2> "$f.build.err" || { cat "$f.build.err" >&2; exit 1; }
    grep -q 'Skipped the feature types five_prime_UTR (1)' "$f.build.err" || { echo "$f: the UTR line was not skipped" >&2; exit 1; }
  done''',
  '''"$VEP_CACHE_BUILDER" --species homo_sapiens --assembly GRCh38 --release 116 --gff3 released.gff3 --genome-fasta "$CORPUS/reference.fa.gz" --output-dir "$STAGE/cache_released" 2> released.build.err || { cat released.build.err >&2; exit 1; }
  printf '##fileformat=VCFv4.2\n#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\n21\t42395401\ttmprss3_codon6\tG\tA\t.\t.\t.\n' > custom_probe.vcf &&
  if "$VEP" -i custom_probe.vcf -o custom_probe.txt --offline --json_cache "$STAGE/cache_released" --species homo_sapiens --assembly GRCh38 --format vcf --force_overwrite --no_stats --quiet --fasta "$CORPUS/reference.fa.gz" --custom "file=promoters.gff.gz,format=gff,gff_type=gencode_promoter" 2> custom_probe.err; then echo "vep opened the custom source over the index tabix 1.9 built" >&2; exit 1; fi
  grep -F 'tabix index' custom_probe.err | grep -F 'is malformed: it decompresses to more than 268435456 bytes' > /dev/null || { cat custom_probe.err >&2; exit 1; }
