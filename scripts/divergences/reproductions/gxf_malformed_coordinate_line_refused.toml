  ensembl reg_probe.vcf reg_name_nul_ended_ensembl.txt --gff released.gff3.gz --regulatory_gff file=reg_name_nul_ended.gff3.gz
  [ "$(regulatory_rows reg_name_nul_ended_ensembl.txt)" = 'in_first in_lost in_last ' ] || { echo 'Ensembl VEP did not build the record whose sequence name ends in NUL bytes' >&2; exit 1; }
  ensembl reg_probe.vcf reg_start_nul_ended_ensembl.txt --gff released.gff3.gz --regulatory_gff file=reg_start_nul_ended.gff3.gz
  [ "$(regulatory_rows reg_start_nul_ended_ensembl.txt)" = 'in_first in_lost in_last ' ] || { echo 'Ensembl VEP did not build the record whose start a NUL byte ends' >&2; exit 1; }
  ensembl records.vcf custom_minus_ensembl.txt --gff released.gff3.gz --custom file=promoters_minus.gff.gz,format=gff,gff_type=gencode_promoter
