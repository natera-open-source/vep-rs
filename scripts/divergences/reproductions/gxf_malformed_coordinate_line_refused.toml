  "$VEP_CACHE_BUILDER" --release 116 --assembly GRCh38 --species homo_sapiens --gff3 "$REPO/crates/vep-cache-builder/tests/fixtures/grch38_chr21/slice.gff3" --fasta "$REPO/crates/vep-cache-builder/tests/fixtures/grch38_chr21/peptides.fa" --regulatory-gff reg_name_nul_ended.gff3.gz --output-dir "$STAGE/bake_reg_name_nul_ended" 2> reg_name_nul_ended.bake.err || { cat reg_name_nul_ended.bake.err >&2; exit 1; }
