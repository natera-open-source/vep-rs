  [ "$(regulatory_rows reg_tab_led_ensembl.txt)" = 'in_lost in_last ' ] || { echo 'Ensembl VEP did not pass over the line that opens with a tab' >&2; exit 1; }
  ensembl reg_probe.vcf reg_source_nul_ended_ensembl.txt --gff released.gff3.gz --regulatory_gff file=reg_source_nul_ended.gff3.gz
