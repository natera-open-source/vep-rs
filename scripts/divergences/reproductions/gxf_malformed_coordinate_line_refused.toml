[input]
format = "vcf"
text = """
21	42395401	tmprss3_codon6	G	A	.	.	.
21	44107424	pwp2_codon3	T	C	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "{stage}/json_cache"
corpus = "tests/golden/116/GRCh38-gtf-builder"
gxf = "{stage}/cds_start_not_a_number.gff3.gz"
gxf_kind = "gff"
fasta = "tests/golden/116/GRCh38-gtf-builder/reference.fa.gz"

[run]
flags = ["--symbol", "--hgvs"]

[compare]
kind = "rows"
where = { record = ["tmprss3_codon6", "pwp2_codon3"] }
columns = ["Location", "Allele", "Gene", "Feature", "Consequence", "CDS_position", "HGVSc"]

[expected]
ensembl_vep = [
  "21:42395401 | A | ENSG00000160183 | ENST00001113783 | 5_prime_UTR_variant | - | ENST00001113783.1:c.-78C>T",
  "21:44107424 | C | ENSG00000241945 | ENST00000456705 | missense_variant | 8 | ENST00000456705.1:c.8T>C",
]
vep_rs = []
vep_rs_exit = 1

[implementation]
code = [
    "crates/vep-cache-builder/src/builder.rs::translation_end_outside_exons",
    "crates/vep-cache-builder/src/gff3.rs::parse_coordinate",
    "crates/vep-cache-builder/src/line.rs::check_indexed_coordinates",
]
tests = [
    "crates/vep-cache-builder/src/gff3.rs::tests::a_coordinate_the_index_build_fails_is_refused_on_a_skipped_line_of_any_sequence",
    "crates/vep-cache-builder/src/gff3.rs::tests::non_numeric_coordinate_fails_the_parse",
    "crates/vep-cache-builder/tests/refused_models.rs::a_translation_that_starts_or_ends_in_no_exon_is_refused_and_writes_nothing",
    "crates/vep-cli/tests/documented_subsets.rs::gxf_malformed_coordinate_line_refused_divergence_is_documented",
]
