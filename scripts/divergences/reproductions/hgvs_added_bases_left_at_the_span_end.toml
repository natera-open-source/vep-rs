  "15:39547041 | TA | ENST00000318578 | 3_prime_UTR_variant | ENST00000318578.3:c.*2158dup | 5 | 0 | 0",
  "2:96850597-96850600 | - | ENST00000337288 | 3_prime_UTR_variant | ENST00000337288.5:c.*1868_*1871del | - | 0 | 0",
  "2:96850597-96850600 | TTT | ENST00000337288 | 3_prime_UTR_variant | ENST00000337288.5:c.*1871del | - | 0 | 0",
  "2:96850597-96850600 | TTTTT | ENST00000337288 | 3_prime_UTR_variant | ENST00000337288.5:c.*1871dup | - | 0 | 0",
  "5:169931043-169931049 | - | ENST00000390656 | 5_prime_UTR_variant | ENST00000390656.4:c.-529_-528del | - | 0 | 0",
  "5:169931043-169931049 | GGCAGCAGGCAGCA | ENST00000390656 | 5_prime_UTR_variant | ENST00000390656.4:c.-517_-511dup | 17 | 0 | 0",
