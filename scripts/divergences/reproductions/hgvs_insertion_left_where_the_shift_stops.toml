entry = "hgvs_insertion_left_where_the_shift_stops"
page = "docs/divergences/hgvs-insertion-left-where-the-shift-stops.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "observed"
input_class_basis = "2 · 0.13 per million · 23 flag sets, 0 corpora"
notes = "ClinVar variation 1050537 on GRCh37 inserts 602 bases between 13:32906922 and 13:32906923, a copy of the 602 bases after that point. One base more repeats, so the run of its placements is 603 steps long and ends between 32907525 and 32907526. The walk of Ensembl VEP takes 399 steps, 1001 less 602, and stops between 32907321 and 32907322. On ENST00000380152 and ENST00000544455 Ensembl VEP writes an insertion at that stop beside HGVS_OFFSET 399; vep-rs writes the duplication of the 602 bases before the last placement, c.1309 to the first base of intron 10, beside HGVS_OFFSET 603. ENST00000530893 ends at 32907428, 97 bases before the last placement: Ensembl VEP writes the insertion at the stop, vep-rs no HGVSc, no HGVS_OFFSET and neither plugin field. The HGVSp Ensembl VEP alone writes on that row is the entry hgvsp_stop_named_on_incomplete_coding_sequence and is not compared here."

prepare = [
  '''[ -n "$IMAGE" ] || { echo "the cut of the cache is converted in the Ensembl VEP image: pass --image" >&2; exit 1; }
[ -n "$PERL_CACHE" ] || { echo "no homo_sapiens/116_GRCh37 with chromosome 13 under the --perl-cache-dir roots" >&2; exit 1; }
cut="$STAGE/perl-cache/homo_sapiens/116_GRCh37"
mkdir -p "$cut/13"
cp "$PERL_CACHE/info.txt" "$PERL_CACHE/chr_synonyms.txt" "$cut/"
cp "$PERL_CACHE/13/32000001-33000000.gz" "$cut/13/"''',
  '''docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$REPO/scripts/data:/scripts:ro" -v "$STAGE:/stage" "$IMAGE" perl /scripts/storable_to_json.pl /stage/perl-cache/homo_sapiens/116_GRCh37 /stage/json-cache 13 > "$STAGE/convert.log" 2>&1 || { tail -n 1 "$STAGE/convert.log" >&2; exit 1; }''',
]

[input]
format = "vcf"
text = """
13	32906922	1050537	A		.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh37"
json_cache = "{stage}/json-cache"
perl_cache = "{stage}/perl-cache"

[run]
flags = [
  "--hgvs", "--plugin", "HGVSIntronOffset",
  "--fasta", "{grch37_fasta}/Homo_sapiens.GRCh37.75.dna.primary_assembly.fa",
]

[compare]
kind = "rows"
where = { record = "1050537", feature = ["ENST00000380152", "ENST00000544455", "ENST00000530893"] }
columns = ["Feature", "Consequence", "HGVSc", "HGVS_OFFSET", "HGVS_IntronStartOffset", "HGVS_IntronEndOffset"]

[expected]
ensembl_vep = [
  "ENST00000380152 | frameshift_variant | ENST00000380152.3:c.1706_ | 399 | 0 | 0",
  "ENST00000530893 | frameshift_variant | ENST00000530893.2:c.1337_ | 399 | 0 | 0",
  "ENST00000544455 | frameshift_variant | ENST00000544455.1:c.1706_ | 399 | 0 | 0",
]
vep_rs = [
  "ENST00000380152 | frameshift_variant | ENST00000380152.3:c.1309_1909+1dup | 603 | 0 | 1",
  "ENST00000530893 | frameshift_variant | - | - | - | -",
  "ENST00000544455 | frameshift_variant | ENST00000544455.1:c.1309_1909+1dup | 603 | 0 | 1",
]
