entry = "hgvs_insertion_left_where_the_shift_stops"
page = "docs/divergences/hgvs-insertion-left-where-the-shift-stops.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 0.13 per million · 95 flag sets, 0 corpora"
notes = "ClinVar variation 1050537 on GRCh37 inserts 602 bases between 13:32906922 and 13:32906923, a copy of the 602 bases after that point. One base more repeats, so the run of its placements is 603 steps long and ends between 32907525 and 32907526. The walk of Ensembl VEP takes 399 steps, 1001 less 602, and stops between 32907321 and 32907322. On ENST00000380152 and ENST00000544455 Ensembl VEP writes an insertion at that stop beside HGVS_OFFSET 399 and the frameshift it reads there, between c.1706 and c.1707; vep-rs writes the duplication of the 602 bases before the last placement, c.1309 to the first base of intron 10, beside HGVS_OFFSET 603, and no HGVSp, the last placement lying in the intron. ENST00000530893 ends at 32907428, 97 bases before the last placement: Ensembl VEP writes the insertion at the stop and an HGVSp read there, vep-rs no HGVSc, no HGVSp, no HGVS_OFFSET and neither plugin field; the HGVSp of that row is the entry hgvsp_stop_named_on_incomplete_coding_sequence as well. ClinVar variation 1735214 inserts 1,000 bases between 3:37047542 and 3:37047543, in intron 4 of ENST00000231790, a copy of the 1,000 bases after that point; the run of its placements is 1,000 steps long and ends between c.441 and c.442. The walk of Ensembl VEP takes one step and stops in the intron: an insertion beside HGVS_OFFSET 1 and no HGVSp. vep-rs writes the duplication that ends at c.441 beside HGVS_OFFSET 1000 and the frameshift of the insertion at that point."

prepare = [
  '''[ -n "$PERL_CACHE" ] || { echo "no homo_sapiens/116_GRCh37 with chromosomes 3 and 13 under the --perl-cache-dir roots" >&2; exit 1; }
cut="$STAGE/perl-cache/homo_sapiens/116_GRCh37"
mkdir -p "$cut/3" "$cut/13"
cp "$PERL_CACHE/info.txt" "$PERL_CACHE/chr_synonyms.txt" "$cut/"
cp "$PERL_CACHE/3/37000001-38000000.gz" "$cut/3/"
cp "$PERL_CACHE/13/32000001-33000000.gz" "$cut/13/"''',
  '''cargo run --release --locked --quiet --manifest-path "$REPO/tools/vep-storable-to-json/Cargo.toml" -- "$STAGE/perl-cache/homo_sapiens/116_GRCh37" "$STAGE/json-cache" 3,13 > "$STAGE/convert.log" 2>&1 || { tail -n 1 "$STAGE/convert.log" >&2; exit 1; }''',
]

[input]
format = "vcf"
text = """
3	37047542	1735214	A		.	.	.
13	32906922	1050537	A		.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh37"
json_cache = "{stage}/json-cache"
perl_cache = "{stage}/perl-cache"

[run]
flags = [
  "--hgvs", "--plugin", "HGVSIntronOffset",
  "--fasta", "{grch37_fasta}/Homo_sapiens.GRCh37.75.dna.primary_assembly.fa",
]

[compare]
kind = "rows"
where = { record = ["1050537", "1735214"], feature = ["ENST00000380152", "ENST00000544455", "ENST00000530893", "ENST00000231790"] }
columns = ["Feature", "Consequence", "HGVSc", "HGVSp", "HGVS_OFFSET", "HGVS_IntronStartOffset", "HGVS_IntronEndOffset"]

[expected]
ensembl_vep = [
  "ENST00000231790 | intron_variant | ENST00000231790.2:c.381-939_381- | - | 1 | -939 | -938",
  "ENST00000380152 | frameshift_variant | ENST00000380152.3:c.1706_ | ENSP00000369497.3:p.Leu638LysfsTer23 | 399 | 0 | 0",
  "ENST00000530893 | frameshift_variant | ENST00000530893.2:c.1337_ | ENSP00000435699.2:p.Ter482IleextTer55 | 399 | 0 | 0",
  "ENST00000544455 | frameshift_variant | ENST00000544455.1:c.1706_ | ENSP00000439902.1:p.Leu638LysfsTer23 | 399 | 0 | 0",
]
vep_rs = [
  "ENST00000231790 | intron_variant | ENST00000231790.2:c.381-939_441dup | ENSP00000231790.2:p.Thr148AspfsTer54 | 1000 | -939 | 0",
  "ENST00000380152 | frameshift_variant | ENST00000380152.3:c.1309_1909+1dup | - | 603 | 0 | 1",
  "ENST00000530893 | frameshift_variant | - | - | - | - | -",
  "ENST00000544455 | frameshift_variant | ENST00000544455.1:c.1309_1909+1dup | - | 603 | 0 | 1",
]

[implementation]
code = [
    "crates/vep-effects/src/consequences.rs::perform_shift_bound",
    "crates/vep-effects/src/consequences.rs::shift_insertion_to_its_last_placement",
    "crates/vep-effects/src/hgvs.rs::generate_hgvs",
    "crates/vep-effects/src/hgvs.rs::hgvsc_shift",
]
tests = [
    "crates/vep-cli/tests/hgvsc_insertion_at_its_last_placement.rs::a_long_copy_changed_near_its_end_is_an_insertion_at_its_last_placement",
    "crates/vep-cli/tests/hgvsc_insertion_at_its_last_placement.rs::a_long_copy_from_the_coding_sequence_into_the_3_prime_utr_has_no_hgvsp",
    "crates/vep-cli/tests/hgvsc_insertion_at_its_last_placement.rs::a_long_copy_from_the_coding_sequence_past_the_last_base_has_no_hgvs_field",
    "crates/vep-cli/tests/hgvsc_insertion_at_its_last_placement.rs::a_long_copy_inside_an_exon_is_a_duplication_at_its_last_placement",
    "crates/vep-cli/tests/hgvsc_insertion_at_its_last_placement.rs::a_long_copy_whose_run_passes_the_last_base_has_no_hgvsc",
    "crates/vep-cli/tests/hgvsc_insertion_at_its_last_placement.rs::a_long_run_from_a_coding_exon_into_its_intron_has_no_hgvsp",
    "crates/vep-cli/tests/hgvsc_insertion_at_its_last_placement.rs::a_long_run_from_an_intron_into_the_next_exon_carries_the_hgvsp_of_its_last_placement",
    "crates/vep-effects/src/hgvs.rs::tests::an_insertion_is_described_at_its_last_placement_past_the_flank_perform_shift_reads",
]
rules = [
    "tools/vep-formats-compare/src/rules/clipped.rs::insertion_left_where_the_shift_stops",
    "tools/vep-formats-compare/src/rules/clipped.rs::protein_notation_at_the_last_placement",
    "tools/vep-plugin-pairs/src/rules/hgvs_offsets.rs::insertion_left_where_the_shift_stops",
]
