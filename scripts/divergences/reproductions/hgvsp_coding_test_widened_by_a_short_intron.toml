  "intron_end_dup_21_38610911 | ENST00000309117 | splice_acceptor_variant | - | - | ENST00000309117.6:c.202-1dup | -",
  "intron_end_dup_7_100333339 | ENST00000348028 | splice_region_variant,splice_polypyrimidine_tract_variant,intron_variant | - | - | ENST00000348028.3:c.54-3_54-1dup | -",
  "intron_end_dup_7_100333339 | ENST00000538115 | splice_region_variant,intron_variant | - | - | ENST00000538115.1:c.54-3_54-1dup | ENSP00000445091.1:p.Arg18dup",
  "intron_end_dup_7_100333339 | ENST00000542585 | splice_region_variant,intron_variant | - | - | ENST00000542585.1:c.54-3_54-1dup | ENSP00000444427.1:p.Arg18dup",
