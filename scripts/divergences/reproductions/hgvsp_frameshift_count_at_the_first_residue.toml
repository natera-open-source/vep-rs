  "deletion_from_before_the_first_base | ENST00000381318 | frameshift_variant | 2127-2130 | 709-710 | ENSP00000370719.3:p.His710AsnfsTer30 | 1",
  "deletion_from_before_the_first_base | ENST00000419241 | coding_sequence_variant,5_prime_UTR_variant,NMD_transcript_variant | ?-3 | ?-1 | ENSP00000415302.1:p.His1AsnfsTer30 | 1",
