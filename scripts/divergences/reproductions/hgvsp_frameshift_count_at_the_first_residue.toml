entry = "hgvsp_frameshift_count_at_the_first_residue"
page = "docs/divergences/hgvsp-frameshift-count-at-the-first-residue.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 108,184 per million · 95 flag sets, 142 corpora"
notes = "Four made-up records on transcripts of ITSN1 in the committed GRCh37 cache, under --hgvs. The first deletes the two bases that open the coding sequence of ENST00000415023, which is flagged cds_start_NF: the first changed residue is residue 1 and the new frame meets a stop codon at coding bases 12 to 14, its fourth codon. Ensembl VEP writes the unknown count there and vep-rs the count of 4. On ENST00000420666 and ENST00000381318 the same residue is numbered 2 and 1394, and both engines write the count of 4. The second record deletes the first two bases of the second codon of ENST00000415023: the first changed residue is residue 2, and both engines count 3 to the same stop codon. The third deletes one base before the first base of ENST00000419241, flagged cds_start_NF, and its first three coding bases; the same deletion can be written one base on, at coding bases 1 to 4, both engines print HGVS_OFFSET=1 and read the protein notation there, and both write coding_sequence_variant and 5_prime_UTR_variant. Ensembl VEP writes the unknown count and vep-rs the count of 30, which both write on ENST00000381318 at residue 710. The HGVSc of that row differs as well, as hgvs_shifted_deletion_clamped_span documents, and is not among the compared columns. The fourth inserts a copy of the first base of the start codon of ENST00000381318 before it. A start codon stands there, the edited transcript holds it whole behind a 5' UTR one base longer, and both engines write the unknown count."

[input]
format = "vcf"
text = """
21	35247663	first_codon_two_bases_deleted	GGA	G	.	.	.
21	35247666	second_codon_two_bases_deleted	AAA	A	.	.	.
21	35169856	deletion_from_before_the_first_base	TCCAT	T	.	.	.
21	35091133	base_inserted_before_a_start_codon	C	CA	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh37"
json_cache = "tests/golden/116/GRCh37-hgvs/json_cache"
fasta = "tests/golden/116/GRCh37-hgvs/reference.fa.gz"

[run]
flags = ["--hgvs"]

[compare]
kind = "rows"
where = { record = ["base_inserted_before_a_start_codon", "deletion_from_before_the_first_base", "first_codon_two_bases_deleted", "second_codon_two_bases_deleted"], feature = ["ENST00000381318", "ENST00000415023", "ENST00000419241", "ENST00000420666"] }
columns = ["Uploaded_variation", "Feature", "Consequence", "CDS_position", "Protein_position", "HGVSp", "HGVS_OFFSET"]

