  "deletion_from_before_the_first_base | ENST00000419241 | coding_sequence_variant,5_prime_UTR_variant,NMD_transcript_variant | ?-3 | ?-1 | ENSP00000415302.1:p.His1AsnfsTer? | 1",
  "first_codon_two_bases_deleted | ENST00000381318 | frameshift_variant | 4180-4181 | 1394 | ENSP00000370719.3:p.Glu1394LysfsTer4 | -",
  "first_codon_two_bases_deleted | ENST00000415023 | frameshift_variant | 1-2 | 1 | ENSP00000409800.1:p.Glu1LysfsTer? | -",
  "first_codon_two_bases_deleted | ENST00000420666 | frameshift_variant,NMD_transcript_variant | 4-5 | 2 | ENSP00000408319.1:p.Glu2LysfsTer4 | -",
  "second_codon_two_bases_deleted | ENST00000381318 | frameshift_variant | 4183-4184 | 1395 | ENSP00000370719.3:p.Asn1395HisfsTer3 | -",
  "second_codon_two_bases_deleted | ENST00000415023 | frameshift_variant | 4-5 | 2 | ENSP00000409800.1:p.Asn2HisfsTer3 | -",
  "second_codon_two_bases_deleted | ENST00000420666 | frameshift_variant,NMD_transcript_variant | 7-8 | 3 | ENSP00000408319.1:p.Asn3HisfsTer3 | -",
]
