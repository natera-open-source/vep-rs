entry = "hgvsp_frameshift_count_past_a_stop_read_as_a_residue"
page = "docs/divergences/hgvsp-frameshift-count-past-a-stop-read-as-a-residue.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "seen in the genome-wide ClinVar GRCh38 and GRCh37 files: 9 of 4,398,127 records and 7 of 4,388,172, on 17 and 16 rows under --hgvs"
notes = "Four records of the genome-wide ClinVar GRCh37 file and two of the gnomAD v2.1.1 genomes. Two lie on a selenoprotein gene of chromosome 19, a one-base insertion and a two-base deletion, each a frameshift after the stop codon that three of the four compared transcripts read as a selenocysteine. On four of their eight rows the new frame's first stop is another codon than that one: Ensembl VEP writes the unknown count and vep-rs the count. On one it is the same codon, and on one the transcript holds no stop in the new frame: both engines write the unknown count. On the two rows of the transcript whose coding sequence opens after that codon both engines write the same count. Two lie on a polymorphic pseudogene of chromosome 7, whose protein holds stops and names the residues after them, on the six transcripts of that biotype. The deletion of 35 bases changes a residue after eleven of those stops: Ensembl VEP writes the unknown count on the six rows and vep-rs the count to the new frame's first stop, the last codon of the alternate coding sequence. The one-base insertion changes a residue before the first of them, and both engines write the same count on its six rows. The two gnomAD records each delete bases right before a stop that a polymorphic pseudogene's protein holds, so that the stop is the first changed residue and both engines write an extension named at it. On chromosome 7 it is the sixteenth stop of that protein: Ensembl VEP writes the unknown count on the six rows and vep-rs the count from the lost stop to the new frame's first stop. On chromosome 17 it is the one stop of its protein, and both engines write the same count on its row."

prepare = [
  '''[ -n "$PERL_CACHE" ] || { echo "no homo_sapiens/116_GRCh37 with chromosomes 7, 17 and 19 under the --perl-cache-dir roots" >&2; exit 1; }
cut="$STAGE/perl-cache/homo_sapiens/116_GRCh37"
mkdir -p "$cut/7" "$cut/17" "$cut/19"
cp "$PERL_CACHE/info.txt" "$PERL_CACHE/chr_synonyms.txt" "$cut/"
cp "$PERL_CACHE/7/100000001-101000000.gz" "$cut/7/"
cp "$PERL_CACHE/17/79000001-80000000.gz" "$cut/17/"
cp "$PERL_CACHE/19/1000001-2000000.gz" "$cut/19/"''',
  '''cargo run --release --locked --quiet --manifest-path "$REPO/tools/vep-storable-to-json/Cargo.toml" -- "$STAGE/perl-cache/homo_sapiens/116_GRCh37" "$STAGE/json-cache" 7,17,19 > "$STAGE/convert.log" 2>&1 || { tail -n 1 "$STAGE/convert.log" >&2; exit 1; }''',
]

[input]
format = "vcf"
text = """
19	1105661	selenoprotein_one_base_insertion_19_1105661	C	CA	.	.	.
19	1106405	selenoprotein_two_base_deletion_19_1106405	ATC	A	.	.	.
7	100371474	pseudogene_insertion_7_100371474	G	GT	.	.	.
7	100385561	pseudogene_deletion_7_100385561	GGCTTCAGCTACCGCTTGCAAGGCCGCATGACCTAT	G	.	.	.
7	100388594	pseudogene_later_stop_deletion_7_100388594	TTG	T	.	.	.
17	79614932	pseudogene_first_stop_deletion_17_79614932	TTAAC	T	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh37"
json_cache = "{stage}/json-cache"
perl_cache = "{stage}/perl-cache"

[run]
flags = [
  "--hgvs",
  "--fasta", "{grch37_fasta}/Homo_sapiens.GRCh37.75.dna.primary_assembly.fa",
]

[compare]
kind = "rows"
where = { record = ["pseudogene_deletion_7_100385561", "pseudogene_first_stop_deletion_17_79614932", "pseudogene_insertion_7_100371474", "pseudogene_later_stop_deletion_7_100388594", "selenoprotein_one_base_insertion_19_1105661", "selenoprotein_two_base_deletion_19_1106405"], feature = ["ENST00000348028", "ENST00000349350", "ENST00000354171", "ENST00000421100", "ENST00000427578", "ENST00000443370", "ENST00000449052", "ENST00000572675", "ENST00000585480", "ENST00000587648", "ENST00000589115"] }
columns = ["Uploaded_variation", "Feature", "Consequence", "CDS_position", "Protein_position", "HGVSc", "HGVSp"]

