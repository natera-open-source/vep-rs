[implementation]
code = [
    "crates/vep-effects/src/coding.rs::insertion_left_at_the_start_of_an_intron",
    "crates/vep-effects/src/coding.rs::intron_end_insertion",
    "crates/vep-effects/src/coding.rs::intron_end_insertion_has_no_protein_notation",
]
tests = [
    "crates/vep-effects/src/intron_end_insertion_tests/copy.rs::copy_of_an_introns_last_base_written_before_the_exon_has_no_protein_notation",
    "crates/vep-effects/src/intron_end_insertion_tests/insertion.rs::insertion_that_cannot_end_the_intron_written_before_the_exon_has_no_protein_notation",
    "crates/vep-effects/src/intron_end_insertion_tests/intron_start.rs::insertion_left_after_an_exons_last_base_has_no_protein_notation",
    "crates/vep-effects/src/intron_end_insertion_tests/shared_base.rs::insertion_written_with_the_base_before_it_after_an_exons_last_base_has_no_protein_notation",
