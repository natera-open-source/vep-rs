  "three_bases_before_exon_21_38877585 | 21:38877585-38877586 | TAA | ENST00000321219 | stop_gained,inframe_insertion,splice_region_variant | 1239-1240 | 413-414 | ENST00000321219.8:c.1240-1_1240insTAA | - | -",
