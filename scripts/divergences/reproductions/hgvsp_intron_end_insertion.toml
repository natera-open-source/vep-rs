  "copy_written_one_base_earlier_21_27070987 | 21:27070987-27070988 | G | ENST00000312957 | splice_acceptor_variant | - | - | ENST00000312957.5:c.395-1dup | 1 | -",
  "shared_base_after_exon_3_37045965 | 3:37045965 | A | ENST00000231790 | missense_variant,splice_region_variant | 380 | 127 | ENST00000231790.2:c.380G>A | - | ENSP00000231790.2:p.Arg127Lys",
  "shared_base_after_exon_3_37045965 | 3:37045965 | GTAT | ENST00000231790 | protein_altering_variant,splice_region_variant | 380 | 127 | ENST00000231790.2:c.380_380+1insTAT | - | ENSP00000231790.2:p.Arg127delinsSerIle",
  "three_bases_after_exon_3_37045965 | 3:37045965-37045966 | TAT | ENST00000231790 | protein_altering_variant,splice_region_variant | 380-381 | 127 | ENST00000231790.2:c.380_380+1insTAT | - | ENSP00000231790.2:p.Arg127delinsSerIle",
  "three_bases_before_exon_21_38877585 | 21:38877585-38877586 | TAA | ENST00000321219 | stop_gained,inframe_insertion,splice_region_variant | 1239-1240 | 413-414 | ENST00000321219.8:c.1240-1_1240insTAA | - | ENSP00000319032.8:p.Arg413_Glu414insTer",
]
vep_rs = [
