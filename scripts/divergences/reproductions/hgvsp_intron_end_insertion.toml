entry = "hgvsp_intron_end_insertion"
page = "docs/divergences/hgvsp-intron-end-insertion.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 63,698 per million · 95 flag sets, 132 corpora"
notes = "Five records on GRCh37. Three write an insertion before an exon: a copy of the last base of intron 4 of the forward-strand ENST00000312957 written between that base, 21:27070988, and the first base of exon 5, the same copy written one base earlier, at 21:27070987, and three bases written between 21:38877585, the last base of intron 8 of ENST00000321219, and the first base of exon 9. Two write three bases between 3:37045965, the last coding base of exon 4 of ENST00000231790, and the intron's first base, alone and beside a substitution of the base at 37045965. Both engines write the same consequence terms, positions and HGVSc on every row. Ensembl VEP writes an HGVSp on the four rows of an insertion written in a gap between an intron and a coding exon, where vep-rs writes none; both write none for the copy written one base earlier, and the same HGVSp on the substitution's row."

prepare = [
  '''[ -n "$PERL_CACHE" ] || { echo "no homo_sapiens/116_GRCh37 with chromosomes 3 and 21 under the --perl-cache-dir roots" >&2; exit 1; }
cut="$STAGE/perl-cache/homo_sapiens/116_GRCh37"
mkdir -p "$cut/3" "$cut/21"
cp "$PERL_CACHE/info.txt" "$PERL_CACHE/chr_synonyms.txt" "$cut/"
cp "$PERL_CACHE/3/37000001-38000000.gz" "$cut/3/"
cp "$PERL_CACHE/21/27000001-28000000.gz" "$PERL_CACHE/21/38000001-39000000.gz" "$cut/21/"''',
  '''cargo run --release --locked --quiet --manifest-path "$REPO/tools/vep-storable-to-json/Cargo.toml" -- "$STAGE/perl-cache/homo_sapiens/116_GRCh37" "$STAGE/json-cache" 3,21 > "$STAGE/convert.log" 2>&1 || { tail -n 1 "$STAGE/convert.log" >&2; exit 1; }''',
]

[input]
format = "vcf"
text = """
3	37045965	shared_base_after_exon_3_37045965	G	GTAT,A	.	.	.
3	37045965	three_bases_after_exon_3_37045965	G	GTAT	.	.	.
21	27070987	copy_written_one_base_earlier_21_27070987	A	AG	.	.	.
21	27070988	copy_of_last_intron_base_21_27070988	G	GG	.	.	.
21	38877585	three_bases_before_exon_21_38877585	G	GTAA	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh37"
json_cache = "{stage}/json-cache"
perl_cache = "{stage}/perl-cache"

[run]
flags = [
  "--hgvs",
  "--fasta", "{grch37_fasta}/Homo_sapiens.GRCh37.75.dna.primary_assembly.fa",
]

[compare]
kind = "rows"
where = { record = ["shared_base_after_exon_3_37045965", "three_bases_after_exon_3_37045965", "copy_written_one_base_earlier_21_27070987", "copy_of_last_intron_base_21_27070988", "three_bases_before_exon_21_38877585"], feature = ["ENST00000231790", "ENST00000312957", "ENST00000321219"] }
columns = ["Uploaded_variation", "Location", "Allele", "Feature", "Consequence", "CDS_position", "Protein_position", "HGVSc", "HGVS_OFFSET", "HGVSp"]

