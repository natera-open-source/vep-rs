entry = "hgvsp_shifted_indel_written_span_gate"
page = "docs/divergences/hgvsp-shifted-indel-written-span-gate.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 137,702 per million · 95 flag sets, 144 corpora"
notes = "Twenty records written for the entry, on GRCh37. Seven are each the deletion of the last base of an intron that the 3' shift carries into the next exon: the first deletes 7:934970, the last base of intron 8 of the forward-strand ENST00000265857, and shifts two bases to coding base 897, and the second deletes 7:21934501, the last base of an intron of the forward-strand ENST00000328843 and ENST00000409508, and shifts four bases to coding base 12958 of the one and 12937 of the other. Both engines write the HGVSc of the shifted deletion with its HGVS_OFFSET and no CDS or protein position; Ensembl VEP writes no HGVSp on ENST00000265857 and ENST00000409508, where vep-rs writes the frameshift of the shifted deletion, and both write it on ENST00000328843, which has an intron one base long. The third deletes 7:780455, the last base of an intron of three forward-strand transcripts of one gene, and shifts one base into the next exon: ENST00000297440 carries no flag, ENST00000440747 carries cds_start_NF, a start phase of 2 and a coding sequence that ends on its stop codon, and ENST00000437419 carries cds_start_NF and cds_end_NF. Ensembl VEP writes no HGVSp on any of the three; vep-rs writes the frameshift of the shifted deletion on all three, numbered on each transcript's own codons, the new stop of the third inside the coding sequence that transcript holds. The fourth deletes 7:888054, the last intron base before an exon of the forward-strand ENST00000429178 (cds_start_NF, start phase 0), and the fifth 7:635942, the last intron base before an exon of the reverse-strand ENST00000400758 (cds_start_NF, start phase 1) and ENST00000414568 (cds_end_NF); on each vep-rs writes the frameshift of the shifted deletion and Ensembl VEP no HGVSp. The sixth deletes 7:716958, the last intron base before another exon of ENST00000414568, where the shifted deletion replaces a valine by a stop, and the seventh 7:882842, the last intron base before an exon of the forward-strand ENST00000435699 (cds_end_NF), where the new frame meets no stop codon before the transcript's last base and the count to it is the unknown one. One record inserts three bases between 7:889153 and 7:889154, which the shift carries four bases on, into an exon of ENST00000419312 (cds_start_NF and cds_end_NF) and of ENST00000429178: one residue inserted on the first, one duplicated on the second. Another inserts three bases between 7:878431 and 7:878432, which the shift carries four bases on, into an exon of ENST00000421580 and ENST00000435699 (both cds_end_NF): one residue duplicated on each. On each of those rows vep-rs writes the notation and Ensembl VEP no HGVSp. The other seven of those sixteen records give the third to the seventh deletions and the two insertions at their shifted positions, where both engines write that notation on every transcript named. The seventeenth record inserts seven bases between 7:21582861 and 7:21582862, in the 5' UTR of ENST00000328843 and ENST00000409508: they repeat the last two bases of the 5' UTR and coding bases 1 to 5, and the shift carries them seven bases on, to stand after coding base 5. Both engines write 5_prime_UTR_variant, the HGVSc of the duplication and its HGVS_OFFSET; Ensembl VEP writes no HGVSp on either transcript, where vep-rs writes the frameshift at residue 3. The eighteenth gives that duplication at its shifted position, where both engines write that notation on both transcripts. The nineteenth is the same kind of record on the reverse-strand ENST00000514988: seven bases written between 7:228862 and 7:228863, in its 5' UTR, repeat the seven before them on the genome (the last two bases of the 5' UTR and coding bases 1 to 5), and the shift carries them eight bases towards lower coordinates, to stand after coding base 6, with a negative HGVS_OFFSET. Ensembl VEP writes no HGVSp, where vep-rs writes the frameshift at residue 3. The twentieth gives that duplication at its shifted position, where both engines write that notation."

prepare = [
  '''[ -n "$PERL_CACHE" ] || { echo "no homo_sapiens/116_GRCh37 with chromosome 7 under the --perl-cache-dir roots" >&2; exit 1; }
cut="$STAGE/perl-cache/homo_sapiens/116_GRCh37"
mkdir -p "$cut/7"
cp "$PERL_CACHE/info.txt" "$PERL_CACHE/chr_synonyms.txt" "$cut/"
cp "$PERL_CACHE/7/1-1000000.gz" "$PERL_CACHE/7/21000001-22000000.gz" "$cut/7/"''',
  '''cargo run --release --locked --quiet --manifest-path "$REPO/tools/vep-storable-to-json/Cargo.toml" -- "$STAGE/perl-cache/homo_sapiens/116_GRCh37" "$STAGE/json-cache" 7 > "$STAGE/convert.log" 2>&1 || { tail -n 1 "$STAGE/convert.log" >&2; exit 1; }''',
]

