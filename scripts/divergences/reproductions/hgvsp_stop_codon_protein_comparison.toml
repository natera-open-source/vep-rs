input_class = "observed"
input_class_basis = "2 · 999,950 per million · 95 flag sets, 149 corpora"
notes = "Seven records written for the entry, on GRCh37. Five are each a change in the stop codon of one transcript that keeps every residue of the reference protein: three bases inserted after 1:90470803, a copy of 1:90470804 to 1:90470806, which the 3' shift carries three bases on, to between the second and third base of the stop codon of the forward-strand ENST00000361911, and which leave a stop at residue 71; one base inserted between 1:17345377 and 1:17345378, after the first base of the stop codon of the reverse-strand ENST00000375499, with the next stop codon 22 residues on in the 3' UTR; 1:2238202 deleted, the first base of the stop codon of the forward-strand ENST00000378536, with the next stop codon 47 residues on; 1:26142208 substituted, the second base of the stop codon of the forward-strand ENST00000374315, whose peptide reads the stop codon at residue 428 as a residue, with the next stop codon 35 residues on; and 7:151292535 to 7:151292537 deleted, the stop codon of the reverse-strand ENST00000488258, with the next stop codon 11 residues on. Two are each an insertion inside the last residue's codon that leaves the protein as it was, the first inserted base completing that codon to the same residue and the next three a stop codon at the stop's own residue: six bases inserted between 21:19638351 and 21:19638352, the second and third base of the codon of residue 273 of the forward-strand ENST00000299295, whose stop is residue 274; and five bases inserted between 21:27096954 and 21:27096955, the third and second base of the codon of residue 116 of the reverse-strand ENST00000457143, whose stop is residue 117. Both engines write the same consequence terms, CDS and protein positions and HGVSc on every row. Ensembl VEP writes the stop replaced by a stop, as a deletion-insertion, on the three-base insertion, the stop replaced by one residue and a stop on the one-base insertion, the stop unchanged on the one-base deletion, an extension with an unknown count on the substitution and the stop deleted before the count on the deletion of the stop codon, and no HGVSp on the two insertions inside the last residue's codon; vep-rs writes the stop unchanged on the three-base insertion and on those two and, on the other four, an extension named at the stop with its first new residue and the count of residues added. Four more records are each a one-base substitution that changes a stop on a polymorphic pseudogene, whose peptide holds a stop and names the residues after it: 4:100268190, the one stop the peptide of the reverse-strand ENST00000515683 holds, residue 78, with the next stop the stop codon that closes the coding sequence, 298 residues on; 12:6940463 and 12:6942946, the stops of residues 356 and 435 of the forward-strand ENST00000606935, whose peptide holds 18 stops, with the next stops 79 and 5 residues on; and 18:61390631, the stop codon that closes the coding sequence of the forward-strand ENST00000382749, whose peptide holds a stop at residue 90, with the next stop 43 residues on in the 3' UTR. On each Ensembl VEP writes the extension with an unknown count and vep-rs the same extension with the count of residues from the lost stop to the next stop. Three more records are each a deletion of two codons that takes a stop on one of those three transcripts: 4:100268188 to 4:100268193 deleted, the codons of residue 77 and of the stop of residue 78 of ENST00000515683, after which the stop codon that closes the coding sequence stands 296 places after the lost stop's; 12:6940461 to 12:6940466, the codons of the stop of residue 356 and of residue 357 of ENST00000606935, after which the stop of residue 435 stands 77 places on; and 18:61390628 to 18:61390633, the codons of residue 392 and of the closing stop of ENST00000382749, after which the stop of the 3' UTR stands 41 places on. On each Ensembl VEP writes the deletion with an unknown extension count and vep-rs the same deletion with that count."

prepare = [
  '''[ -n "$PERL_CACHE" ] || { echo "no homo_sapiens/116_GRCh37 with chromosomes 1, 4, 7, 12, 18 and 21 under the --perl-cache-dir roots" >&2; exit 1; }
cut="$STAGE/perl-cache/homo_sapiens/116_GRCh37"
mkdir -p "$cut/1" "$cut/4" "$cut/7" "$cut/12" "$cut/18" "$cut/21"
cp "$PERL_CACHE/info.txt" "$PERL_CACHE/chr_synonyms.txt" "$cut/"
cp "$PERL_CACHE/1/2000001-3000000.gz" "$PERL_CACHE/1/17000001-18000000.gz" "$PERL_CACHE/1/26000001-27000000.gz" "$PERL_CACHE/1/90000001-91000000.gz" "$cut/1/"
cp "$PERL_CACHE/4/100000001-101000000.gz" "$cut/4/"
cp "$PERL_CACHE/7/151000001-152000000.gz" "$cut/7/"
cp "$PERL_CACHE/12/6000001-7000000.gz" "$cut/12/"
cp "$PERL_CACHE/18/61000001-62000000.gz" "$cut/18/"
cp "$PERL_CACHE/21/19000001-20000000.gz" "$PERL_CACHE/21/27000001-28000000.gz" "$cut/21/"''',
  '''cargo run --release --locked --quiet --manifest-path "$REPO/tools/vep-storable-to-json/Cargo.toml" -- "$STAGE/perl-cache/homo_sapiens/116_GRCh37" "$STAGE/json-cache" 1,4,7,12,18,21 > "$STAGE/convert.log" 2>&1 || { tail -n 1 "$STAGE/convert.log" >&2; exit 1; }''',
]

