  "stop_codon_first_base_deletion_1_2238201 | ENST00000378536 | stop_lost | 2185 | 729 | ENST00000378536.4:c.2185del | ENSP00000367797.4:p.Ter729ArgextTer47",
  "stop_codon_one_base_insertion_1_17345377 | ENST00000375499 | stop_lost | 841-842 | 281 | ENST00000375499.3:c.841dup | ENSP00000364649.3:p.Ter281LeuextTer22",
  "stop_codon_second_base_substitution_1_26142208 | ENST00000374315 | stop_lost | 1670 | 557 | ENST00000374315.1:c.1670A>C | ENSP00000363434.1:p.Ter557SerextTer35",
