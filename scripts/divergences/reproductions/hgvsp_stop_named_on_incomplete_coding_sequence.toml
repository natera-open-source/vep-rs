entry = "hgvsp_stop_named_on_incomplete_coding_sequence"
page = "docs/divergences/hgvsp-stop-named-on-incomplete-coding-sequence.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 4,626 of 116,165 cache transcripts · 95 flag sets, 127 corpora"
notes = "Five records, on GRCh37, each a substitution of one base. Two are written for the entry, on chromosome 1: the first changes 1:3548777, the last base of the coding sequence of the reverse-strand ENST00000424367, which is flagged cds_end_NF and whose coding sequence of 913 bases ends on the first base of codon 305, and the second changes 1:865692, the first coding base of the forward-strand ENST00000341065, which is flagged cds_start_NF and whose coding sequence opens on the second base of its first codon and is closed by a stop codon. Ensembl VEP writes the stop unchanged at residue 305 on the first and at residue 1 on the second, the equals sign percent-encoded as the default output writes it; vep-rs writes no HGVSp on either, and every other column is the same in both engines' rows. The other three are the three substitutions of 22:23235998, which ClinVar holds: the last base of the coding sequence of the forward-strand ENST00000390320, which is flagged cds_start_NF and whose coding sequence of 127 bases is 42 codons and the first base of codon 43, its last three bases spelling a stop codon in a frame the protein is not read in. The record named kept leaves a stop codon in those three bases and the two named changed turn them into a residue's codon; Ensembl VEP writes the stop unchanged at residue 43 on all three and vep-rs no HGVSp."

prepare = [
  '''[ -n "$PERL_CACHE" ] || { echo "no homo_sapiens/116_GRCh37 with chromosomes 1 and 22 under the --perl-cache-dir roots" >&2; exit 1; }
cut="$STAGE/perl-cache/homo_sapiens/116_GRCh37"
mkdir -p "$cut/1" "$cut/22"
cp "$PERL_CACHE/info.txt" "$PERL_CACHE/chr_synonyms.txt" "$cut/"
cp "$PERL_CACHE/1/1-1000000.gz" "$PERL_CACHE/1/3000001-4000000.gz" "$cut/1/"
cp "$PERL_CACHE/22/23000001-24000000.gz" "$cut/22/"''',
  '''cargo run --release --locked --quiet --manifest-path "$REPO/tools/vep-storable-to-json/Cargo.toml" -- "$STAGE/perl-cache/homo_sapiens/116_GRCh37" "$STAGE/json-cache" 1,22 > "$STAGE/convert.log" 2>&1 || { tail -n 1 "$STAGE/convert.log" >&2; exit 1; }''',
]

[input]
format = "vcf"
text = """
1	3548777	partial_last_codon_substitution_1_3548777	C	A	.	.	.
1	865692	incomplete_first_codon_substitution_1_865692	C	A	.	.	.
22	23235998	out_of_frame_stop_codon_kept_22_23235998	G	A	.	.	.
22	23235998	out_of_frame_stop_codon_changed_22_23235998_first	G	C	.	.	.
22	23235998	out_of_frame_stop_codon_changed_22_23235998_second	G	T	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh37"
json_cache = "{stage}/json-cache"
perl_cache = "{stage}/perl-cache"

[run]
flags = [
  "--hgvs",
  "--fasta", "{grch37_fasta}/Homo_sapiens.GRCh37.75.dna.primary_assembly.fa",
]

[compare]
kind = "rows"
where = { record = ["partial_last_codon_substitution_1_3548777", "incomplete_first_codon_substitution_1_865692", "out_of_frame_stop_codon_kept_22_23235998", "out_of_frame_stop_codon_changed_22_23235998_first", "out_of_frame_stop_codon_changed_22_23235998_second"], feature = ["ENST00000424367", "ENST00000341065", "ENST00000390320"] }
columns = ["Uploaded_variation", "Feature", "Consequence", "CDS_position", "Protein_position", "HGVSc", "HGVSp", "FLAGS"]

[expected]
ensembl_vep = [
  "incomplete_first_codon_substitution_1_865692 | ENST00000341065 | coding_sequence_variant | 2 | 1 | ENST00000341065.4:c.2C>A | ENSP00000349216.4:p.Ter1%3D | cds_start_NF",
  "out_of_frame_stop_codon_changed_22_23235998_first | ENST00000390320 | incomplete_terminal_codon_variant,coding_sequence_variant | 127 | 43 | ENST00000390320.2:c.127G>C | ENSP00000417505.1:p.Ter43%3D | cds_start_NF",
  "out_of_frame_stop_codon_changed_22_23235998_second | ENST00000390320 | incomplete_terminal_codon_variant,coding_sequence_variant | 127 | 43 | ENST00000390320.2:c.127G>T | ENSP00000417505.1:p.Ter43%3D | cds_start_NF",
  "out_of_frame_stop_codon_kept_22_23235998 | ENST00000390320 | incomplete_terminal_codon_variant,coding_sequence_variant | 127 | 43 | ENST00000390320.2:c.127G>A | ENSP00000417505.1:p.Ter43%3D | cds_start_NF",
  "partial_last_codon_substitution_1_3548777 | ENST00000424367 | incomplete_terminal_codon_variant,coding_sequence_variant | 913 | 305 | ENST00000424367.1:c.913G>T | ENSP00000416192.1:p.Ter305%3D | cds_end_NF",
]
vep_rs = [
  "incomplete_first_codon_substitution_1_865692 | ENST00000341065 | coding_sequence_variant | 2 | 1 | ENST00000341065.4:c.2C>A | - | cds_start_NF",
  "out_of_frame_stop_codon_changed_22_23235998_first | ENST00000390320 | incomplete_terminal_codon_variant,coding_sequence_variant | 127 | 43 | ENST00000390320.2:c.127G>C | - | cds_start_NF",
  "out_of_frame_stop_codon_changed_22_23235998_second | ENST00000390320 | incomplete_terminal_codon_variant,coding_sequence_variant | 127 | 43 | ENST00000390320.2:c.127G>T | - | cds_start_NF",
  "out_of_frame_stop_codon_kept_22_23235998 | ENST00000390320 | incomplete_terminal_codon_variant,coding_sequence_variant | 127 | 43 | ENST00000390320.2:c.127G>A | - | cds_start_NF",
  "partial_last_codon_substitution_1_3548777 | ENST00000424367 | incomplete_terminal_codon_variant,coding_sequence_variant | 913 | 305 | ENST00000424367.1:c.913G>T | - | cds_end_NF",
]

