entry = "hgvsp_stop_named_on_incomplete_coding_sequence"
page = "docs/divergences/hgvsp-stop-named-on-incomplete-coding-sequence.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "observed"
input_class_basis = "2 · 4,230 of 77,601 cache transcripts · 23 flag sets, 100 corpora"
notes = "Two records written for the entry, on GRCh37, each a substitution of one base on chromosome 1: the first changes 1:3548777, the last base of the coding sequence of the reverse-strand ENST00000424367, which is flagged cds_end_NF and whose coding sequence of 913 bases ends on the first base of codon 305, and the second changes 1:865692, the first coding base of the forward-strand ENST00000341065, which is flagged cds_start_NF and whose coding sequence opens on the second base of its first codon and is closed by a stop codon. Ensembl VEP writes the stop unchanged at residue 305 on the first and at residue 1 on the second, the equals sign percent-encoded as the default output writes it; vep-rs writes no HGVSp on either, and every other column is the same in both engines' rows."

prepare = [
  '''[ -n "$IMAGE" ] || { echo "the cut of the cache is converted in the Ensembl VEP image: give --image" >&2; exit 1; }
[ -n "$PERL_CACHE" ] || { echo "no homo_sapiens/116_GRCh37 with chromosome 1 under the --perl-cache-dir roots" >&2; exit 1; }
cut="$STAGE/perl-cache/homo_sapiens/116_GRCh37"
mkdir -p "$cut/1"
cp "$PERL_CACHE/info.txt" "$PERL_CACHE/chr_synonyms.txt" "$cut/"
cp "$PERL_CACHE/1/1-1000000.gz" "$PERL_CACHE/1/3000001-4000000.gz" "$cut/1/"''',
  '''docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$REPO/scripts/data:/scripts:ro" -v "$STAGE:/stage" "$IMAGE" perl /scripts/storable_to_json.pl /stage/perl-cache/homo_sapiens/116_GRCh37 /stage/json-cache 1 > "$STAGE/convert.log" 2>&1 || { tail -n 1 "$STAGE/convert.log" >&2; exit 1; }''',
]

[input]
format = "vcf"
text = """
1	3548777	partial_last_codon_substitution_1_3548777	C	A	.	.	.
1	865692	incomplete_first_codon_substitution_1_865692	C	A	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh37"
json_cache = "{stage}/json-cache"
perl_cache = "{stage}/perl-cache"

[run]
flags = [
  "--hgvs",
  "--fasta", "{grch37_fasta}/Homo_sapiens.GRCh37.75.dna.primary_assembly.fa",
]

[compare]
kind = "rows"
where = { record = ["partial_last_codon_substitution_1_3548777", "incomplete_first_codon_substitution_1_865692"], feature = ["ENST00000424367", "ENST00000341065"] }
columns = ["Uploaded_variation", "Feature", "Consequence", "CDS_position", "Protein_position", "HGVSc", "HGVSp", "FLAGS"]

[expected]
ensembl_vep = [
  "incomplete_first_codon_substitution_1_865692 | ENST00000341065 | coding_sequence_variant | 2 | 1 | ENST00000341065.4:c.2C>A | ENSP00000349216.4:p.Ter1%3D | cds_start_NF",
  "partial_last_codon_substitution_1_3548777 | ENST00000424367 | incomplete_terminal_codon_variant,coding_sequence_variant | 913 | 305 | ENST00000424367.1:c.913G>T | ENSP00000416192.1:p.Ter305%3D | cds_end_NF",
]
vep_rs = [
  "incomplete_first_codon_substitution_1_865692 | ENST00000341065 | coding_sequence_variant | 2 | 1 | ENST00000341065.4:c.2C>A | - | cds_start_NF",
  "partial_last_codon_substitution_1_3548777 | ENST00000424367 | incomplete_terminal_codon_variant,coding_sequence_variant | 913 | 305 | ENST00000424367.1:c.913G>T | - | cds_end_NF",
]
