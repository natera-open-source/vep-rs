    "crates/vep-effects/src/coding.rs::names_a_stop_the_reference_lacks",
    "crates/vep-effects/src/coding.rs::stop_named_alone",
]
tests = [
    "crates/vep-effects/src/stop_codon_tests.rs::extension_on_a_coding_sequence_no_stop_codon_closes_has_no_protein_notation",
    "crates/vep-effects/src/stop_codon_tests.rs::frameshift_past_the_last_whole_codon_of_an_unflagged_coding_sequence_has_no_protein_notation",
    "crates/vep-effects/src/stop_codon_tests.rs::stop_deleted_on_a_coding_sequence_no_stop_codon_closes_has_no_protein_notation",
    "crates/vep-effects/src/stop_codon_tests.rs::stop_unchanged_at_residue_1_of_an_incomplete_first_codon_has_no_protein_notation",
    "crates/vep-effects/src/stop_codon_tests.rs::stop_unchanged_on_a_coding_sequence_no_stop_codon_closes_has_no_protein_notation",
]
rules = [
    "tools/vep-formats-compare/src/coding_end_terms.rs::landed_rule_may_take",
    "tools/vep-formats-compare/src/rules/coding_end_pairs.rs::stands_on_the_record",
    "tools/vep-formats-compare/src/rules/hgvsp_stop.rs::stop_named_on_a_transcript_of_a_partial_last_codon",
    "tools/vep-formats-compare/src/rules/hgvsp_stop.rs::stop_named_on_incomplete_coding_sequence",
    "tools/vep-golden-corpus/src/classify/protein.rs::stop_named_on_incomplete_coding_sequence_pair",
