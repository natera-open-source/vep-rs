entry = "json_non_finite_number_token"
page = "docs/divergences/json-non-finite-number-token.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "unobserved"
input_class_basis = "well-formed under the ClinPred plugin's header (ClinPred.pm:17-59), which sets no range on a score cell, and under the Float type of a custom VCF annotation, which admits INF, INFINITY and NAN (VCF 4.3 specification, section 1.3 \"Data types\"); not seen in the measured datasets"
notes = "Three ClinPred cells, Inf, NaN and 1e400, on three substitutions the plugin scores. Ensembl VEP numifies each cell and its encoder writes the bare token inf or nan, so the three lines are not JSON and are read here as text; vep-rs writes the cell's text as a string. The default, tab and VCF outputs of both engines carry the cells as the table spells them."
# The table's five columns are the corpus table's; the cells are the three spellings under test.
prepare = [
  "printf '#chr\\tStart\\tRef\\tAlt\\tClinPred_Score\\n21\\t30282169\\tC\\tA\\tInf\\n21\\t30282172\\tT\\tC\\tNaN\\n21\\t30396091\\tC\\tT\\t1e400\\n' | bgzip > \"$STAGE/clinpred_cells_synthetic.tsv.gz\"",
  "tabix -s 1 -b 2 -e 2 \"$STAGE/clinpred_cells_synthetic.tsv.gz\"",
]

[input]
format = "vcf"
text = """
21	30282169	stop_lost_rev	C	A	.	.	.
21	30282172	missense_rev	T	C	.	.	.
21	30396091	missense_fwd	C	T	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-clinpred-fixture/json_cache"

[run]
flags = ["--plugin", "ClinPred,file={stage}/clinpred_cells_synthetic.tsv.gz"]
format = "json"

# Ensembl VEP's lines are not JSON, so the member's value is read from the line's text, the rest of the line masked.
[compare]
kind = "lines"
pattern = '"clinpred":'
mask = ['^.*"clinpred":', '[,}].*$']

[expected]
ensembl_vep = ["<masked>inf<masked>", "<masked>inf<masked>", "<masked>nan<masked>"]
vep_rs = ['<masked>"1e400"<masked>', '<masked>"Inf"<masked>', '<masked>"NaN"<masked>']

[implementation]
code = [
    "crates/vep-io/src/output/json.rs::numberify",
    "crates/vep-io/src/output/json.rs::perl_number",
]
tests = [
    "crates/vep-io/src/output/json.rs::tests::numberify_keeps_a_value_with_no_finite_number_as_text",
]
