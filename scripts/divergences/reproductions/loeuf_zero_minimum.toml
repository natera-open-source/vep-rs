entry = "loeuf_zero_minimum"
page = "docs/plugins/annotation-store-divergences.md#7-loeuf-a-genes-minimum-of-0"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "unobserved"
input_class_basis = "well-formed under the LOEUF plugin's header, which describes the data file (a gnomAD constraint table, sorted, bgzip-compressed and tabix-indexed) and sets no number format for a score cell, read with match_by=gene; not seen in the measured datasets"
# The corpus table with the `lof.oe_ci.upper` cell (column 94) of ENST00000359726, APP's minimum, written 0.
prepare = [
  'zcat "$CORPUS/data/loeuf_dataset_grch38.tsv.gz" | awk -F"\t" -v OFS="\t" "\$3 == \"ENST00000359726\" { \$94 = \"0\" } { print }" | bgzip -c > "$STAGE/loeuf_zero.tsv.gz" && tabix -s 114 -b 115 -e 116 "$STAGE/loeuf_zero.tsv.gz"',
]

[input]
format = "vcf"
text = """
21	26112000	app_exon	G	A	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-loeuf/json_cache"

[run]
flags = ["--plugin", "LOEUF,file={stage}/loeuf_zero.tsv.gz,match_by=gene"]

[compare]
kind = "field"
field = "LOEUF"
where = { record = "app_exon", feature = "ENST00000359726" }

[expected]
ensembl_vep = ["-"]
vep_rs = ["0"]

[implementation]
code = ["crates/vep-builtins/src/plugins/loeuf.rs::LoeufPlugin::value_for"]
tests = [
    "crates/vep-cli/tests/plugin_documented_rows.rs::a_loeuf_gene_minimum_of_zero_is_written_on_every_row_of_its_gene",
]
