entry = "loftee_anc_allele_multiallelic_record"
page = "docs/plugins/loftee.md#4-the-ancestral-allele-filter-withheld-from-every-allele-of-a-multi-allelic-record"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 248.7 per million · 10 flag sets, 77 corpora"
notes = "Ensembl VEP's LoF plugin is the LOFTEE repository's grch38 branch (--extra-dir loftee=<checkout>), and it reads the ancestral base through `samtools faidx`, which the image lacks: the run needs --tool-dir with samtools. The one-allele record is the control: both engines filter its T allele ANC_ALLELE."

# At 21:32314600 the reference reads C, the corpus's ancestral FASTA reads T, and C>T is a stop gain on ENST00000339944.
# The same allele alone, then beside a sibling allele whose string makes the record's allele string longer than three characters.
[input]
format = "vcf"
text = """
21	32314600	one	C	T	.	.	.
21	32314600	two	C	T,A	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-loftee/json_cache"
fasta = "tests/golden/116/GRCh38-plugin-loftee/reference.fa.gz"

[run]
tools = ["samtools"]
flags = [
  "--dir_plugins", "{loftee}",
  "--plugin", "LoF,loftee_path:{loftee},human_ancestor_fa:{corpus}/plugin_data/human_ancestor.fa.gz,gerp_bigwig:{corpus}/plugin_data/gerp_conservation_scores.homo_sapiens.GRCh38.bw",
]

# The A allele's rows are synonymous and carry no LoF field; END_TRUNC keeps the call LC on both sides.
[compare]
kind = "rows"
where = { record = ["one", "two"], feature = "ENST00000339944", allele = "T" }
columns = ["Uploaded_variation", "Location", "Allele", "Feature", "Consequence", "LoF", "LoF_filter"]

[expected]
ensembl_vep = [
  "one | 21:32314600 | T | ENST00000339944 | stop_gained | LC | END_TRUNC,ANC_ALLELE",
  "two | 21:32314600 | T | ENST00000339944 | stop_gained | LC | END_TRUNC",
]
vep_rs = [
  "one | 21:32314600 | T | ENST00000339944 | stop_gained | LC | END_TRUNC,ANC_ALLELE",
  "two | 21:32314600 | T | ENST00000339944 | stop_gained | LC | END_TRUNC,ANC_ALLELE",
]

[implementation]
code = ["crates/vep-builtins/src/plugins/loftee.rs::LofteePlugin::is_ancestral_allele"]
tests = ["crates/vep-cli/tests/plugin_documented_rows.rs::loftee_filters_an_ancestral_allele_beside_a_sibling_allele"]
rules = ["tools/vep-plugin-pairs/src/rules/loftee.rs::anc_allele_multiallelic_record"]
