  "first_exon_stop | ENST00000530908 | stop_gained | - | - | - | -",
  "frameshift_before_utr_exon | ENST00000286809 | frameshift_variant | - | - | - | -",
  "frameshift_before_utr_exon | ENST00000399899 | frameshift_variant | HC | - | SINGLE_EXON | GERP_DIST:516,BP_DIST:515,PERCENTILE:0.240412979351032,DIST_FROM_LAST_EXON:-310,50_BP_RULE:FAIL",
  "stop_before_utr_exon | ENST00000286809 | stop_gained | - | - | - | -",
