entry = "loftee_incomplete_cds_every_row"
page = "docs/plugins/loftee.md#2-check_complete_cds-filters-every-multi-exon-transcript"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "unobserved"
input_class_basis = "well-formed under the check_complete_cds option of the LoF plugin that Ensembl VEP runs for LoFTEE, which the plugin's documentation describes as a check of the Ensembl Complete CDS annotation, off by default, and which the value true turns on; not seen in the measured datasets"
notes = "Ensembl VEP's LoF plugin is the LOFTEE repository's grch38 branch, outside the VEP_plugins checkout: the run needs --extra-dir loftee=<LOFTEE checkout>."

# The corpus's stop gain on four UMODL1 transcripts, none marked cds_start_NF or cds_end_NF.
[input]
format = "vcf"
text = """
21	42076175	4454616	G	T	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-loftee/json_cache"
fasta = "tests/golden/116/GRCh38-plugin-loftee/reference.fa.gz"

[run]
flags = [
  "--dir_plugins", "{loftee}",
  "--plugin", "LoF,loftee_path:{loftee},human_ancestor_fa:{corpus}/plugin_data/human_ancestor.fa.gz,gerp_bigwig:{corpus}/plugin_data/gerp_conservation_scores.homo_sapiens.GRCh38.bw,check_complete_cds:true",
]

[compare]
kind = "rows"
where = { record = "4454616", consequence = "stop_gained" }
columns = ["Feature", "Consequence", "FLAGS", "LoF", "LoF_filter"]

[expected]
ensembl_vep = [
  "ENST00000400424 | stop_gained | - | LC | INCOMPLETE_CDS",
  "ENST00000400427 | stop_gained | - | LC | INCOMPLETE_CDS",
  "ENST00000408910 | stop_gained | - | LC | INCOMPLETE_CDS",
  "ENST00000408989 | stop_gained | - | LC | INCOMPLETE_CDS",
]
vep_rs = [
  "ENST00000400424 | stop_gained | - | HC | -",
  "ENST00000400427 | stop_gained | - | HC | -",
  "ENST00000408910 | stop_gained | - | HC | -",
  "ENST00000408989 | stop_gained | - | HC | -",
]

[implementation]
code = [
    "crates/vep-builtins/src/plugins/loftee.rs::LofteePlugin::annotate",
    "crates/vep-core/src/consequence.rs::LofteeContext::from_transcript",
]
tests = [
    "crates/vep-cli/tests/plugins_builtin.rs::loftee_check_complete_cds_leaves_a_row_without_an_exon_number",
    "crates/vep-cli/tests/plugins_builtin.rs::loftee_check_complete_cds_reads_any_case_of_true_only",
]
