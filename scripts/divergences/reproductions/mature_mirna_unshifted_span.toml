entry = "mature_mirna_unshifted_span"
page = "docs/divergences/mature-mirna-unshifted-span.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 137,702 per million · 4 flag sets, 144 corpora"
notes = "A deletion of four bases, AGAC, whose written span begins on the last base of the mature sequence of MIR4759 (ENST00000584048); the shift carries it three bases along the repeat AGACAGA onto the bases after the mature sequence."

[input]
format = "vcf"
text = """
21	26953984	rs1324558451	TAGAC	T	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-release116/json_cache"
fasta = "tests/golden/116/GRCh38-plugin-spliceai-fixture/reference.fa.gz"

[run]
flags = ["--hgvs", "--shift_3prime", "1", "--shift_length"]

[compare]
kind = "rows"
where = { record = "rs1324558451", feature = "ENST00000584048" }
columns = ["Consequence", "cDNA_position", "HGVSc", "HGVS_OFFSET", "SHIFT_LENGTH"]

[expected]
ensembl_vep = ["mature_miRNA_variant | 28-31 | ENST00000584048.1:n.28_31del | 3 | 3"]
vep_rs = ["non_coding_transcript_exon_variant | 28-31 | ENST00000584048.1:n.28_31del | 3 | 3"]

[implementation]
code = [
    "crates/vep-effects/src/consequences.rs::consequences_of_the_record",
    "crates/vep-effects/src/consequences.rs::variant_overlaps_mature_mirna",
]
tests = ["crates/vep-cli/tests/consequence_documented_rows.rs::a_deletion_shifted_off_a_mature_mirna_is_no_mature_mirna_variant"]
rules = ["tools/vep-formats-compare/src/rules/term_pairs.rs::mature_mirna_unshifted_span_pair"]
