entry = "maxentscan_overlapping_windows"
page = "docs/plugins/transcript-model.md#2-maxentscan-two-splice-site-windows-over-one-substitution"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "observed"
input_class_basis = "2 · 862,250 per million · 6 flag sets, 104 corpora"
notes = "The page's record stands in the GRCh38 MaxEntScan fixture corpus and a record of the same shape in the GRCh37 one; this two-base exon of the committed fly corpus shows the shape on a third cache."
# The matrix directory of the MaxEntScan fixture corpora, a made-up directory.
prepare = [
  "python3 \"$REPO/scripts/fixtures/maxentscan_fixture_matrices.py\" --seed 1 --out \"$STAGE/fordownload_synthetic\"",
]

# A substitution in the two-base exon 2L:21019776-21019777 of FBtr0331199 (reverse strand), inside the acceptor window
# of the intron before it in transcript order (21019778-21028636) and the donor window of the intron after it (20993378-21019775).
[input]
format = "vcf"
text = """
2L	21019776	fly_two_base_exon	A	G	.	.	.
"""

[cache]
species = "drosophila_melanogaster"
assembly = "BDGP6.54"
json_cache = "tests/golden/116/BDGP6.54-fly/json_cache"
fasta = "tests/golden/116/BDGP6.54-fly/reference.fa.gz"

[run]
flags = ["--plugin", "MaxEntScan,{stage}/fordownload_synthetic,verbose"]

# Ensembl VEP scores the downstream intron's donor 9-mer, vep-rs the upstream intron's acceptor 23-mer.
[compare]
kind = "rows"
where = { record = "fly_two_base_exon", feature = "FBtr0331199" }
columns = ["Location", "Allele", "Feature", "MaxEntScan_ref_seq", "MaxEntScan_alt_seq"]

[expected]
ensembl_vep = ["2L:21019776 | G | FBtr0331199 | GATGTGGCA | GACGTGGCA"]
vep_rs = ["2L:21019776 | G | FBtr0331199 | GGTGAGAGAGTGAGGAAGAGATG | GGTGAGAGAGTGAGGAAGAGACG"]
