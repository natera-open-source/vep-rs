entry = "minimal_check_frequency_no_row_split_record"
page = "docs/output/known-variants.md#filtering-by-frequency"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "malformed"
input_class_basis = "ALT is a \"Comma separated list of alternate non-reference alleles\" (VCF 4.2 specification, section 1.4.1 \"Fixed fields\", ALT): the record's ALT list carries an allele identical to its REF allele"
notes = "GG *,GG splits into a GG/* feature and a -/- feature, neither of which writes a row. The common rs8131855 on the next line is dropped inside the same unit of both engines (Ensembl VEP's one chunk of int(4 / 2) records under --fork 1, vep-rs's batch of four lines), so the rejoin is reset: Ensembl VEP writes one VCF line per feature, vep-rs one for the record."

[input]
format = "vcf"
text = """
21	34716326	nullsplit	GG	*,GG	.	.	.
21	38441162	drop	A	G	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-everything/json_cache"

[run]
flags = ["--minimal", "--check_frequency", "--freq_pop", "AF", "--freq_freq", "0.01", "--freq_gt_lt", "gt", "--freq_filter", "exclude"]
format = "vcf"
buffer_size = 4

[compare]
kind = "vcf"
line = true
where = { record = "nullsplit" }

[expected]
ensembl_vep = [
  "21\t34716326\tnullsplit\tGG\t*,GG\t.\t.\t.",
  "21\t34716326\tnullsplit\tGG\t*,GG\t.\t.\t.",
]
vep_rs = ["21\t34716326\tnullsplit\tGG\t*,GG\t.\t.\t."]
