entry = "minimal_plugin_value_follows_first_allele"
page = "docs/plugins/ancestral-allele.md#1-the-ancestral-allele-printed-for-a-later-allele-of-a---minimal-split-record"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 90.9 per million · 0 flag sets, 22 corpora"
notes = "Under --minimal the record is G/-/GT at 21:42750001; the GT allele trims to the insertion of T over an empty span, which the plugin's rule values -."

[input]
format = "vcf"
text = """
21	42750000	anc_multi_indel	TG	T,TGT	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-ancestral/json_cache"

[run]
flags = ["--plugin", "AncestralAllele,{corpus}/ancestral/homo_sapiens_ancestor_21.slice.fa.gz", "--minimal"]

[compare]
kind = "field"
field = "AA"
where = { record = "anc_multi_indel", allele = "T", feature = "ENST00000291539" }

[expected]
ensembl_vep = ["G"]
vep_rs = ["-"]

[implementation]
code = [
    "crates/vep-builtins/src/plugins/ancestral_allele.rs::Source::ancestral_allele",
    "crates/vep-core/src/minimal.rs::apply_minimal_split",
]
tests = [
    "crates/vep-cli/tests/plugin_documented_rows.rs::a_later_allele_of_a_minimal_split_record_carries_the_ancestral_allele_of_its_own_span",
]
