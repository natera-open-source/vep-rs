entry = "minimal_same_trimmed_allele"
page = "docs/divergences/minimal-same-trimmed-allele.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "unobserved"
input_class_basis = "well-formed under the VCF 4.2 specification, section 1.4.1 \"Fixed fields\" (REF and ALT: a multi-allelic record of distinct multi-base alleles) and the Ensembl VEP documentation, \"Running Ensembl VEP\", --minimal; not seen in the measured datasets"
notes = "The second and third alternate alleles trim to the allele string T at different positions and share Ensembl VEP's rejoin key, so the third allele's rows replace the second's, its stop_gained among them."

[input]
format = "vcf"
text = """
21	10542414	collide	AA	CA,TA,AT	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-identifiers/json_cache"

[run]
flags = ["--minimal", "--allele_number"]
format = "default"

[compare]
kind = "rows"
where = { record = "collide", feature = "ENST00000622113" }
columns = ["Location", "Allele", "Feature", "Consequence", "ALLELE_NUM"]

[expected]
ensembl_vep = [
  "21:10542414-10542415 | C | ENST00000622113 | missense_variant | 1",
  "21:10542414-10542415 | T | ENST00000622113 | missense_variant | 3",
]
vep_rs = [
  "21:10542414-10542415 | C | ENST00000622113 | missense_variant | 1",
  "21:10542414-10542415 | T | ENST00000622113 | stop_gained | 2",
  "21:10542414-10542415 | T | ENST00000622113 | missense_variant | 3",
]
