entry = "minimal_split_hgvsp"
page = "docs/divergences/minimal-split-hgvsp.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "observed"
input_class_basis = "2 · 156.8 per million · 0 flag sets, 28 corpora"
notes = "The first mechanism of the entry: the split deletion allele shifts one base into exon 6 of CLIC6 for its HGVS notations; Ensembl VEP's default output keeps the shifted peptides and recomputes the HGVSp over the record's span, which reaches the intron, so it prints amino acids and no HGVSp."

[input]
format = "vcf"
text = """
21	34716319	multi_del_two	AGATT	AGATC,A	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-vcf-check-ref/json_cache"
fasta = "tests/golden/116/GRCh38-vcf-check-ref/reference.fa.gz"

[run]
flags = ["--minimal", "--hgvs"]
format = "default"

[compare]
kind = "rows"
where = { record = "multi_del_two", allele = "-", feature = "ENST00000349499" }
columns = ["Location", "Allele", "Feature", "Amino_acids", "HGVSp"]

[expected]
ensembl_vep = ["21:34716320-34716323 | - | ENST00000349499 | IV/X | -"]
vep_rs = ["21:34716320-34716323 | - | ENST00000349499 | - | ENSP00000290332.4:p.Ile634TrpfsTer14"]
