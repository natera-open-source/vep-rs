entry = "minimal_symbolic_alleles"
page = "docs/divergences/minimal-symbolic-alleles.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 1.7 per million · 9 flag sets, 8 corpora"
notes = "Ensembl VEP trims <DEL>/<DUP> as two sequences to EL/UP over a span two bases later at the start and one earlier at the end, and marks the record MINIMISED; vep-rs annotates the record's own span."

[input]
format = "vcf"
text = """
21	10542400	del_dup	N	<DEL>,<DUP>	.	.	SVTYPE=DEL;END=10542450
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-vcf-minimal/json_cache"

[run]
flags = ["--minimal", "--allele_number", "--uploaded_allele", "--variant_class"]

[compare]
kind = "rows"
where = { record = "del_dup", feature = "ENST00000427445" }
columns = ["Location", "Allele", "ALLELE_NUM", "cDNA_position", "MINIMISED", "OverlapBP"]

[expected]
ensembl_vep = [
  "21:10542403-10542449 | copy_number_variation | 1 | 426-? | 1 | 47",
  "21:10542403-10542449 | copy_number_variation | 2 | 426-? | 1 | 47",
]
vep_rs = [
  "21:10542401-10542450 | copy_number_variation | 1 | 424-? | - | 50",
  "21:10542401-10542450 | copy_number_variation | 2 | 424-? | - | 50",
]

[implementation]
code = [
    "crates/vep-core/src/minimal.rs::apply_minimal_split",
    "crates/vep-core/src/minimal.rs::minimise_bi_allelic",
]
tests = ["crates/vep-core/src/minimal.rs::tests::a_bi_allelic_record_is_trimmed_and_marked"]
