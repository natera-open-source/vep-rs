[run]
flags = ["--regulatory"]

[compare]
kind = "rows"
where = { record = ["rev_mnv_start", "rev_mnv_inside"], feature = "ENSM00000574815" }
columns = ["Uploaded_variation", "Feature", "MOTIF_POS", "MOTIF_SCORE_CHANGE"]

[expected]
