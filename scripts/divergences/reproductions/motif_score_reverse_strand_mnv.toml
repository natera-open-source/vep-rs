notes = "Two-base alleles over the reverse-strand motif ENSM00000574815 (positions 5090723 to 5090738): one inside it, one over its last two positions."

[input]
format = "vcf"
text = """
21	5090723	rev_mnv_start	CA	TT	.	.	.
21	5090730	rev_mnv_inside	CT	AG	.	.	.
"""

