entry = "nearest_exon_jb_stretch_priming"
page = "docs/plugins/transcript-model.md#3-nearestexonjb-a-value-on-an-upstream-or-downstream-row-that-depends-on-the-records-before-it"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "observed"
input_class_basis = "2 · 78 of 77,601 cache transcripts · 2 flag sets, 12 corpora"

# ENST00000624847 (forward strand) has 2-base introns at 6358575-6358576 and 6358739-6358740; its first exon spans
# 6354264-6354522. The first record is nine bases before that exon, the second inside the first short intron:
# in position order the record that primes Ensembl VEP's stretch comes after the one that needs it.
[input]
format = "vcf"
text = """
21	6354255	nine_before_first_exon	G	T	.	.	.
21	6358575	in_first_short_intron	G	T	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-ancestral/json_cache"

[run]
flags = ["--plugin", "NearestExonJB"]

[compare]
kind = "rows"
where = { record = "nine_before_first_exon", feature = "ENST00000624847" }
columns = ["Location", "Allele", "Feature", "Consequence", "DISTANCE", "NearestExonJB"]

[expected]
ensembl_vep = ["21:6354255 | T | ENST00000624847 | upstream_gene_variant | 9 | -"]
vep_rs = ["21:6354255 | T | ENST00000624847 | upstream_gene_variant | 9 | ENSE00003757672|9|start|259"]
