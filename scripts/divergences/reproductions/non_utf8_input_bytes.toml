entry = "non_utf8_input_bytes"
page = "docs/divergences/non-utf8-input.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "unobserved"
input_class_basis = "well-formed under the GFF3 specification, \"Description of the Format\" (any character set; UTF-8 recommended), and under the VCF 4.2 text format, which names no encoding; not seen in the measured datasets; classed by its most reachable shape, a byte that is not UTF-8 in a GFF attribute value: in a VCF 4.3 file it breaks section 1.2, which sets UTF-8"
notes = "The ID column carries the Latin-1 byte 0xE9, which is not UTF-8: Ensembl VEP writes the byte as read in Uploaded_variation; vep-rs prints U+FFFD for it."
# The byte cannot be written in TOML text, so the record is built here.
prepare = [
  "printf '##fileformat=VCFv4.2\\n#CHROM\\tPOS\\tID\\tREF\\tALT\\tQUAL\\tFILTER\\tINFO\\n21\\t30289183\\tcaf\\351\\tC\\tG\\t.\\t.\\t.\\n' > \"$STAGE/latin1.vcf\"",
]

[input]
format = "vcf"
path = "{stage}/latin1.vcf"

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-vcf-edge-cases/json_cache"
chromosomes = ["21"]

[run]
flags = []
format = "default"

[compare]
kind = "field"
field = "Uploaded_variation"
where = { location = "21:30289183", feature = "ENST00000416044" }

[expected]
ensembl_vep = ["caf\\xe9"]
vep_rs = ["caf\uFFFD"]
