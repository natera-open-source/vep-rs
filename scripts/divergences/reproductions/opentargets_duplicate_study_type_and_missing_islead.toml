entry = "opentargets_duplicate_study_type_and_missing_islead"
page = "docs/divergences/opentargets-duplicate-study-type-and-missing-islead.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "unobserved"
input_class_basis = "well-formed under the OpenTargets plugin's header: study_types can be all, QTL or a colon-separated list of study types found in the file, with no sentence against QTL as a list item or a repeated item, and the header names no column that its data file must carry; not seen in the measured datasets"
notes = "Of the two shapes the entry names this reproduces the first, `study_types=QTL:QTL` on the committed export: Ensembl VEP writes `Failed to instantiate plugin OpenTargets: Not an ARRAY reference` to its warnings file and no row carries an OpenTargets_ field, vep-rs the QTL columns of the record's lead sQTL association. The second, an export whose header lacks `isLead` under the default filter, differs in the header lines alone: Ensembl VEP prints the five `## OpenTargets_` lines over rows without a field, vep-rs refuses the plugin as it loads."

[input]
format = "vcf"
text = """
21	15551809	ot_sqtl_lead_gwas_nonlead_empty_cells	G	A	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-opentargets/json_cache"

[run]
flags = ["--plugin", "OpenTargets,file={corpus}/open_targets_vep.slice.tsv.gz,study_types=QTL:QTL"]

[compare]
kind = "rows"
where = { record = "ot_sqtl_lead_gwas_nonlead_empty_cells", feature = ["ENST00000634644", "ENST00000634708"] }
columns = ["Location", "Allele", "Feature", "OpenTargets_qtlBiosampleName", "OpenTargets_qtlGeneId"]

[expected]
ensembl_vep = [
  "21:15551809 | A | ENST00000634644 | - | -",
  "21:15551809 | A | ENST00000634708 | - | -",
]
vep_rs = [
  "21:15551809 | A | ENST00000634644 | dorsolateral prefrontal cortex | ENSG00000229425",
  "21:15551809 | A | ENST00000634708 | dorsolateral prefrontal cortex | ENSG00000229425",
]
