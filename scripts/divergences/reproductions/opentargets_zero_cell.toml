entry = "opentargets_zero_cell"
page = "docs/plugins/annotation-store-divergences.md#8-opentargets-a-cell-of-0"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "unobserved"
input_class_basis = "well-formed under the OpenTargets plugin's header, which describes the data file (the tabix-indexed Open Targets export) and sets no rule for the text of a cell, so a cell of 0 is a value the file may state; not seen in the measured datasets"
# The committed export with the one gwasLocusToGeneScore cell that reads 0.84708172082901 (the record at 21:14979687) written 0.
prepare = [
  "zcat \"$CORPUS/open_targets_vep.slice.tsv.gz\" | sed 's/\t0.84708172082901\t/\t0\t/' | bgzip -c > \"$STAGE/open_targets_zero.tsv.gz\" && tabix -s 1 -b 2 -e 2 \"$STAGE/open_targets_zero.tsv.gz\"",
]

[input]
format = "vcf"
text = """
21	14979687	ot_gwas_insertion_lead	G	GT	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-opentargets/json_cache"

[run]
flags = ["--plugin", "OpenTargets,file={stage}/open_targets_zero.tsv.gz"]

[compare]
kind = "field"
field = "OpenTargets_gwasLocusToGeneScore"
where = { record = "ot_gwas_insertion_lead", feature = "ENST00000318948" }

[expected]
ensembl_vep = ["NA"]
vep_rs = ["0"]
