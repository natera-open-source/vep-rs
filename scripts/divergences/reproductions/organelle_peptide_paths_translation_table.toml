    "crates/vep-effects/src/concordance_tests.rs::concordance_hgvsp_h23_mitochondrial_frameshift_peptides_follow_the_codon_table",
    "crates/vep-effects/src/concordance_tests.rs::concordance_hgvsp_h24_mitochondrial_codon_duplication_reads_the_codon_table",
    "crates/vep-effects/src/concordance_tests.rs::concordance_hgvsp_h25_mitochondrial_stop_loss_extension_counts_to_the_tables_stop",
    "crates/vep-effects/src/concordance_tests.rs::concordance_hgvsp_h26_invertebrate_mitochondrial_table_drives_the_peptide_paths",
]
rules = [
    "tools/vep-formats-compare/src/rules/downstream.rs::organelle_peptide_path",
