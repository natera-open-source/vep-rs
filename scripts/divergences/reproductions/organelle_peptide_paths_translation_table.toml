    "crates/vep-effects/src/coding.rs::hgvsp_check_duplication",
    "crates/vep-effects/src/coding.rs::hgvsp_del_peptides",
    "crates/vep-effects/src/coding.rs::hgvsp_fs_peptides",
    "crates/vep-effects/src/coding.rs::hgvsp_stop_loss_extra_aa",
]
