input_class = "observed"
input_class_basis = "2 · 298 of 2,173 records on a sequence region under another codon table · 95 flag sets, 21 corpora"
notes = "The frameshift path, the first of the entry's four: deleting the eighth base of MT-ND1 turns codon 3 into AGG, a stop under the vertebrate mitochondrial code (table 2) and arginine under the standard one."

[input]
format = "vcf"
text = """
MT	3313	mt_nd1_c8del	AT	A	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-input-hgvs/json_cache"
fasta = "tests/golden/116/GRCh38-input-hgvs/reference.fa.gz"

[run]
flags = ["--hgvs"]

[compare]
kind = "rows"
where = { record = "mt_nd1_c8del", feature = "ENST00000361390" }
columns = ["Consequence", "Protein_position", "Amino_acids", "Codons", "HGVSp"]

[expected]
ensembl_vep = ["frameshift_variant | 3 | M/X | aTg/ag | ENSP00000354687.2:p.Met3ArgfsTer12"]
vep_rs = ["frameshift_variant | 3 | M/X | aTg/ag | ENSP00000354687.2:p.Met3Ter"]

[implementation]
