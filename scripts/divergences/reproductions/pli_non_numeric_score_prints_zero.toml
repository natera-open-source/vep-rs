entry = "pli_non_numeric_score_prints_zero"
page = "docs/plugins/flat-file.md#6-pli-a-table-cell-that-is-not-a-number"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "unobserved"
input_class_basis = "well-formed under the pLI plugin's header, which names the gnomAD v4 constraint table as a source for the values file, a table whose pLI column writes NA where a gene has no estimate; not seen in the measured datasets"
# The corpus table with CXADR's cell written NA.
prepare = [
  "sed 's/^CXADR\t.*/CXADR\tNA/' \"$CORPUS/plugin_data/pLI_values.txt\" > \"$STAGE/pLI_values_NA.txt\"",
]

[input]
format = "vcf"
text = """
21	17561425	4453310	G	T	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-pli/json_cache"

[run]
flags = ["--plugin", "pLI,{stage}/pLI_values_NA.txt"]

[compare]
kind = "field"
field = "pLI_gene_value"
where = { record = "4453310", feature = "ENST00000284878" }

[expected]
ensembl_vep = ["0.00"]
vep_rs = ["-"]

[implementation]
code = [
    "crates/vep-builtins/src/plugins/gene_scores.rs::ScoreTable::load",
    "crates/vep-builtins/src/plugins/pli.rs::PliPlugin::init",
]
tests = [
    "crates/vep-builtins/src/plugins/gene_scores.rs::tests::a_bare_key_follows_the_modules_split",
    "crates/vep-builtins/src/plugins/gene_scores.rs::tests::lines_without_a_numeric_score_are_no_entry_and_a_word_is_warned_about",
]
