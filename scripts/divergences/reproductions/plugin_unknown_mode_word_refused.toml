entry = "plugin_unknown_mode_word_refused"
page = "docs/divergences/plugin-unknown-mode-word-refused.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "unobserved"
input_class_basis = "well-formed under the Conservation plugin's header, which names the MAX parameter and sets no rule for a word after it; not seen in the measured datasets; classed by its most reachable shape, a word after MAX: a LOEUF match_by of another word breaks \"matching by either transcript or gene\" (the LOEUF plugin's header)"
notes = "LOEUF under `match_by=exon`, a word outside its set: Ensembl VEP stores the word, loads the plugin and prints its header line, then returns nothing on every row; vep-rs refuses the plugin with `LOEUF: match_by must be gene or transcript, not 'exon'` and prints no header line. The same shape under pLI's mode word (`pLI,<file>,exon`) and under a word after Conservation's `MAX` (`Conservation,<file>,MAX,foo`) is on the page."

[input]
format = "vcf"
text = """
21	26112000	app_exon	G	A	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-loeuf/json_cache"

[run]
flags = ["--plugin", "LOEUF,file={corpus}/data/loeuf_dataset_grch38.tsv.gz,match_by=exon"]

[compare]
kind = "header"
pattern = "^## LOEUF : "

[expected]
ensembl_vep = ["## LOEUF : Loss-of-function observed/expected upper bound fraction"]
vep_rs = []

[implementation]
code = [
    "crates/vep-builtins/src/plugins/conservation.rs::ConservationPlugin::init",
    "crates/vep-builtins/src/plugins/loeuf.rs::LoeufPlugin::init",
    "crates/vep-builtins/src/plugins/pli.rs::PliPlugin::init",
]
tests = [
    "crates/vep-builtins/src/plugins/loeuf.rs::tests::match_by_outside_gene_or_transcript_is_an_init_error",
    "crates/vep-cli/tests/plugin_unknown_mode_word.rs::conservation_word_after_max_is_refused",
    "crates/vep-cli/tests/plugin_unknown_mode_word.rs::loeuf_match_by_outside_gene_and_transcript_is_refused",
    "crates/vep-cli/tests/plugin_unknown_mode_word.rs::pli_mode_outside_gene_and_transcript_is_refused",
]
