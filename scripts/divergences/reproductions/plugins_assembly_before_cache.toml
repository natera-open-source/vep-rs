input_class_basis = "well-formed under the Ensembl VEP documentation, \"Running Ensembl VEP\", --assembly (default: the assembly found); not seen in the measured datasets; classed by its most reachable shape, PrimateAI with no --assembly: REVEL without it breaks \"The --assembly flag is required to use this plugin\" (the REVEL plugin's header)"
notes = "REVEL, the first plugin the entry names, with no --assembly on either command line; the cache names GRCh37."

