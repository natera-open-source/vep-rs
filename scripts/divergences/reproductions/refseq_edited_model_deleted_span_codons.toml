entry = "refseq_edited_model_deleted_span_codons"
page = "docs/divergences/refseq-edited-model-deleted-span-codons.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "observed"
input_class_basis = "2 · 8 of 77,675 cache transcripts · 10 flag sets, 4 corpora"
notes = "NM_030582.4 and NM_130444.3 lack the nine genomic bases 21:45504526-45504534; the seventeen-base deletion holds eight coding positions of each, so Ensembl VEP's reference codons end in the genome's C and vep-rs's in the models' A."

[input]
format = "vcf"
text = """
21	45504518	rs1179352929	CCAGGCCCCCCAGGCCCA	C	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
source = "refseq"
json_cache = "tests/golden/116/GRCh38-refseq/cache_root/homo_sapiens_refseq/116_GRCh38"
corpus = "tests/golden/116/GRCh38-refseq"
fasta = "tests/golden/116/GRCh38-refseq/reference.fa.gz"

[run]
flags = ["--refseq"]

[compare]
kind = "field"
field = "Codons"
with_key = true
where = { record = "rs1179352929", feature = ["NM_030582.4", "NM_130444.3"] }

[expected]
ensembl_vep = ["NM_030582.4=cCAGGCCCC/c", "NM_130444.3=cCAGGCCCC/c"]
vep_rs = ["NM_030582.4=cCAGGCCCA/c", "NM_130444.3=cCAGGCCCA/c"]
