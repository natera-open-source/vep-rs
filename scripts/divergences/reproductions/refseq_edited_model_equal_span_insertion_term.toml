entry = "refseq_edited_model_equal_span_insertion_term"
page = "docs/divergences/refseq-edited-model-equal-span-insertion-term.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 16 of 116,165 cache transcripts · 19 flag sets, 4 corpora"
notes = "ClinVar record 551063 inserts three bases between 2:73385942 and 2:73385943, where the forward-strand model NM_015120.4 carries the insertion edit `186 185` of three bases. Both engines print the span of those bases, CDS 75-77 in the codons of residues 25 and 26. Three bases standing on three keep the length and change one residue: Ensembl VEP classes the allele by its genomic span as a longer one, does not ask missense_variant of it and writes the default term, and vep-rs writes missense_variant. ClinVar record 1167157, two bases at the same point, is frameshift_variant on both engines. No committed cache holds a model with such bases inside its coding sequence, so the prepare step copies the one region file of the Ensembl VEP RefSeq cache that holds the model and converts it with tools/vep-storable-to-json; --use_given_ref lets both engines read the edited cache without a FASTA."
# The region file 2/73000001-74000000 of the Ensembl VEP RefSeq cache, converted into the cache vep-rs reads.
prepare = [
  '''mkdir -p "$STAGE/perl-cut/2" "$STAGE/json-cache"
cp "$PERL_CACHE/info.txt" "$PERL_CACHE/chr_synonyms.txt" "$STAGE/perl-cut/"
cp "$PERL_CACHE/2/73000001-74000000.gz" "$STAGE/perl-cut/2/"
cargo run --release --locked --quiet --manifest-path "$REPO/tools/vep-storable-to-json/Cargo.toml" -- "$STAGE/perl-cut" "$STAGE/json-cache" 2 > "$STAGE/convert.log" 2>&1 || { tail -n 1 "$STAGE/convert.log" >&2; exit 1; }''',
]

[input]
format = "vcf"
text = """
2	73385942	551063	A	AGGC	.	.	.
2	73385942	1167157	A	AGG	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
source = "refseq"
json_cache = "{stage}/json-cache"

[run]
flags = ["--refseq", "--use_given_ref"]

[compare]
kind = "rows"
where = { record = ["551063", "1167157"], feature = "NM_015120.4" }
columns = ["Uploaded_variation", "Consequence", "cDNA_position", "CDS_position", "Protein_position", "IMPACT", "BAM_EDIT"]

[expected]
ensembl_vep = [
  "1167157 | frameshift_variant | 186-188 | 75-77 | 25-26 | HIGH | OK",
  "551063 | intergenic_variant | 186-188 | 75-77 | 25-26 | MODIFIER | OK",
]
vep_rs = [
  "1167157 | frameshift_variant | 186-188 | 75-77 | 25-26 | HIGH | OK",
  "551063 | missense_variant | 186-188 | 75-77 | 25-26 | MODERATE | OK",
]

[implementation]
code = ["crates/vep-effects/src/coding.rs::PerlCodingEval::stands_on_as_many_model_bases"]
tests = [
    "crates/vep-effects/src/consequences.rs::tests::insertion_as_long_as_the_edited_model_bases_it_stands_on_is_a_missense_variant",
]
rules = ["tools/vep-formats-compare/src/rules/term_pairs.rs::equal_span_insertion_term_pair"]
