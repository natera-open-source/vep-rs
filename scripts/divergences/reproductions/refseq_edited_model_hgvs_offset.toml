[compare]
kind = "rows"
where = { record = "rs782070127", feature = "NM_198689.3" }
columns = ["Consequence", "BAM_EDIT", "HGVSc", "HGVS_OFFSET"]

[expected]
ensembl_vep = ["inframe_insertion | OK | NM_198689.3:c.986_1006dup | -"]
vep_rs = ["inframe_insertion | OK | NM_198689.3:c.986_1006dup | 21"]

[implementation]
