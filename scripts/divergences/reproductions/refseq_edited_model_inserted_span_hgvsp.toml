entry = "refseq_edited_model_inserted_span_hgvsp"
page = "docs/divergences/refseq-edited-model-inserted-span-hgvsp.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "observed"
input_class_basis = "seen in the genome-wide ClinVar GRCh37 file annotated on the RefSeq GRCh37 cache under --hgvs: variation 768677, one insertion that the 3' shift moves onto the 9 bases five models hold and the genome lacks, 5 rows differing in HGVSp, the file's other insertions not counted"
notes = "ClinVar variation 768677 on GRCh37 inserts 18 bases between 14:94582130 and 14:94582131. Five RefSeq models of gene 3429 (NM_001130080.3, NM_001288952.2, NM_001288956.2, NM_001366993.1 and NM_001366994.1) hold 9 bases the genome lacks after 14:94582133, their coding bases 129 to 137, and under --hgvs the 3' shift moves the insertion three bases on, onto them: both engines print HGVS_OFFSET=3, CDS_position 125-126 and Protein_position 42. Ensembl VEP reads the reference peptide of the protein notation from the coding sequence with those 9 bases cut out (TranscriptVariationAllele.pm:873, at the shifted span), so its `delins` at 44 to 46 names there the model's residues 47 and 49 and ends in six residues; vep-rs reads the model's own residues and writes the `dup` of 44 to 46. The six residues after `delins` are masked in the compared value. The HGVSc of the same rows differs through the mechanism of refseq_edited_model_seam_insertion_hgvsc and is not compared. No committed cache holds a model with such bases inside its coding sequence, so the first step copies info.txt and one region file from the RefSeq GRCh37 cache under the --perl-cache-dir roots and the second converts them with scripts/data/storable_to_json.pl in the image the run names; both engines read that cut. The third step writes the record from the cached model NM_001130080.3: after the base at 14:94582130 it inserts the model's 9 added bases turned back by three, twice, which is the record as the ClinVar GRCh37 file spells it. --hgvs needs a FASTA offline and the tree commits none of chromosome 14, so the run is given the directory of the GRCh37 primary assembly as --extra-dir grch37_fasta=<directory>."

prepare = [
  '''[ -n "$IMAGE" ] || { echo "the cut of the RefSeq cache is converted in the Ensembl VEP image: pass --image" >&2; exit 1; }
[ -n "$PERL_CACHE" ] || { echo "no homo_sapiens_refseq/116_GRCh37 with chromosome 14 under the --perl-cache-dir roots" >&2; exit 1; }
cut="$STAGE/perl-cache/homo_sapiens_refseq/116_GRCh37"
mkdir -p "$cut/14"
cp "$PERL_CACHE/info.txt" "$cut/info.txt"
cp "$PERL_CACHE/14/94000001-95000000.gz" "$cut/14/"''',
  '''docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$REPO/scripts/data:/scripts:ro" -v "$STAGE:/stage" "$IMAGE" perl /scripts/storable_to_json.pl /stage/perl-cache/homo_sapiens_refseq/116_GRCh37 /stage/json-cache/homo_sapiens_refseq/116_GRCh37 > "$STAGE/convert.log" 2>&1 || { tail -n 1 "$STAGE/convert.log" >&2; exit 1; }''',
  '''python3 - "$STAGE/json-cache/homo_sapiens_refseq/116_GRCh37/transcripts/14/94000001-95000000.json" "$STAGE/record.vcf" <<'PY'
import json
import sys

with open(sys.argv[1]) as fh:
    model = next(t for t in json.load(fh) if t["stable_id"] == "NM_001130080.3")
cached = model["variation_effect_feature_cache"]
pairs = [(p["from_start"], p["from_end"], p["to_start"], p["to_end"]) for p in cached["mapper"]["pairs"]]
if (242, 248, 94582127, 94582133) not in pairs or (258, 403, 94582134, 94582279) not in pairs:
    sys.exit(f"the model's exon at the point is mapped otherwise: {pairs}")
cdna = cached["spliced_seq"].upper()
added = cdna[248:257]
if added[6:] != cdna[245:248]:
    sys.exit("the model's added bases do not end in the three genomic bases before them")
inserted = (added[6:] + added[:6]) * 2
with open(sys.argv[2], "w") as out:
    out.write("##fileformat=VCFv4.2\n#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\n")
    out.write(f"14\t94582130\t768677\t{cdna[244]}\t{cdna[244]}{inserted}\t.\t.\t.\n")
PY''',
]

[input]
format = "vcf"
path = "{stage}/record.vcf"

[cache]
species = "homo_sapiens"
assembly = "GRCh37"
source = "refseq"
json_cache = "{stage}/json-cache/homo_sapiens_refseq/116_GRCh37"
perl_cache = "{stage}/perl-cache"
chromosomes = ["14"]

[run]
flags = [
  "--refseq",
  "--hgvs",
  "--fasta", "{grch37_fasta}/Homo_sapiens.GRCh37.75.dna.primary_assembly.fa",
]

[compare]
kind = "rows"
where = { record = "768677", feature = ["NM_001130080.3", "NM_001288952.2", "NM_001288956.2", "NM_001366993.1", "NM_001366994.1"] }
columns = ["Feature", "Consequence", "CDS_position", "Protein_position", "HGVS_OFFSET", "HGVSp"]
# The six residues that end Ensembl VEP's notation.
mask = ["(?<=delins)(?:[A-Z][a-z]{2}){6}$"]

[expected]
ensembl_vep = [
  "NM_001130080.3 | inframe_insertion | 125-126 | 42 | 3 | NP_001123552.1:p.Val44_Met46delins<masked>",
  "NM_001288952.2 | inframe_insertion | 125-126 | 42 | 3 | NP_001275881.1:p.Val44_Met46delins<masked>",
  "NM_001288956.2 | inframe_insertion | 125-126 | 42 | 3 | NP_001275885.1:p.Val44_Met46delins<masked>",
  "NM_001366993.1 | inframe_insertion | 125-126 | 42 | 3 | NP_001353922.1:p.Val44_Met46delins<masked>",
  "NM_001366994.1 | inframe_insertion | 125-126 | 42 | 3 | NP_001353923.1:p.Val44_Met46delins<masked>",
]
vep_rs = [
  "NM_001130080.3 | inframe_insertion | 125-126 | 42 | 3 | NP_001123552.1:p.Met44_Ala46dup",
  "NM_001288952.2 | inframe_insertion | 125-126 | 42 | 3 | NP_001275881.1:p.Met44_Ala46dup",
  "NM_001288956.2 | inframe_insertion | 125-126 | 42 | 3 | NP_001275885.1:p.Met44_Ala46dup",
  "NM_001366993.1 | inframe_insertion | 125-126 | 42 | 3 | NP_001353922.1:p.Met44_Ala46dup",
  "NM_001366994.1 | inframe_insertion | 125-126 | 42 | 3 | NP_001353923.1:p.Met44_Ala46dup",
]
