entry = "refseq_edited_model_own_bases_insertion_term"
page = "docs/divergences/refseq-edited-model-own-bases-insertion-term.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "unobserved"
input_class_basis = "well-formed under the VCF 4.2 specification, section 1.4.1 \"Fixed fields\", and the --refseq option, which reads the RefSeq cache (Ensembl VEP documentation, \"Running Ensembl VEP\", --refseq); not seen in the measured datasets"
notes = "NM_002111.8 carries the edit `256 255` with six bases, so an insertion written between 4:3074935 and 4:3074936 stands on cDNA 256-261, CDS 111-116, residues 37-39. The first record inserts those six bases themselves: the alternate coding sequence is the model's, no residue changes, and vep-rs writes synonymous_variant. Ensembl VEP writes the insertion's empty reference allele over the span before it reads the reference codons (TranscriptVariationAllele.pm:872-874, 877), so its reference window is CDS 109-110 then 117-123 and its third residue differs from the alternate's. synonymous_variant refuses (VariationEffect.pm:1082), missense_variant is not asked of an insertion (Constants.pm:886-890), and with no predicate true the default term is written (BaseVariationFeatureOverlapAllele.pm:285). NM_015120.4 carries `186 185` with three bases; the second record inserts them between 2:73385942 and 2:73385943, on CDS 75-77, where Ensembl VEP's window translates as the model's does and both engines write synonymous_variant. On NM_001388492.1 and NM_001378454.1, models of the same two genes without those bases, both engines write inframe_insertion. No committed cache holds a model with such bases inside its coding sequence, so the first step copies info.txt and two region files from the RefSeq GRCh38 cache under the --perl-cache-dir roots and the second converts them with scripts/data/storable_to_json.pl in the image the run names; both engines read that cut. Both engines refuse a BAM-edited cache without --fasta unless --use_given_ref is passed (Runner.pm:762), and the tree commits no FASTA of chromosomes 2 and 4: the flag leaves an insertion's reference allele empty, as it is without it, and Ensembl VEP's `Transcript-assembly mismatch` warning on the first record is written only without it (OutputFactory.pm:1717)."

prepare = [
  '''[ -n "$IMAGE" ] || { echo "the cut of the RefSeq cache is converted in the Ensembl VEP image: pass --image" >&2; exit 1; }
[ -n "$PERL_CACHE" ] || { echo "no homo_sapiens_refseq/116_GRCh38 with chromosomes 2 and 4 under the --perl-cache-dir roots" >&2; exit 1; }
cut="$STAGE/perl-cache/homo_sapiens_refseq/116_GRCh38"
mkdir -p "$cut/2" "$cut/4"
cp "$PERL_CACHE/info.txt" "$cut/info.txt"
cp "$PERL_CACHE/2/73000001-74000000.gz" "$cut/2/"
cp "$PERL_CACHE/4/3000001-4000000.gz" "$cut/4/"''',
  '''docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$REPO/scripts/data:/scripts:ro" -v "$STAGE:/stage" "$IMAGE" perl /scripts/storable_to_json.pl /stage/perl-cache/homo_sapiens_refseq/116_GRCh38 /stage/json-cache/homo_sapiens_refseq/116_GRCh38 > "$STAGE/convert.log" 2>&1 || { tail -n 1 "$STAGE/convert.log" >&2; exit 1; }''',
]

[input]
format = "vcf"
text = """
4	3074935	own_bases_4_3074935	A	AGCAGCA	.	.	.
2	73385942	own_bases_2_73385942	A	AGGA	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
source = "refseq"
json_cache = "{stage}/json-cache/homo_sapiens_refseq/116_GRCh38"
perl_cache = "{stage}/perl-cache"

[run]
flags = ["--refseq", "--use_given_ref"]

[compare]
kind = "rows"
where = { record = ["own_bases_4_3074935", "own_bases_2_73385942"], feature = ["NM_002111.8", "NM_001388492.1", "NM_015120.4", "NM_001378454.1"] }
columns = ["Feature", "Consequence", "cDNA_position", "CDS_position", "Protein_position", "Amino_acids", "IMPACT", "BAM_EDIT"]

[expected]
ensembl_vep = [
  "NM_001378454.1 | inframe_insertion | 107-108 | 74-75 | 25 | E/EE | MODERATE | -",
  "NM_001388492.1 | inframe_insertion | 255-256 | 110-111 | 37 | Q/QQQ | MODERATE | -",
  "NM_002111.8 | intergenic_variant | 256-261 | 111-116 | 37-39 | QQP/QQQ | MODIFIER | OK",
  "NM_015120.4 | synonymous_variant | 186-188 | 75-77 | 25-26 | EE | LOW | OK",
]
vep_rs = [
  "NM_001378454.1 | inframe_insertion | 107-108 | 74-75 | 25 | E/EE | MODERATE | -",
  "NM_001388492.1 | inframe_insertion | 255-256 | 110-111 | 37 | Q/QQQ | MODERATE | -",
  "NM_002111.8 | synonymous_variant | 256-261 | 111-116 | 37-39 | QQQ | LOW | OK",
  "NM_015120.4 | synonymous_variant | 186-188 | 75-77 | 25-26 | EE | LOW | OK",
]
