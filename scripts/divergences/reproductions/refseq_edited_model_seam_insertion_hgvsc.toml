entry = "refseq_edited_model_seam_insertion_hgvsc"
page = "docs/divergences/refseq-edited-model-seam-insertion-hgvsc.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 49 of 116,165 cache transcripts · 7 flag sets, 7 corpora"
notes = "Five records under one run, the entry's three forms. Written on such bases inside a coding sequence: one base, and the ClinVar records 551063 (three bases) and 1167157 (two bases), inserted between 2:73385942 and 2:73385943, where the forward-strand model NM_015120.4 carries the insertion edit `186 185` of three bases. Both engines print the span of those bases, CDS 75-77. Ensembl VEP builds the notation on the genome, where the insertion lies between neighbours, slides both positions three bases along it and numbers them on the unedited exons: an `ins` between c.77 and c.78 on all three rows. vep-rs describes the allele against the model's bases at the span: a replacement over the span for the one base, a substitution at c.77 where the first two inserted bases are the model's own, and a deletion placed 3' at c.78 where both inserted bases are. Written on such bases in an untranslated region: one base inserted between 10:11331456 and 10:11331457, where the forward-strand models NM_001083591.1 and NM_001025076.2 each carry an insertion edit of two bases past their stop codon, `2820 2819` and `2826 2825`. Both engines print the span as the cDNA position and no CDS position. Ensembl VEP slides both positions two bases: an `ins` between c.*1047 and c.*1048. vep-rs writes the two bases, c.*1046 and c.*1047, replaced by the one. Moved onto such bases by the 3' shift: three bases inserted between 2:73385940 and 2:73385941, which the genome lets move 3' by two bases and no further, onto the three bases of NM_015120.4. Both engines print the written point's CDS 72-73 and HGVS_OFFSET 2. Ensembl VEP writes an `ins` of the three bases as the record spells them between c.74 and c.75, numbered on the unedited exon. vep-rs reads the bases, rotated by the shift, in place of the model's three and writes the substitution that is left, at c.75. No committed cache holds a model with such bases inside its coding sequence, or the two models of chromosome 10, so the first prepare step copies the two region files of the Ensembl VEP RefSeq cache that hold the models and converts them with tools/vep-storable-to-json. --hgvs needs a FASTA offline and no committed one holds either place, so the second step writes one: for each chromosome the genomic bases of one exon, read from the model's own sequence without the bases the genome lacks, and N elsewhere."
# The region files 2/73000001-74000000 and 10/11000001-12000000 of the Ensembl VEP RefSeq cache, converted into the
# cache vep-rs reads, and a FASTA of two sequences, N but for the genomic bases of one exon of a model on each: the
# 435 of the first exon of NM_015120.4 on chromosome 2 and the 6,220 of the last exon of NM_001083591.1, which is
# the last exon of NM_001025076.2 as well, on chromosome 10.
prepare = [
  '''mkdir -p "$STAGE/perl-cut/2" "$STAGE/perl-cut/10" "$STAGE/json-cache"
cp "$PERL_CACHE/info.txt" "$PERL_CACHE/chr_synonyms.txt" "$STAGE/perl-cut/"
cp "$PERL_CACHE/2/73000001-74000000.gz" "$STAGE/perl-cut/2/"
cp "$PERL_CACHE/10/11000001-12000000.gz" "$STAGE/perl-cut/10/"
cargo run --release --locked --quiet --manifest-path "$REPO/tools/vep-storable-to-json/Cargo.toml" -- "$STAGE/perl-cut" "$STAGE/json-cache" 2,10 > "$STAGE/convert.log" 2>&1 || { tail -n 1 "$STAGE/convert.log" >&2; exit 1; }''',
  '''python3 - "$STAGE/json-cache/transcripts" "$STAGE/exon_windows.fa" <<'PY'
import json
import sys


def exon_bases(region_file, model_id, pairs):
    """The genomic bases of one exon of a model: its cached sequence at the mapper pairs that cover the exon."""
    with open(f"{sys.argv[1]}/{region_file}.json") as fh:
        model = next(t for t in json.load(fh) if t["stable_id"] == model_id)
    cached = model["variation_effect_feature_cache"]
    mapped = [(p["from_start"], p["from_end"], p["to_start"], p["to_end"]) for p in cached["mapper"]["pairs"]]
    if any(pair not in mapped for pair in pairs):
        sys.exit(f"the exon of {model_id} is mapped otherwise: {mapped}")
    cdna = cached["spliced_seq"].upper()
    return "".join(cdna[first - 1 : last] for first, last, _, _ in pairs)


# A sequence's name and written length, then the mapper pairs of the exon it holds: cDNA first and last, genome first and last.
WINDOWS = [
    ("2", 74000000, "2/73000001-74000000", "NM_015120.4", [(1, 185, 73385758, 73385942), (189, 438, 73385943, 73386192)]),
    (
        "10",
        12000000,
        "10/11000001-12000000",
        "NM_001083591.1",
        [(1819, 2819, 11330456, 11331456), (2822, 4592, 11331457, 11333227), (4594, 8041, 11333228, 11336675)],
    ),
]
offset = 0
with open(sys.argv[2], "w") as out, open(sys.argv[2] + ".fai", "w") as index:
    for name, length, region_file, model_id, pairs in WINDOWS:
        exon = exon_bases(region_file, model_id, pairs)
        first, last = pairs[0][2], pairs[-1][3]
        if len(exon) != last - first + 1:
            sys.exit(f"the pairs of {model_id} leave a gap on the genome")
        chrom = "N" * (first - 1) + exon + "N" * (length - last)
        header = f">{name}\n"
        out.write(header)
        out.writelines(chrom[i : i + 60] + "\n" for i in range(0, length, 60))
        index.write(f"{name}\t{length}\t{offset + len(header)}\t60\t61\n")
        offset += len(header) + length + (length + 59) // 60
PY''',
]

[input]
format = "vcf"
text = """
2	73385940	shifted_onto_the_bases	G	GGAC	.	.	.
2	73385942	seam_one_base	A	AC	.	.	.
2	73385942	551063	A	AGGC	.	.	.
2	73385942	1167157	A	AGG	.	.	.
10	11331456	untranslated_one_base	T	TA	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
source = "refseq"
json_cache = "{stage}/json-cache"
fasta = "{stage}/exon_windows.fa"

[run]
flags = ["--refseq", "--hgvs"]

[compare]
kind = "rows"
where = { record = ["seam_one_base", "551063", "1167157", "untranslated_one_base", "shifted_onto_the_bases"], feature = ["NM_015120.4", "NM_001083591.1", "NM_001025076.2"] }
columns = ["Uploaded_variation", "cDNA_position", "CDS_position", "REFSEQ_OFFSET", "HGVS_OFFSET", "BAM_EDIT", "HGVSc"]

[expected]
ensembl_vep = [
  "1167157 | 186-188 | 75-77 | 3 | - | OK | NM_015120.4:c.77_78insGG",
  "551063 | 186-188 | 75-77 | 3 | - | OK | NM_015120.4:c.77_78insGGC",
  "seam_one_base | 186-188 | 75-77 | 3 | - | OK | NM_015120.4:c.77_78insC",
  "shifted_onto_the_bases | 183-184 | 72-73 | - | 2 | OK | NM_015120.4:c.74_75insGAC",
  "untranslated_one_base | 2820-2821 | - | 2 | - | OK | NM_001083591.1:c.*1047_*1048insA",
  "untranslated_one_base | 2826-2827 | - | 2 | - | OK | NM_001025076.2:c.*1047_*1048insA",
]
vep_rs = [
  "1167157 | 186-188 | 75-77 | 3 | - | OK | NM_015120.4:c.78del",
  "551063 | 186-188 | 75-77 | 3 | - | OK | NM_015120.4:c.77A>C",
  "seam_one_base | 186-188 | 75-77 | 3 | - | OK | NM_015120.4:c.75_77delinsC",
  "shifted_onto_the_bases | 183-184 | 72-73 | - | 2 | OK | NM_015120.4:c.75G>C",
  "untranslated_one_base | 2820-2821 | - | 2 | - | OK | NM_001083591.1:c.*1046_*1047delinsA",
  "untranslated_one_base | 2826-2827 | - | 2 | - | OK | NM_001025076.2:c.*1046_*1047delinsA",
]

[implementation]
code = [
    "crates/vep-effects/src/hgvs.rs::model_bases_between",
    "crates/vep-effects/src/hgvs.rs::place_3prime_on_model",
    "crates/vep-effects/src/hgvs.rs::replaced_model_bases_notation",
]
tests = [
    "crates/vep-effects/src/consequences.rs::tests::hgvsc_of_an_insertion_on_edited_model_bases_names_their_replacement",
    "crates/vep-effects/src/consequences.rs::tests::hgvsc_of_an_insertion_on_edited_model_bases_outside_the_coding_sequence",
    "crates/vep-effects/src/consequences.rs::tests::replaced_model_bases_are_placed_3prime_only_while_the_shift_is_on",
]
rules = [
    "tools/vep-formats-compare/src/rules/edited_model.rs::edited_model_seam_insertion_replacement",
]
