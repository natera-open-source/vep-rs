entry = "refseq_edited_model_seam_insertion_hgvsc"
page = "docs/divergences/refseq-edited-model-seam-insertion-hgvsc.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "observed"
input_class_basis = "2 · 33 of 77,675 cache transcripts · 1 flag set, 3 corpora"
notes = "One base, and the ClinVar records 551063 (three bases) and 1167157 (two bases), inserted between 2:73385942 and 2:73385943, where the forward-strand model NM_015120.4 carries the insertion edit `186 185` of three bases. Both engines print the span of those bases, CDS 75-77. Ensembl VEP builds the notation on the genome, where the insertion lies between neighbours, slides both positions three bases along it and numbers them on the unedited exons: an `ins` between c.77 and c.78 on all three rows. vep-rs describes the allele against the model's bases at the span: a replacement over the span for the one base, a substitution at c.77 where the first two inserted bases are the model's own, and a deletion placed 3' at c.78 where both inserted bases are. No committed cache holds a model with such bases inside its coding sequence, so the first prepare step copies the one region file of the Ensembl VEP RefSeq cache that holds the model and converts it with the Perl of the image, which the run therefore needs. --hgvs needs a FASTA offline and no committed one holds chromosome 2, so the second step writes one: the 435 genomic bases of the model's first exon, read from the model's own sequence without the three added bases, and N elsewhere."
# The region file 2/73000001-74000000 of the Ensembl VEP RefSeq cache, converted into the cache vep-rs reads, and a
# chromosome 2 FASTA of 74,000,000 bases that holds the 435 genomic bases of the model's first exon and N elsewhere.
prepare = [
  '''[ -n "$IMAGE" ] || { echo "the region file is converted with the Perl of the image: pass --image" >&2; exit 1; }
mkdir -p "$STAGE/perl-cut/2" "$STAGE/json-cache"
cp "$PERL_CACHE/info.txt" "$PERL_CACHE/chr_synonyms.txt" "$STAGE/perl-cut/"
cp "$PERL_CACHE/2/73000001-74000000.gz" "$STAGE/perl-cut/2/"
docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$STAGE/perl-cut:/input:ro" -v "$REPO/scripts/data:/scripts:ro" -v "$STAGE/json-cache:/output" "$IMAGE" perl /scripts/storable_to_json.pl /input /output 2 > "$STAGE/convert.log" 2>&1''',
  '''python3 - "$STAGE/json-cache/transcripts/2/73000001-74000000.json" "$STAGE/chr2_exon_window.fa" <<'PY'
import json
import sys

with open(sys.argv[1]) as fh:
    model = next(t for t in json.load(fh) if t["stable_id"] == "NM_015120.4")
cached = model["variation_effect_feature_cache"]
pairs = [(p["from_start"], p["from_end"], p["to_start"], p["to_end"]) for p in cached["mapper"]["pairs"][:2]]
if pairs != [(1, 185, 73385758, 73385942), (189, 438, 73385943, 73386192)]:
    sys.exit(f"the model's first exon is mapped otherwise: {pairs}")
cdna = cached["spliced_seq"].upper()
exon = cdna[:185] + cdna[188:438]
chrom = "N" * 73385757 + exon + "N" * (74000000 - 73386192)
with open(sys.argv[2], "w") as out:
    out.write(">2\n")
    out.writelines(chrom[i : i + 60] + "\n" for i in range(0, len(chrom), 60))
PY
printf '2\t74000000\t3\t60\t61\n' > "$STAGE/chr2_exon_window.fa.fai"''',
]

[input]
format = "vcf"
text = """
2	73385942	seam_one_base	A	AC	.	.	.
2	73385942	551063	A	AGGC	.	.	.
2	73385942	1167157	A	AGG	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
source = "refseq"
json_cache = "{stage}/json-cache"
fasta = "{stage}/chr2_exon_window.fa"

[run]
flags = ["--refseq", "--hgvs"]

[compare]
kind = "rows"
where = { record = ["seam_one_base", "551063", "1167157"], feature = "NM_015120.4" }
columns = ["Uploaded_variation", "CDS_position", "BAM_EDIT", "HGVSc"]

[expected]
ensembl_vep = [
  "1167157 | 75-77 | OK | NM_015120.4:c.77_78insGG",
  "551063 | 75-77 | OK | NM_015120.4:c.77_78insGGC",
  "seam_one_base | 75-77 | OK | NM_015120.4:c.77_78insC",
]
vep_rs = [
  "1167157 | 75-77 | OK | NM_015120.4:c.78del",
  "551063 | 75-77 | OK | NM_015120.4:c.77A>C",
  "seam_one_base | 75-77 | OK | NM_015120.4:c.75_77delinsC",
]
