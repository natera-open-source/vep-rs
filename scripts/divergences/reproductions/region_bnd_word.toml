entry = "region_bnd_word"
page = "docs/divergences/region-input.md#a-bnd-word"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "malformed"
input_class_basis = "Breakends are only supported for VCF input format (Ensembl VEP documentation, \"Data formats\", Structural variant types, BND): a region record names the structural word BND in the place of its allele"
notes = "A region whose allele is the structural word BND: Ensembl VEP builds it with no allele string, dies reading its breakends (exit 255, `Can't use an undefined value as an ARRAY reference`) and writes no row; vep-rs annotates a chromosome_breakpoint over the span, one row per overlapping transcript, one of them compared."

[input]
format = "region"
text = """
21:14221000-14222000/BND
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-input-region/json_cache"
fasta = "tests/golden/116/GRCh38-identifiers/reference.fa.gz"
chromosomes = ["21"]

[run]
flags = []
format = "default"

[compare]
kind = "rows"
where = { record = "21:14221000-14222000/BND", feature = "ENST00000400577" }

[expected]
ensembl_vep_exit = 255
ensembl_vep = []
vep_rs = ["21:14221000-14222000 | chromosome_breakpoint | ENST00000400577 | coding_sequence_variant,intron_variant"]
