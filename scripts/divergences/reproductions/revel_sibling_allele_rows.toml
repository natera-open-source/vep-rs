entry = "revel_sibling_allele_rows"
page = "docs/plugins/annotation-store.md#9-revel-the-score-of-a-sibling-allele-on-a-multi-allelic-record"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "observed"
input_class_basis = "2 · 405.6 per million · 6 flag sets, 64 corpora"

# Two alleles of one codon that both give leucine; the table's rows at the position are A C M L 0.025, A G M V 0.043, A T M L 0.027.
[input]
format = "vcf"
text = """
21	13610388	two_leucines	A	C,T	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-revel/json_cache"

[run]
flags = ["--plugin", "REVEL,file={corpus}/plugin_data/revel.tsv.gz"]

# The T row: Ensembl VEP writes the C row's score, vep-rs the table's row for A T.
[compare]
kind = "rows"
where = { record = "two_leucines", feature = "ENST00000299443" }
columns = ["Location", "Allele", "Feature", "Amino_acids", "REVEL"]

[expected]
ensembl_vep = [
  "21:13610388 | C | ENST00000299443 | M/L | 0.025",
  "21:13610388 | T | ENST00000299443 | M/L | 0.025",
]
vep_rs = [
  "21:13610388 | C | ENST00000299443 | M/L | 0.025",
  "21:13610388 | T | ENST00000299443 | M/L | 0.027",
]
