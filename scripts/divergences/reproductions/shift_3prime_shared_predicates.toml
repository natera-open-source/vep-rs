entry = "shift_3prime_shared_predicates"
page = "docs/divergences/shift-3prime-shared-predicates.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 98.6 per million · 4 flag sets, 24 corpora"
notes = "The multi-allelic mechanism of the entry: the G allele shifts four bases along a run of Gs into intron 7 of HUNK and stores the span predicates there; the GT allele, shifted one base and still in exon 7, is tested against the intron's candidate terms."

[input]
format = "vcf"
text = """
21	31974714	multi_two_motifs_fwd	A	AG,AGT	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-identifiers/json_cache"
fasta = "tests/golden/116/GRCh38-identifiers/reference.fa.gz"

[run]
flags = ["--shift_3prime", "1", "--shift_length", "--hgvs"]

[compare]
kind = "rows"
where = { record = "multi_two_motifs_fwd", allele = ["GT", "TG"], feature = "ENST00000270112" }
columns = ["Allele", "Consequence", "cDNA_position", "CDS_position", "Protein_position", "Amino_acids", "HGVSc", "HGVSp", "HGVS_OFFSET", "SHIFT_LENGTH"]

[expected]
ensembl_vep = ["GT | splice_region_variant | - | - | - | - | ENST00000270112.7:c.1171_1172insTG | - | 1 | 1"]
vep_rs = ["TG | frameshift_variant,splice_region_variant | 1826-1827 | 1171-1172 | 391 | G/VX | ENST00000270112.7:c.1171_1172insTG | ENSP00000270112.2:p.Gly391ValfsTer19 | 1 | 1"]

[implementation]
code = [
    "crates/vep-effects/src/consequences.rs::consequence_shift",
    "crates/vep-effects/src/consequences.rs::consequences_of_the_record",
    "crates/vep-effects/src/consequences.rs::shifted_reference_row",
]
tests = [
    "crates/vep-cli/tests/shift_3prime.rs::the_reference_row_is_read_at_the_alternates_shifted_span",
    "crates/vep-effects/src/consequences.rs::tests::a_reference_row_reads_the_alternates_shifted_span_with_shift_length_0",
]
