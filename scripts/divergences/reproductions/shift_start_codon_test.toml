entry = "shift_start_codon_test"
page = "docs/divergences/shift-start-codon-test.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "observed"
input_class_basis = "2 · 74,048 per million · 3 flag sets, 101 corpora"
notes = "A deletion of the last intron base and the first three bases of the last exon of CLIC6, shifted one base into the exon; ENST00000360731 has no 5' UTR, so the start-codon test read from an undefined unshifted cDNA start adds start_lost and a ? HGVSp."

[input]
format = "vcf"
text = """
21	36088617	del_exon_boundary_coding	AGATT	A	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh37"
json_cache = "tests/golden/116/GRCh37/json_cache"
fasta = "tests/golden/116/GRCh37-hgvs/reference.fa.gz"

[run]
flags = ["--shift_3prime", "1", "--hgvs"]

[compare]
kind = "rows"
where = { record = "del_exon_boundary_coding", feature = "ENST00000360731" }
columns = ["Consequence", "Protein_position", "HGVSp", "HGVS_OFFSET"]

[expected]
ensembl_vep = ["frameshift_variant,start_lost,splice_region_variant | 652-653 | ENSP00000353959.3:p.Ile652_?653 | 1"]
vep_rs = ["frameshift_variant,splice_region_variant | 652-653 | ENSP00000353959.3:p.Ile652TrpfsTer14 | 1"]
