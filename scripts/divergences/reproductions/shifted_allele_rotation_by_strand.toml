entry = "shifted_allele_rotation_by_strand"
page = "docs/output/vep-and-tab.md#allele-on-a-coding-row-after-a-shift"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 76,935 per million · 96 flag sets, 129 corpora"
notes = "AGC inserted after the GCAGCAGC run in a coding exon of the reverse-strand ENST00000399136: the 3' shift along the transcript moves it eight bases, longer than the allele, so Ensembl VEP's count of seq_length - shift_length is negative and rotates nothing."

[input]
format = "vcf"
text = """
21	37833544	ins_after_trinucleotide_run	C	CAGC	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh37"
json_cache = "tests/golden/116/GRCh37-hgvs/json_cache"
fasta = "tests/golden/116/GRCh37-hgvs/reference.fa.gz"

[run]
flags = ["--shift_3prime", "1", "--shift_length", "--hgvs"]

[compare]
kind = "rows"
where = { record = "ins_after_trinucleotide_run", feature = "ENST00000399136" }
columns = ["Allele", "Consequence", "Codons", "Amino_acids", "HGVSc", "HGVSp", "SHIFT_LENGTH"]

[expected]
ensembl_vep = ["AGC | protein_altering_variant | ccc/cGCTcc | P/RS | ENST00000399136.1:c.455_457dup | ENSP00000382088.1:p.Pro153delinsArgSer | 8"]
vep_rs = ["GCA | inframe_insertion | ccc/cTGCcc | P/LP | ENST00000399136.1:c.455_457dup | ENSP00000382088.1:p.Leu152dup | 8"]

[implementation]
code = [
    "crates/vep-effects/src/coding.rs::rotate_shifted_allele",
    "crates/vep-effects/src/consequences.rs::shifted_display_allele",
    "crates/vep-effects/src/consequences.rs::used_ref_rotation",
    "crates/vep-effects/src/hgvs.rs::shift_feature_seq",
]
tests = [
    "crates/vep-cli/tests/input_strand.rs::shifted_codons_turn_the_allele_as_read_on_the_transcript_strand",
    "crates/vep-effects/src/consequences.rs::tests::a_shifted_coding_insertion_prints_the_rotated_allele",
    "crates/vep-effects/src/consequences.rs::tests::used_ref_of_a_shifted_coding_deletion_is_rotated_by_the_shift",
    "crates/vep-effects/src/hgvs.rs::tests::shift_feature_seq_turns_the_written_allele_by_the_transcript_strand_rule",
]
rules = [
    "tools/vep-formats-compare/src/rules/downstream.rs::unrotated_shifted_insertion",
]
