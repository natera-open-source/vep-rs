entry = "spdi_input_cache_fasta_resolution"
page = "docs/divergences/spdi-input.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "unobserved"
input_class_basis = "well-formed under the genomic SPDI input format, four colon-delimited fields S:P:D:I (Ensembl VEP documentation, \"Data formats\", Genomic SPDI notation); not seen in the measured datasets"
notes = "The first of the page's three readings, a version-less accession in SPDI form: Ensembl VEP reads SPDI through its database, whose slice adaptor resolves `NC_000021` through the synonym `NC_000021.9` as a prefix and annotates the record at 21:10538885; vep-rs matches the name against the cache's chromosomes and synonyms exactly, finds none and skips the record (`Sequence name NC_000021 not valid`). The span past the chromosome end and the deletion of length 0 are not reproduced."

[input]
format = "spdi"
text = """
NC_000021:10538884:A:C
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-input-spdi/json_cache"
fasta = "tests/golden/116/GRCh38-identifiers/reference.fa.gz"

[run]
perl_mode = "database"
flags = []
format = "default"

[compare]
kind = "rows"
where = { record = "NC_000021:10538884:A:C", feature = "ENST00000427445" }

[expected]
ensembl_vep = ["21:10538885 | C | ENST00000427445 | intron_variant"]
vep_rs = []
