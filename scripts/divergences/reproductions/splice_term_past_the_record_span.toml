entry = "splice_term_past_the_record_span"
page = "docs/divergences/splice-term-past-the-record-span.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "observed"
input_class_basis = "1 · 28.2 per million · no flag needed"
notes = "Two records of ClinVar on GRCh38, each with an alternate allele of four bases against a shorter reference allele that shares no base with it at any index. ClinVar 817939 replaces 22:20996964-20996965, the third-last and second-last base of the exon of LZTR1 that ends at 22:20996966 (exon 20 of ENST00000646124); the intron is 22:20996967-20997231. ClinVar 267720 replaces 13:32380145-32380147, the last base of the exon of BRCA2 that ends at 13:32380145 (exon 24 of ENST00000380152) and the first two bases of the intron 13:32380146-32394688. Ensembl VEP compares the alleles index by index to the longer allele's length (VariationFeatureOverlapAllele.pm:428-429) and places the one region of indices 0 to 3 from the record's start with no bound at its end (BaseTranscriptVariationAllele.pm:117-118). On the first record index 3 falls on 22:20996967, the intron's first base, and line 176 sets the donor's flag: three rows carry splice_donor_variant and no splice_region_variant. On the second record index 3 falls on 13:32380148, the intron's third base, and line 188 sets the donor region's flag: two rows carry splice_donor_region_variant beside the splice_donor_variant that the span's own bases give. vep-rs withdraws a term that rests only on positions past the end of the span where no base of the span lies in a window of that term: the first record's rows carry splice_region_variant, which the span gives inside the exon's last three bases, with the IMPACT of their most severe term, and the second record's rows keep splice_donor_variant without splice_donor_region_variant. On the second record line 144 also sets the intron term's flag from index 3 alone; the span holds the intron's first two bases, so intron_variant stays in both engines' rows. The first record's row on ENST00000700578, which holds the record inside a longer intron, is intron_variant in both engines."

[input]
format = "vcf"
text = """
22	20996964	817939	AA	TTGG	.	.	.
13	32380145	267720	GGT	ACAG	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38/json_cache"

[run]
flags = []

[compare]
kind = "rows"
where = { record = ["817939", "267720"], feature = ["ENST00000380152", "ENST00000415817", "ENST00000463909", "ENST00000528762", "ENST00000646124", "ENST00000700578"] }
columns = ["Uploaded_variation", "Location", "Feature", "Consequence", "IMPACT", "STRAND"]

[expected]
ensembl_vep = ["267720 | 13:32380145-32380147 | ENST00000380152 | splice_donor_variant,splice_donor_region_variant,coding_sequence_variant,intron_variant | HIGH | 1", "267720 | 13:32380145-32380147 | ENST00000528762 | splice_donor_variant,splice_donor_region_variant,3_prime_UTR_variant,intron_variant,NMD_transcript_variant | HIGH | 1", "817939 | 22:20996964-20996965 | ENST00000415817 | splice_donor_variant,3_prime_UTR_variant,NMD_transcript_variant | HIGH | 1", "817939 | 22:20996964-20996965 | ENST00000463909 | splice_donor_variant,non_coding_transcript_exon_variant | HIGH | 1", "817939 | 22:20996964-20996965 | ENST00000646124 | splice_donor_variant,frameshift_variant | HIGH | 1", "817939 | 22:20996964-20996965 | ENST00000700578 | intron_variant | MODIFIER | 1"]
vep_rs = ["267720 | 13:32380145-32380147 | ENST00000380152 | splice_donor_variant,coding_sequence_variant,intron_variant | HIGH | 1", "267720 | 13:32380145-32380147 | ENST00000528762 | splice_donor_variant,3_prime_UTR_variant,intron_variant,NMD_transcript_variant | HIGH | 1", "817939 | 22:20996964-20996965 | ENST00000415817 | splice_region_variant,3_prime_UTR_variant,NMD_transcript_variant | LOW | 1", "817939 | 22:20996964-20996965 | ENST00000463909 | splice_region_variant,non_coding_transcript_exon_variant | LOW | 1", "817939 | 22:20996964-20996965 | ENST00000646124 | frameshift_variant,splice_region_variant | HIGH | 1", "817939 | 22:20996964-20996965 | ENST00000700578 | intron_variant | MODIFIER | 1"]
