entry = "spliceai_chopped_multiallelic"
page = "docs/plugins/spliceai.md#a-substitution-beside-a-deletion-in-one-record"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 0.064 per million · 8 flag sets, 4 corpora"
notes = "The chopped substitution allele A at 26965500 is the SNV fixture's `C A` row; the deletion allele has no indel row in either engine."

[input]
format = "vcf"
text = """
21	26965499	chopped_multiallelic	GC	G,GA	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-spliceai-fixture/json_cache"
fasta = "tests/golden/116/GRCh38-plugin-spliceai-fixture/reference.fa.gz"

[run]
flags = [
  "--plugin",
  "SpliceAI,snv={corpus}/plugin_data/spliceai_scores.raw.snv.hg38.synthetic.vcf.gz,indel={corpus}/plugin_data/spliceai_scores.raw.indel.hg38.synthetic.vcf.gz",
]

[compare]
kind = "field"
field = "SpliceAI_pred"
with_key = true
where = { record = "chopped_multiallelic", allele = "A" }

[expected]
ensembl_vep = [
  "ENST00000284987=-", "ENST00000652031=-", "ENST00000970346=-",
  "ENST00001108182=-", "ENST00001108183=-", "ENST00001131497=-",
]
vep_rs = [
  "ENST00000284987=ADAMTS5|0.05|0.71|0.72|0.66|-47|-14|3|17",
  "ENST00000652031=ADAMTS5|0.05|0.71|0.72|0.66|-47|-14|3|17",
  "ENST00000970346=ADAMTS5|0.05|0.71|0.72|0.66|-47|-14|3|17",
  "ENST00001108182=ADAMTS5|0.05|0.71|0.72|0.66|-47|-14|3|17",
  "ENST00001108183=ADAMTS5|0.05|0.71|0.72|0.66|-47|-14|3|17",
  "ENST00001131497=ADAMTS5|0.05|0.71|0.72|0.66|-47|-14|3|17",
]

[implementation]
code = ["crates/vep-builtins/src/plugins/spliceai.rs::SpliceAiPlugin::is_variant_record"]
tests = [
    "crates/vep-cli/tests/plugin_documented_rows.rs::a_spliceai_substitution_beside_a_deletion_in_one_record_scores_its_own_row",
]
rules = ["tools/vep-plugin-pairs/src/rules/spliceai.rs::chopped_multiallelic"]
