input_class = "observed"
input_class_basis = "1 · 999,998 per million · no flag needed"
notes = "Thirteen made-up records on GRCh37, each on a transcript that carries no cds_start_NF and shows no start codon: its first codon is whole and is no start codon of the standard code, its recorded translation opens with the residue that codon names, and its record carries no consensus coding sequence id. Ensembl VEP reads the first three coding positions of every transcript without the flag as the start codon (VariationEffect.pm:975-986) and writes start_lost or start_retained_variant from tests that hold the edited bases against the standard start codon, the codon of Met (:941, :1022, :1065) or the residues at position 1 against each other (:878-882); vep-rs writes neither term, and the row carries the terms the sequence supports. Nine records lie on ENST00000420031, a reverse-strand transcript of NBPF1 whose coding sequence opens at cDNA 19, 1:16901033, behind a 5' UTR of 18 bases, on a codon of Ile at 1:16901033-16901031. residue_kept changes the codon's third base and keeps Ile: start_lost,synonymous_variant against synonymous_variant. residue_changed changes the first base, Ile to Val: start_lost against missense_variant. standard_start_codon_made changes the third base so that the three bases are the standard start codon, Ile to Met: start_lost,start_retained_variant against missense_variant. one_base_deleted removes the first coding base: frameshift_variant,start_lost against frameshift_variant. one_base_deleted_start_codon_made removes the second coding base, after which the three bases at the old coding start are the standard start codon: frameshift_variant,start_retained_variant against frameshift_variant. first_codon_deleted removes the three bases: start_lost,inframe_deletion against inframe_deletion. three_bases_inserted adds three bases between the second and the third coding base, Ile to Ile and Ala: start_lost against inframe_insertion. deleted_from_5_prime_utr removes the last two bases of the 5' UTR and the first coding base: start_lost,5_prime_UTR_variant against coding_sequence_variant,5_prime_UTR_variant. symbolic_deletion is a <DEL> of 1:16901025-16901040, both ends in the first exon: Ensembl VEP writes start_lost (:886-896) and start_retained_variant (:961 through :1037) beside frameshift_variant,feature_truncation,5_prime_UTR_variant, and vep-rs those three terms alone. Three records lie on ENST00000600312, a forward-strand transcript with no 5' UTR whose first base, 21:37402368, opens a codon of Leu that is no start codon. residue_changed_at_first_base changes that base, Leu to Val: start_lost against missense_variant, the term coming from the residues (:878-882), since the test of :941 returns at :926 on a transcript without a 5' UTR. one_base_deleted_at_first_codon removes the second coding base: frameshift_variant,start_lost against frameshift_variant. symbolic_deletion_at_first_base is a <DEL> of 21:37402368-37402373: start_lost and start_retained_variant beside feature_truncation,inframe_deletion against those two terms alone. stop_codon_made_at_first_codon lies on ENST00000601068, a reverse-strand transcript with no 5' UTR that opens on a codon of Cys at 21:47190005-47190003, and changes the codon's third base into a stop codon's: stop_gained,start_lost against stop_gained. Each record writes the same number of rows in both engines, and one row differs, the one compared here, in the Consequence and, where the most severe term changes, in IMPACT. The committed GRCh37 cache holds the three transcripts and no flag is needed. No committed cache holds a transcript whose first codon the start exon's phase pads while its record carries no cds_start_NF, nor one whose coding start an edit of the model touches, so the record has no line of either kind."

