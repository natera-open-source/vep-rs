1	16901033	residue_changed_1_16901033	T	C	.	.	.
1	16901031	standard_start_codon_made_1_16901031	A	C	.	.	.
1	16901032	one_base_deleted_1_16901033	AT	A	.	.	.
1	16901031	one_base_deleted_start_codon_made_1_16901032	AA	A	.	.	.
1	16901030	first_codon_deleted_1_16901031	CAAT	C	.	.	.
1	16901031	three_bases_inserted_1_16901031	A	AGCG	.	.	.
1	16901032	deleted_from_5_prime_utr_1_16901033	ATGA	A	.	.	.
1	16901024	symbolic_deletion_1_16901025	N	<DEL>	.	.	SVTYPE=DEL;END=16901040
21	37402368	residue_changed_at_first_base_21_37402368	C	G	.	.	.
21	37402368	one_base_deleted_at_first_codon_21_37402369	CT	C	.	.	.
21	37402367	symbolic_deletion_at_first_base_21_37402368	N	<DEL>	.	.	SVTYPE=DEL;END=37402373
21	47190003	stop_codon_made_at_first_codon_21_47190003	A	T	.	.	.
"""

