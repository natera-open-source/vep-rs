entry = "start_codon_removed_without_five_prime_utr"
page = "docs/divergences/start-codon-removed-without-five-prime-utr.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "1 · 14,695 per million · no flag needed"
notes = "Two deletions written for the entry at 21:32298972 on GRCh38, the first coding base of two forward-strand transcripts of one gene that share their start codon: ENST00000303645 holds 117 bases of 5' UTR before it and ENST00000339944 opens on it. The first record removes the three bases of the start codon, the second the first two codons; the triplet left at the start of the coding sequence is no ATG in either. Both engines write start_lost beside inframe_deletion on ENST00000303645. On ENST00000339944 Ensembl VEP writes inframe_deletion alone with a del protein notation, and vep-rs writes the row of the other transcript."

[input]
format = "vcf"
text = """
21	32298971	start_codon_removed	CATG	C	.	.	.
21	32298971	two_codons_removed	CATGGCC	C	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-loftee-fixture/json_cache"
fasta = "tests/golden/116/GRCh38-plugin-loftee-fixture/reference.fa.gz"

[run]
flags = ["--hgvs"]

[compare]
kind = "rows"
where = { record = ["start_codon_removed", "two_codons_removed"], feature = ["ENST00000303645", "ENST00000339944"] }
columns = ["Uploaded_variation", "Feature", "Consequence", "cDNA_position", "CDS_position", "IMPACT", "HGVSp"]

[expected]
ensembl_vep = [
    "start_codon_removed | ENST00000303645 | start_lost,inframe_deletion | 118-120 | 1-3 | HIGH | ENSP00000306697.5:p.Met1?",
    "start_codon_removed | ENST00000339944 | inframe_deletion | 1-3 | 1-3 | MODERATE | ENSP00000343661.4:p.Met1del",
    "two_codons_removed | ENST00000303645 | start_lost,inframe_deletion | 118-123 | 1-6 | HIGH | ENSP00000306697.5:p.MetAla1_?2",
    "two_codons_removed | ENST00000339944 | inframe_deletion | 1-6 | 1-6 | MODERATE | ENSP00000343661.4:p.Met1_Ala2del",
]
vep_rs = [
    "start_codon_removed | ENST00000303645 | start_lost,inframe_deletion | 118-120 | 1-3 | HIGH | ENSP00000306697.5:p.Met1?",
    "start_codon_removed | ENST00000339944 | start_lost,inframe_deletion | 1-3 | 1-3 | HIGH | ENSP00000343661.4:p.Met1?",
    "two_codons_removed | ENST00000303645 | start_lost,inframe_deletion | 118-123 | 1-6 | HIGH | ENSP00000306697.5:p.MetAla1_?2",
    "two_codons_removed | ENST00000339944 | start_lost,inframe_deletion | 1-6 | 1-6 | HIGH | ENSP00000343661.4:p.MetAla1_?2",
]

[implementation]
code = [
    "crates/vep-effects/src/coding.rs::PerlCodingEval::start_codon_removed_without_five_prime_utr",
    "crates/vep-effects/src/coding.rs::PerlCodingEval::start_lost",
]
tests = [
    "crates/vep-cli/tests/start_codon_removed_without_a_five_prime_utr.rs::the_start_codon_removed_whole_is_start_lost_on_a_transcript_without_a_five_prime_utr",
    "crates/vep-cli/tests/start_codon_removed_without_a_five_prime_utr.rs::two_leading_codons_removed_whole_are_start_lost_on_a_transcript_without_a_five_prime_utr",
]
rules = [
    "tools/vep-formats-compare/src/rules/removed_start.rs::start_codon_removed_without_five_prime_utr_pair",
    "tools/vep-outputs-compare/src/rules/row.rs::start_codon_removed_without_five_prime_utr_pair",
    "tools/vep-plugin-pairs/src/rules/term_pair.rs::start_codon_removed_without_five_prime_utr_pair",
]
