entry = "stop_codon_behind_last_residue_without_stop_codon"
page = "docs/divergences/stop-codon-behind-last-residue-without-stop-codon.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "unobserved"
input_class_basis = "well-formed under the VCF 4.2 specification, section 1.4.1 \"Fixed fields\", REF and ALT, each a string of bases; not seen in the measured datasets"
notes = "Nine records written for the entry, on GRCh37, each at the coding end of a transcript whose record shows no stop codon there. Eight bring a stop codon behind the last residue from inside the last whole codon and keep that codon's residue: six insert three bases between the codon's second and third base, and two replace the codon's third base by four bases, a substitution of several bases. The transcripts without cds_end_NF: the forward-strand ENST00000545697 of LTBP4 (2,697 coding bases, 899 codons, the last the codon of Leu at 19:41133636-41133638, then a 3' UTR of 549 bases), which takes one record of each kind; ENST00000600312 (forward strand, 38 codons, the last the codon of Arg) and ENST00000593412 (reverse strand, 117 codons, the last the codon of Gly) on chromosome 21, which have no 3' UTR; ENST00000419804 of PNCK (reverse strand, 128 coding bases, 42 codons and two bases, then a 3' UTR of 293 bases; ENST00000425526 and ENST00000458354 share its coding sequence); and ENST00000586663 of PEX12 (reverse strand, 1,076 coding bases, 358 codons and two bases on the transcript's last two bases, which adenines complete to the codon of Lys). The transcripts with cds_end_NF: ENST00000423545 of PNCK, which holds the coding end of ENST00000419804; ENST00000451489 of MAP3K7CL (forward strand, 94 codons, the last the codon of Glu on the transcript's last bases); and ENST00000405964 of C21orf91 (reverse strand, 727 coding bases, 242 codons and one base, the transcript's last). On each of these rows the Amino_acids cell is the last codon's residue against that residue followed by a stop. Ensembl VEP reads a protein that is unchanged up to its old length and has a stop after it as a stop codon kept (VariationEffect.pm:1357, first clause, asked at :1315) and withholds stop_gained behind that answer (:1221); neither line reads the coding end or the flag. It writes inframe_insertion,stop_retained_variant on eleven rows. vep-rs reads that no stop codon stood at the coding end to be kept and writes stop_gained,inframe_insertion; IMPACT follows the terms, MODERATE against HIGH. The ninth record writes the edit of the PEX12 insertion one base on, between the last whole codon and the two bases after it: there Ensembl VEP reads an incomplete terminal codon before its stop codon tests (:1296) and both engines write stop_gained,inframe_insertion,incomplete_terminal_codon_variant, the twelfth row and an equal one. The prepare steps copy the committed GRCh37 cache and add the one transcript shard of the committed cache of GRCh37-plugin-downstream-own-span that holds the PNCK transcripts, so that one cache holds every kind of coding end; the copy carries no checksum manifest, since the manifest lists the first cache's files alone. No flag is needed."

prepare = [
  'cp -r "$CORPUS/json_cache" "$STAGE/json-cache" && rm "$STAGE/json-cache/CHECKSUMS.sha256"',
  'shard=transcripts/X/152000001-153000000.json.gz; cp "$REPO/tests/golden/116/GRCh37-plugin-downstream-own-span/json_cache/$shard" "$STAGE/json-cache/$shard"',
]

