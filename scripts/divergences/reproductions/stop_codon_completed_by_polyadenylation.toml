entry = "stop_codon_completed_by_polyadenylation"
page = "docs/divergences/stop-codon-completed-by-polyadenylation.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "1 · 999,950 per million · no flag needed"
notes = "Twenty-one records written for the entry on GRCh38, each at the coding end of a human mitochondrial transcript whose coding sequence ends inside its stop codon on the transcript's last base, with no 3' UTR, under codon table 2 and without cds_end_NF. ENST00000361390 of MT-ND1 holds 956 coding bases at MT:3307-4262: 318 codons and the first two bases of the stop codon, at MT:4261 and MT:4262. ENST00000361381 of MT-ND4 holds 1,378 coding bases at MT:10760-12137: 459 codons and the first base of the stop codon, at MT:12137. The next genomic base opens a tRNA gene on both, and the adenines of the poly(A) tail complete the codon, as the translation exceptions of the reference record NC_012920.1 state at those positions. Ensembl VEP reads an allele that starts in those bases as one in an incomplete terminal codon (partial_codon, VariationEffect.pm:1601-1610), so stop_lost, stop_retained and frameshift return 0 (:1240, :1296, :1548) and inframe_insertion asks neither the incomplete codon nor the inserted length (:1100-1128): the rows carry incomplete_terminal_codon_variant and no stop term. For a deletion that starts in the last whole codon it reads the peptide alleles, whose reference ends on the unknown residue of the incomplete codon and holds no stop (:1259-1260). vep-rs reads every record on the completed stop codon with the poly(A) tail after it. The thirteen records on ENST00000361390 and the eight on ENST00000361381 are substitutions of a stop codon base (stop_lost, or stop_retained_variant where the new codon is a stop codon of the table), deletions of one base or both (stop_lost, or stop_retained_variant where the deleted base is an adenine and the tail's adenines follow), insertions before the codon (frameshift_variant for one base, inframe_insertion for three) and inside it (stop_retained_variant or stop_lost, by the codon the bases then spell), deletions from the last whole codon into the stop codon (frameshift_variant,stop_lost, or inframe_deletion alone where three bases go and the bases left spell a stop codon with the tail), and alleles that run from the stop codon past the transcript's end (stop_lost,3_prime_UTR_variant for a deletion, coding_sequence_variant,3_prime_UTR_variant for a substitution of as many bases). The position cells are equal in both engines on every row. The committed GRCh38 cache holds both transcripts and no flag is needed."

