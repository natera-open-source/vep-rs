notes = "ClinVar record 2673709 on GRCh38: a deletion of one base, 36993663, on ENST00000673897, a forward-strand transcript of MLH1 whose stop codon is c.115-117. The codon's first two bases end exon 1 at 36993662-36993663 and its third opens exon 2 at 37000955, with an intron of 7,291 bases, 36993664-37000954, between them. The deleted base is the codon's second, c.116 at cDNA 133. The last three genomic positions of the coding region are 37000953-37000955, two intron bases and the codon's third base, and the deletion lies 7,290 positions before them."

