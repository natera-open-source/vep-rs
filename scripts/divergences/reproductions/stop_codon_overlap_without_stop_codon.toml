input_class = "observed"
input_class_basis = "1 · 137,713 per million · no flag needed"
notes = "Eleven records written for the entry, on GRCh37, each an insertion or deletion at the coding end of a transcript that carries no cds_end_NF and whose last three coding positions are no stop codon. On the forward-strand ENST00000243562 of LTBP4 (558 coding bases, 186 codons, the last the codon of Val at 19:41125377-41125379, then a 3' UTR of 1,743 bases) the first record deletes the codon's middle base and the second its last base with the first 3' UTR base. On the reverse-strand ENST00000287968 of NBPF1 (164 codons, the last the codon of Pro) the third deletes the last codon, the one 3' UTR base of its exon and the first base of the intron. ENST00000593412 and ENST00000595468, on the reverse strand of chromosome 21, have no 3' UTR and end on the codons of Gly and Glu: two records delete the middle base of the first one's last codon and the whole codon with the base past the transcript's end, and one inserts a base before the second one's last codon that leaves a stop codon in the last three coding positions. ENST00000419804 of PNCK (reverse strand, 128 coding bases, 42 codons and two bases, then a 3' UTR of 293 bases; ENST00000425526 and ENST00000458354 share its coding sequence) and ENST00000586663 of PEX12 (reverse strand, 1,076 coding bases, 358 codons and two bases on the transcript's last two bases, which adenines complete to the codon of Lys) each lose the last base of their last whole codon, and a further record inserts a base before that base of ENST00000586663 that leaves a stop codon in the last three coding positions. On ENST00000361453 of MT-ND2 (1,042 coding bases, 347 codons and one base that the adenines of the poly(A) tail complete to a stop codon of the vertebrate mitochondrial code) one record deletes the last base of the last whole codon and one inserts a base before it. Ensembl VEP reads the last three coding positions as the stop codon on every transcript without the flag (VariationEffect.pm:1373-1381 and :1400-1427). It writes stop_lost where its edit leaves a sequence shorter than the coding sequence or no stop codon at those positions (:1466-1480), and stop_retained_variant where the edit leaves a stop codon there or cannot be placed (:1318 with :1508). vep-rs reads that the positions each record meets are no base of a stop codon and writes the frameshift_variant or coding_sequence_variant the same record takes on a transcript with the flag. Thirteen rows differ, each in the Consequence alone but for IMPACT, which follows it on four. The fourteenth row is the PNCK record on ENST00000423545, which has the same coding end and carries cds_end_NF: both engines write frameshift_variant alone there. The prepare steps copy the committed GRCh37 cache and add the one transcript shard of the committed cache of GRCh37-plugin-downstream-own-span that holds the PNCK transcripts, so that one cache holds every kind of coding end; the copy carries no checksum manifest, since the manifest lists the first cache's files alone. No committed cache of a human assembly holds a transcript that ends on one or two bases adenines would complete to a stop codon while its record does not show the model complete, so no record stands at that kind of coding end. No flag is needed."

prepare = [
  'cp -r "$CORPUS/json_cache" "$STAGE/json-cache" && rm "$STAGE/json-cache/CHECKSUMS.sha256"',
  'shard=transcripts/X/152000001-153000000.json.gz; cp "$REPO/tests/golden/116/GRCh37-plugin-downstream-own-span/json_cache/$shard" "$STAGE/json-cache/$shard"',
]

