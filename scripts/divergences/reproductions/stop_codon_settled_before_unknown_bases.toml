input_class_basis = "1 · 0.26 per million · no flag needed"
notes = "Five insertions written for the entry after 21:10567700, the last base of codon 141 of the forward-strand ENST00000622113. Three hold four unknown bases after a sense codon and a stop codon: one of ten bases, one of twelve, and one whose first four bases equal the four reference bases after the point, so that its last placement is four bases 3'. The fourth is the twelve-base insertion with its unknown bases completed, on which the engines agree. The fifth holds its unknown bases after two sense codons, so no stop codon is settled, and the engines agree on it too. Two more insert thirteen bases between 21:30165951 and 21:30165952, six coding bases before the stop codon of the one-exon reverse-strand ENST00000286808: a sense codon, a stop codon, a third codon and four bases, unknown in the sixth record and known in the seventh. On the sixth Ensembl VEP writes stop_retained_variant, for an overlap it reads with the insertion's start moved by the inserted length and a stop codon test it does not make; on the seventh the engines agree. Eight more keep the stop codon: a stop codon and four unknown bases, of seven bases and of nine, and each with its unknown bases completed, inserted after 21:10605549, between the last sense codon and the stop codon of ENST00000622113, and, as their reverse complement, after 21:14108995, between the stop codon and the last sense codon of the reverse-strand ENST00000681601. On the completed records the engines differ by older entries alone: the HGVSp of a kept stop codon (`hgvsp_stop_codon_protein_comparison`) and, on the forward strand, the terms of the seven-base insertion (`stop_codon_overlap_insertion_range`). Six more are written in an intron, three bases before a coding exon, and open with the four bases after their point, so the 3' rule places them inside the exon: four after 21:10542391 on ENST00000622113, placed between codons 22 and 23, and two after 21:14166454 on ENST00000681601, placed after the second base of codon 215. At that placement the known bases read a glutamate codon and a stop codon before four unknown bases (one record of whole codons and one frameshift on the forward strand, one frameshift on the reverse strand); one forward record holds its unknown bases before any stop codon, and the engines agree on it; and a completion of each strand's frameshift differs by the older entry `hgvsp_shifted_indel_written_span_gate` alone."

