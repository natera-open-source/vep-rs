    "21:39671501-39671700 | deletion | ENST00000419868 | stop_lost,feature_truncation,coding_sequence_variant,3_prime_UTR_variant | HIGH | cds_end_NF",
    "21:39671501-39671700 | deletion | ENST00000328656 | frameshift_variant,feature_truncation | HIGH | -",
    "21:44485651-44485760 | deletion | ENST00000441030 | stop_lost,feature_truncation,coding_sequence_variant,3_prime_UTR_variant | HIGH | cds_end_NF",
    "21:34947401-34947440 | deletion | ENST00000595468 | stop_lost,feature_truncation,coding_sequence_variant,3_prime_UTR_variant | HIGH | -",
