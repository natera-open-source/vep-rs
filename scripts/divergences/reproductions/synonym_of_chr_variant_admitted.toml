entry = "synonym_of_chr_variant_admitted"
page = "docs/cache-setup.md#chromosome-names"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "unobserved"
input_class_basis = "well-formed under the VCF 4.2 specification, section 1.4.1 \"Fixed fields\", CHROM (a String, no whitespace permitted); not seen in the measured datasets"
notes = "chrNC_000021.9 passes Ensembl VEP's check because its chr-stripped spelling is a synonym of 21; the lookup then tries the name itself, which no source holds."

[input]
format = "vcf"
text = """
chrNC_000021.9	43774760	syn_chr_accession	C	T	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-synonyms/json_cache"
chromosomes = ["21"]

[run]
flags = []

[compare]
kind = "rows"
where = { record = "syn_chr_accession" }

[expected]
ensembl_vep = ["chrNC_000021.9:43774760 | T | - | intergenic_variant"]
vep_rs = []

[implementation]
code = [
    "crates/vep-cli/src/validate.rs::ReferenceChecks::source_lists",
    "crates/vep-core/src/synonyms.rs::ChromosomeSynonyms::source_chr_name",
]
tests = [
    "crates/vep-core/src/synonyms.rs::tests::an_organelle_is_reached_by_its_own_name_or_a_synonym_and_by_nothing_else",
    "crates/vep-core/src/synonyms.rs::tests::nc_accession_resolves_to_cache_name",
]
