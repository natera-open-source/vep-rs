entry = "tabix_allele_case_insensitive_match"
page = "docs/plugins.md#3-a-score-table-row-whose-alleles-are-written-in-lower-case"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "unobserved"
input_class_basis = "well-formed under the VCF 4.2 specification, section 1.4.1 \"Fixed fields\", REF and ALT (bases case insensitive), which the SpliceAI and gnomADMt fixture tables follow, and under the AVI plugin's header (AVI.pm:24-58), which sets no letter case for its table's alleles; not seen in the measured datasets"
notes = "AVI, the plugin the entry names; the corpus table with the 21:5030633 C>T row's alleles lower-cased and re-indexed. vep-rs reads a row in either letter case in AlphaMissense, AVI, CADD, gnomADMt, GWAS, OpenTargets, REVEL, SpliceAI, SpliceVault and TranscriptAnnotator alike."
prepare = [
  "zcat \"$CORPUS/avi_scores.synthetic.tsv.gz\" | awk -F'\\t' -v OFS='\\t' '$1 == \"chr21\" && $2 == 5030633 && $4 == \"T\" { $3 = \"c\"; $4 = \"t\" } { print }' | bgzip -c > \"$STAGE/avi_scores.lower.synthetic.tsv.gz\"",
  "tabix -s 1 -b 2 -e 2 \"$STAGE/avi_scores.lower.synthetic.tsv.gz\"",
]

[input]
format = "vcf"
text = """
21	5030633	.	C	T	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-avi-fixture/json_cache"

[run]
flags = ["--plugin", "AVI,file={stage}/avi_scores.lower.synthetic.tsv.gz,raw=1,links=1"]

[compare]
kind = "field"
field = "AVI_PHRED"
where = { record = "21_5030633_C/T" }

[expected]
ensembl_vep = ["-"]
vep_rs = ["3.465"]

[implementation]
code = [
    "crates/vep-builtins/src/tabix.rs::allele_match::TrimmedKeys::any_equal",
    "crates/vep-builtins/src/tabix.rs::allele_match::matched_allele_offset",
    "crates/vep-builtins/src/tabix.rs::allele_match::matched_variant_alleles",
]
tests = [
    "crates/vep-cli/tests/plugin_documented_rows.rs::an_avi_row_written_in_lower_case_scores_the_record_it_describes",
]
