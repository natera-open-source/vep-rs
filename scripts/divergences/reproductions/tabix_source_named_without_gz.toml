entry = "tabix_source_named_without_gz"
page = "docs/divergences/tabix-source-named-without-gz.md"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "unobserved"
input_class_basis = "well-formed under the preparation rule for a --custom file, compressed using bgzip and indexed using tabix, which sets no rule on the file's name (Ensembl VEP documentation, \"Custom annotations\", Preparing files); not seen in the measured datasets"
notes = "The corpus's bgzipped, tabix-indexed sites.vcf.gz copied with its index under a name without .gz: Ensembl VEP's tabix parser tests the name before opening the file (TabixParser.pm:52) and ends the run with `Input file is not bgzipped, cannot use tabix`, exit 255, no output; vep-rs opens the copy by content and writes the rows it writes for the original."
# The source and its index, byte for byte, under a name that fails the /\.b?gz$/ test.
prepare = [
  "cp \"$CORPUS/custom/sites.vcf.gz\" \"$STAGE/sites_plain.vcf\"",
  "cp \"$CORPUS/custom/sites.vcf.gz.tbi\" \"$STAGE/sites_plain.vcf.tbi\"",
]

[input]
format = "vcf"
text = """
21	5227532	rs1979768284	T	TTTCCTCTCCTCTCTT,TTTCCTCTCTT	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-custom/json_cache"

[run]
flags = ["--custom", "file={stage}/sites_plain.vcf,short_name=sites,format=vcf,type=exact,fields=AF%CLASS"]

# The record's two allele rows: the first allele matches the source's multi_1 row, the second matches nothing.
[compare]
kind = "rows"
where = { record = "rs1979768284" }
columns = ["Location", "Allele", "Feature", "Consequence", "sites", "sites_AF"]

[expected]
ensembl_vep_exit = 255
ensembl_vep = []
vep_rs = [
  "21:5227532-5227533 | TTCCTCTCCTCTCTT | - | intergenic_variant | multi_1 | 0.003",
  "21:5227532-5227533 | TTCCTCTCTT | - | intergenic_variant | - | -",
]
