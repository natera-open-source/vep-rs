entry = "tabix_window_below_position_one"
page = "docs/divergences/tabix-window-below-position-one.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "unobserved"
input_class_basis = "well-formed under the VCF 4.2 specification, section 1.4.1 \"Fixed fields\", POS, which counts the 1st base as position 1, so a record at position 1 or 2 is legal; not seen in the measured datasets"
notes = "Ensembl VEP's warnings file carries `Plugin 'CADD' went wrong: You must specify a region in the format chr, chr:start or chr:start-end` for pos1 and `Plugin 'CADD' went wrong: ERROR: No start specified` for pos2; CADD stands for the seven plugins the page names."
# The corpus's SNV table with its three rows at 19268555 moved to positions 1, 2 and 3 and their alternate set to G,
# so each of the three records has one row at its own position; the two header lines are kept.
prepare = [
  "zcat \"$CORPUS/plugin_data/whole_genome_SNVs_synthetic.tsv.gz\" | awk -F '\\t' -v OFS='\\t' '/^#/ { print; next } $2 == 19268555 { pos++; $2 = pos; $4 = \"G\"; print }' | bgzip > \"$STAGE/cadd_pos_synthetic.tsv.gz\"",
  "tabix -s 1 -b 2 -e 2 \"$STAGE/cadd_pos_synthetic.tsv.gz\"",
]

[input]
format = "vcf"
text = """
21	1	pos1	C	G	.	.	.
21	2	pos2	C	G	.	.	.
21	3	pos3	C	G	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-cadd-fixture/json_cache"

[run]
flags = ["--plugin", "CADD,snv={stage}/cadd_pos_synthetic.tsv.gz"]

# The three records are intergenic, one row each; the table names all three positions.
[compare]
kind = "rows"
where = { record = ["pos1", "pos2", "pos3"] }
columns = ["Location", "Allele", "Feature", "Consequence", "CADD_PHRED", "CADD_RAW"]

[expected]
ensembl_vep = [
  "21:1 | G | - | intergenic_variant | - | -",
  "21:2 | G | - | intergenic_variant | - | -",
  "21:3 | G | - | intergenic_variant | 3.312 | 1.239896",
]
vep_rs = [
  "21:1 | G | - | intergenic_variant | 39.801 | 9.984677",
  "21:2 | G | - | intergenic_variant | 22.363 | 7.465190",
  "21:3 | G | - | intergenic_variant | 3.312 | 1.239896",
]

[implementation]
code = [
    "crates/vep-builtins/src/plugins/alpha_missense.rs::AlphaMissensePlugin::window",
    "crates/vep-builtins/src/plugins/cadd.rs::VariantSide::region",
    "crates/vep-builtins/src/plugins/transcript_annotator.rs::TranscriptAnnotatorPlugin::window",
    "crates/vep-builtins/src/tabix.rs::TabixAnnotator::query_tabix_region",
]
tests = [
    "crates/vep-builtins/src/plugins/alpha_missense.rs::tests::the_window_is_clamped_at_position_one",
    "crates/vep-builtins/src/plugins/cadd.rs::tests::indel_rows_at_position_one_are_read_for_records_starting_at_two",
    "crates/vep-builtins/src/plugins/cadd.rs::tests::records_at_the_first_two_positions_of_a_chromosome_are_scored",
]
