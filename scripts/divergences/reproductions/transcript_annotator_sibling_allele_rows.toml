entry = "transcript_annotator_sibling_allele_rows"
page = "docs/plugins/annotation-store-divergences.md#5-transcriptannotator-the-table-row-of-a-sibling-allele"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 405.6 per million · 5 flag sets, 80 corpora"
notes = "The table holds a row for the `T` allele alone; the `T` allele's row agrees between the engines."

[input]
format = "vcf"
text = """
21	10521702	rs463608	C	T,A	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-transcript-annotator/json_cache"

[run]
flags = ["--plugin", "TranscriptAnnotator,file={corpus}/data/transcript_annotator.tsv.gz"]

[compare]
kind = "field"
field = "transcript_annotator_SIFT_score"
where = { record = "rs463608", allele = "A", feature = "ENST00000618007" }

[expected]
ensembl_vep = ["0.61"]
vep_rs = ["-"]

[implementation]
code = [
    "crates/vep-builtins/src/plugins/transcript_annotator.rs::TranscriptAnnotatorPlugin::matching_values",
]
tests = [
    "crates/vep-cli/tests/plugin_documented_rows.rs::a_transcript_annotator_row_is_written_on_the_allele_it_names",
]
