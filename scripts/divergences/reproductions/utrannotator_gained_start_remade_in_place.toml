entry = "utrannotator_gained_start_remade_in_place"
page = "docs/divergences/utrannotator-gained-start-remade-in-place.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "observed"
input_class_basis = "2 · 63,698 per million · 4 flag sets, 132 corpora"
notes = "The constructed record inserts one base after the second base of the start codon at cDNA 146 (5' UTR index 145) of ENST00000427445. The base repeats the codon's third, so the codon stands at index 145 with one base directly after it. Ensembl VEP names that codon as gained; vep-rs reports the frameshift of the codon's own uORF, as both engines do for the same base written directly after the codon."

[input]
format = "vcf"
text = """
21	10524584	utr_ins_kept_start	T	TG	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-utr-annotator/json_cache"
fasta = "tests/golden/116/GRCh38-plugin-utr-annotator/reference.fa.gz"

[run]
flags = ["--plugin", "UTRAnnotator,file={corpus}/data/uORF_5UTR_GRCh38_PUBLIC.chr21.txt"]

[compare]
kind = "field"
field = "5UTR_consequence"
where = { record = "utr_ins_kept_start", feature = "ENST00000427445" }

[expected]
ensembl_vep = ["5_prime_UTR_premature_start_codon_gain_variant"]
vep_rs = ["5_prime_UTR_uORF_frameshift_variant"]

[implementation]
code = [
    "crates/vep-builtins/src/plugins/utr_annotator.rs::MutatedUtr::uaug_gained",
    "crates/vep-builtins/src/plugins/utr_annotator.rs::MutatedUtr::uframeshift",
    "crates/vep-builtins/src/plugins/utr_annotator.rs::insertion_writings",
]
tests = [
    "crates/vep-builtins/src/plugins/utr_annotator.rs::tests::insertion_that_leaves_a_start_codon_at_its_own_index_gains_nothing",
    "crates/vep-builtins/src/plugins/utr_annotator.rs::tests::insertion_that_leaves_a_start_codon_at_its_own_index_shifts_its_orf",
    "crates/vep-cli/tests/utrannotator_insertion_at_start_codon.rs::insertion_that_leaves_a_start_codon_at_its_own_index_reports_its_frameshift",
]
rules = [
    "tools/vep-formats-compare/src/rules/utrannotator.rs::gained_start_remade_in_place_row",
    "tools/vep-plugin-pairs/src/rules/utrannotator.rs::gained_start_remade_in_place_row",
]
