entry = "utrannotator_missing_file"
page = "docs/plugins/transcript-model.md#utrannotator"
verified_against = "116.2"
image = "ensemblorg/ensembl-vep@sha256:5c57abdc40b637cac198370b4c114777fa24de3336141fdf09d2b0c43cd4b8da"
input_class = "malformed"
input_class_basis = "file is the required path to the plugin's data file (the UTRAnnotator plugin's header, \"file : (Required) Path to UTRAnnotator data file\"): the run passes a path that names no file"
notes = "The `file=` path names no file. Ensembl VEP prints `Warning: small ORF file not found` on standard output and annotates with `Evidence=NA`; vep-rs refuses the plugin with a warning and writes no UTRAnnotator field."

[input]
format = "vcf"
text = """
21	10524584	uaug_lost_snv	T	C	.	.	.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-plugin-utr-annotator/json_cache"
fasta = "tests/golden/116/GRCh38-plugin-utr-annotator/reference.fa.gz"

[run]
flags = ["--plugin", "UTRAnnotator,file={corpus}/data/no_such_file.txt"]

[compare]
kind = "field"
field = "5UTR_annotation"
where = { record = "uaug_lost_snv", feature = "ENST00000427445" }

[expected]
ensembl_vep = ["KozakContext=AGAATGT:type=uORF:KozakStrength=Moderate:DistanceToStop=48:DistanceToCDS=207:CapDistanceToStart=145:Evidence=NA"]
vep_rs = ["-"]
