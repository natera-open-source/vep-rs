entry = "vcf_hash_line_after_chrom"
page = "docs/divergences/vcf-hash-line-after-chrom.md"
verified_against = "116.3"
image = "ensemblorg/ensembl-vep@sha256:2a46b0ba4ac544a87136aad92af92050ccbbf09098c1ce306d7e88ef7ed19aa3"
input_class = "malformed"
input_class_basis = "a VCF \"contains meta-information lines, a header line, and then data lines\", a data line holding 8 fixed fields (VCF 4.2 specification, section 1 and section 1.4.1 \"Fixed fields\"): after the #CHROM header line stands a line prefixed with a single \"#\" that is not a data line"
notes = "The single-# line `#note` after the eight-sample #CHROM line: Ensembl VEP takes it as the column line, so the sample list is empty and --individual all writes no row; vep-rs reads the samples from the #CHROM line and writes the record's 28 individual rows. The first of the page's four effects (a refused list, a missing ZYG and the VCF header are the others)."

[input]
format = "vcf"
text = """
##fileformat=VCFv4.2
#CHROM	POS	ID	REF	ALT	QUAL	FILTER	INFO	FORMAT	S1	S2	S3	S4	S5	S6	S7	S8
#note
21	34716340	hb_multi	G	A,T	.	.	.	GT	0/1	1/2	0/0	2/2	0/2	1/1	./2	./.
"""

[cache]
species = "homo_sapiens"
assembly = "GRCh38"
json_cache = "tests/golden/116/GRCh38-individual/json_cache"

[run]
flags = ["--individual", "all"]
format = "default"

[compare]
kind = "count"
where = { record = "hb_multi" }

[expected]
ensembl_vep = ["0"]
vep_rs = ["28"]

[implementation]
code = [
    "crates/vep-cli/src/pipeline.rs::read_vcf_lines",
    "crates/vep-cli/src/vcf_parser.rs::sample_columns",
]
tests = [
    "crates/vep-cli/tests/documented_subsets.rs::hash_line_after_chrom_exclusion_is_documented",
    "crates/vep-cli/tests/individuals.rs::individual_all_reads_the_chrom_line_when_a_hash_line_follows_it",
]
