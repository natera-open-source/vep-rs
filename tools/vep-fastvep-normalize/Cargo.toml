[package]
name = "vep-fastvep-normalize"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Rewrites a fastVEP tab output so that its intergenic rows carry the Feature_type Ensembl VEP writes"
publish = false

[dependencies]
memchr = "2"

# Its own Cargo root: the repository workspace's commands do not reach this package, and
# a cargo command for it names this manifest.
[workspace]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
