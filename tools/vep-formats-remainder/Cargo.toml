[package]
name = "vep-formats-remainder"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Front end of scripts/concordance/compare_vep_formats.py: keeps back the record groups two VEP default- or tab-format outputs write alike and hands the rest to the Python comparator"
publish = false

[dependencies]
# The zlib-rs backend refuses the deflate streams zlib refuses, as the comparator's reader
# does; the default backend takes some of them.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
memchr = "2"

# Its own Cargo root: the repository workspace's commands do not reach this package, and
# a cargo command for it names this manifest.
[workspace]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
