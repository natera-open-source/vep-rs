[package]
name = "vep-genome-table"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Reader, writer and checker of the genome table under tests/genomes, and the digest of a vep-rs default-format output that its rows carry"
publish = false

[dependencies]
flate2 = "1"
sha2 = "0.11"

# Its own Cargo root: the repository workspace's commands do not reach this package, and
# a cargo command for it names this manifest.
[workspace]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
