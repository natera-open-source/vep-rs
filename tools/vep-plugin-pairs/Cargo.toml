[package]
name = "vep-plugin-pairs"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Plugin tuple scoring against an Ensembl VEP output and per-field plugin comparison of two VEP outputs"
publish = false

[lib]
name = "vep_plugin_pairs"
path = "src/lib.rs"

[[bin]]
name = "vep-plugin-pairs"
path = "src/main.rs"

[dependencies]
flate2 = "1"
libc = "0.2"
memchr = "2"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"

# Its own Cargo root: the repository workspace's commands do not reach this package, and
# a cargo command for it names this manifest.
[workspace]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
