[package]
name = "vep-prepare-benchmark-vcfs"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Prepares a directory of benchmark VCFs for a concordance run: plain text, one contig naming, canonical contigs only, with a manifest fixed to the byte"
publish = false

[dependencies]
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
memchr = "2"
sha2 = "0.11"

# Its own Cargo root: the repository workspace's commands do not reach this package, and
# a cargo command for it names this manifest.
[workspace]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
