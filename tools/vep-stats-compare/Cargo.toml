[package]
name = "vep-stats-compare"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Section-by-section comparison of two VEP statistics reports, with a JSON report and a verdict"
publish = false

# The zlib-rs backend: its inflate names a corrupt stream in zlib's own words, which the error
# line of a gzipped report that cannot be read carries.
[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

# Its own Cargo root: the repository workspace's commands do not reach this package, and
# a cargo command for it names this manifest.
[workspace]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
