[package]
name = "vep-storable-digest-join"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Joins two digest files of vep-storable-digest on the transcript id: ids in one cache only, identical, identical in content, differing"
publish = false

[dependencies]
# The Unicode general categories behind CPython's `\d` and `repr`.
unicode-general-category = "1"

# Its own Cargo root: the repository workspace's commands do not reach this package, and
# a cargo command for it names this manifest.
[workspace]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
