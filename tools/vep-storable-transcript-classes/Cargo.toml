[package]
name = "vep-storable-transcript-classes"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Classes the field differences of two Ensembl VEP Storable cache builds from the dumps of their differing transcripts"
publish = false

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# The Unicode general categories behind CPython's `\d` and `repr`.
unicode-general-category = "1"

# Its own Cargo root: the repository workspace's commands do not reach this package, and
# a cargo command for it names this manifest.
[workspace]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
