[package]
name = "vep-sv-compare"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "The structural-variant comparator of the concordance harness: tuple concordance between Ensembl VEP and a scored engine over a directory of VCF files and the two engines' default-format outputs, with per-file, per-type and pooled counts, the divergence masks of a reference release and four report files"
publish = false

[dependencies]
flate2 = "1"
libc = "0.2"
memchr = "2"
regex = "1"

[dev-dependencies]
serde_json = "1"

# Its own Cargo root: the repository workspace's commands do not reach this package, and
# a cargo command for it names this manifest.
[workspace]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
